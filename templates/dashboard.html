let monacoEditor = null;
let editorParams = []; // [{key, type, default}]

const EDITOR_TEMPLATE = `# Available: close open high low volume ts np ta
# ta.rsi() ta.ema() ta.sma() ta.macd() ta.bbands() ... + custom primitives
# Assign your result to the variable:  result = np.ndarray (one value per candle)

# --- EMA deviation (% above / below EMA) ---
ema    = ta.ema(close, period)
result = (close - ema) / ema * 100
`;

function openEditorModal() {
  closeIndModal();
  g('editorModal').classList.add('open');
  g('editorName').value = '';
  editorParams = [{ key: 'period', type: 'int', default: 14 }];
  renderEditorParams();
  initMonaco();
}

function closeEditorModal() { g('editorModal').classList.remove('open'); }
function onEditorBgClick(e) { if (e.target === g('editorModal')) closeEditorModal(); }

function initMonaco() {
  if (monacoEditor) { return; }
  if (typeof require === 'undefined') {
    // Lazy-load Monaco from CDN
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js';
    script.onload = () => {
      require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
      require(['vs/editor/editor.main'], createMonacoEditor);
    };
    document.head.appendChild(script);
  } else {
    require(['vs/editor/editor.main'], createMonacoEditor);
  }
}

function createMonacoEditor() {
  const mount = g('monacoMount');
  monacoEditor = monaco.editor.create(mount, {
    value: EDITOR_TEMPLATE,
    language: 'python',
    theme: 'vs-dark',
    fontSize: 12,
    minimap: { enabled: false },
    scrollBeyondLastLine: false,
    automaticLayout: true,
    lineNumbers: 'on',
    padding: { top: 8 },
  });
}

function renderEditorParams() {
  const area = g('editorParams');
  let html = editorParams.map((p, i) => `
    <div class="editor-param-chip">
      <code>${p.key}</code>
      <span>${p.type}</span>
      <span>${p.default}</span>
      <button onclick="removeEditorParam(${i})">×</button>
    </div>`).join('');
  html += `<button class="editor-add-param" onclick="addEditorParam()">+ param</button>`;
  area.innerHTML = html;
}

function addEditorParam() {
  const key = prompt('Parameter name (e.g. period, threshold):');
  if (!key || !key.trim()) return;
  const type = prompt('Type (int / float / str):', 'int') || 'int';
  const def  = prompt('Default value:', '14') || '14';
  editorParams.push({ key: key.trim(), type, default: def });
  renderEditorParams();
}

function removeEditorParam(i) {
  editorParams.splice(i, 1);
  renderEditorParams();
}

async function testCustomIndicator() {
  if (!monacoEditor) return;
  const code = monacoEditor.getValue();
  const name = g('editorName').value.trim() || 'preview';
  const paramDefaults = Object.fromEntries(editorParams.map(p => [p.key, p.default]));

  const btnTest = document.querySelector('#editorModal .btn-apply[onclick*="testCustomIndicator"]');
  const btnSave = document.querySelector('#editorModal .btn-apply[onclick*="saveCustomIndicator"]');
  const origHtml = btnTest.innerHTML;
  btnTest.disabled = true;
  btnSave.disabled = true;
  btnTest.innerHTML = '<span class="spin" style="width:11px;height:11px;display:inline-block;vertical-align:middle;margin-right:6px"></span>Computing…';

  try {
    const fromVal = g('rangeFrom')?.value;
    const toVal   = g('rangeTo')?.value;
    const fromTs  = fromVal ? Math.floor(new Date(fromVal + 'T00:00:00Z').getTime() / 1000) : null;
    const toTs    = toVal   ? Math.floor(new Date(toVal   + 'T23:59:59Z').getTime() / 1000) : null;

    const reqBody = {
      type: '__script__', timeframe: S.tf, exchange: S.ex, symbol: S.sym,
      _code: code, ...paramDefaults,
    };
    if (fromTs) reqBody.start_ts = fromTs;
    if (toTs)   reqBody.end_ts   = toTs;
    // When date range is selected, bypass _TEST_LIMITS so all data in range is returned
    if (fromTs || toTs) reqBody.limit = 0;

    const r = await fetch('/api/indicators/test', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(reqBody),
    });
    const data = await r.json();
    if (data.error) { showErr(data.error); return; }
    const pts = (data.data || [])
      .map(p => ({ time: p.timestamp, value: parseFloat(p.value) }))
      .filter(p => p.time && isFinite(p.value))
      .sort((a, b) => a.time - b.time);
    if (!pts.length) { showErr('No data returned for the selected range'); return; }
    const displayType = g('editorDisplay')?.value || 'sub_panel';
    addIndToChart(`preview_${name}`, pts, {
      type: name, timeframe: S.tf, exchange: S.ex, symbol: S.sym,
      display_type: displayType,
      explicit_display: true,
    });
  } catch (e) {
    showErr(e.message);
  } finally {
    btnTest.innerHTML = origHtml;
    btnTest.disabled = false;
    btnSave.disabled = false;
  }
}

async function saveCustomIndicator() {
  if (!monacoEditor) return;
  const name = g('editorName').value.trim();
  if (!name) { alert('Enter a name for the indicator'); return; }
  const code = monacoEditor.getValue();

  try {
    const r = await fetch('/api/indicators/custom', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, code, params_schema: editorParams }),
    });
    const data = await r.json();
    if (data.error) { showErr(data.error); return; }
    // Refresh library and reopen modal
    L_loaded = false;
    await loadLibrary();
    openIndModal();
    closeEditorModal();
  } catch (e) { showErr(e.message); }
}

// ═══ Realtime WebSocket ═══════════════════════════════════════════════
let _rtWS = null;
let _rtCount = 0;

function _wsLive(text, color) {
  const el = g('wsLive');
  if (el) { el.textContent = text; el.style.color = color; }
}

function connectRealtimeWS() {
  if (_rtWS) { _rtWS.onclose = null; _rtWS.close(); _rtWS = null; }
  if (!S.ex || !S.sym || !S.tf) return;

  _wsLive('WS connecting…', '#555');
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(
    `${proto}://${location.host}/api/ws/candles` +
    `?exchange=${encodeURIComponent(S.ex)}&symbol=${encodeURIComponent(S.sym)}&timeframe=${encodeURIComponent(S.tf)}`
  );
  _rtWS = ws;
  _rtCount = 0;

  ws.onopen = () => _wsLive('WS ●', '#26a69a');

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch (_) { return; }
    if (msg.type !== 'candle') return;
    const d = msg.data;
    _rtCount++;
    _wsLive(`${new Date().toLocaleTimeString('en-GB')} C=${(+d.close).toFixed(2)}`, '#26a69a');

    // Update candlestick series
    if (S.series.candle) {
      try {
        S.series.candle.update({ time: d.time, open: +d.open, high: +d.high, low: +d.low, close: +d.close });
      } catch (_) {}
    }
    // Update invisible line series (used for markers)
    if (S.series.line) {
      try { S.series.line.update({ time: d.time, value: +d.close }); } catch (_) {}
    }
    // Update volume series
    if (S.series.vol) {
      try {
        S.series.vol.update({
          time: d.time, value: +d.volume,
          color: +d.close >= +d.open ? 'rgba(38,166,154,.45)' : 'rgba(239,83,80,.45)',
        });
      } catch (_) {}
    }

    // Keep S.candles in sync so updatePrice/legend see current data
    if (S.candles.length > 0) {
      const last = S.candles[S.candles.length - 1];
      if (d.time === last.timestamp) {
        last.open = d.open; last.high = d.high; last.low = d.low;
        last.close = d.close; last.volume = d.volume;
      } else if (d.time > last.timestamp) {
        S.candles.push({ timestamp: d.time, open: d.open, high: d.high,
                         low: d.low, close: d.close, volume: d.volume });
      }
    }
    updatePrice();
  };

  ws.onclose = () => {
    _wsLive('WS reconnecting…', '#555');
    if (_rtWS === ws) setTimeout(connectRealtimeWS, 3000);
  };
  ws.onerror = () => _wsLive('WS error', '#ef5350');
}
</script>
