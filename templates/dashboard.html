<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Dashboard</title>
<script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
<link rel="stylesheet" href="/static/css/goldenlayout-base.css">
<link rel="stylesheet" href="/static/css/goldenlayout-dark-theme.css">
<script src="/static/js/golden-layout.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #131722; --surface: #1e222d; --border: #2a2e39; --muted: #434651;
    --text: #d1d4dc; --dim: #787b86; --accent: #2962ff; --green: #26a69a; --red: #ef5350;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; overflow: hidden; }
  .layout { display: flex; flex-direction: column; height: 100vh; }
  .main-row { display: flex; flex: 1; overflow: hidden; min-height: 0; position: relative; }
  #glContainer { position: absolute; top: 0; right: 0; bottom: 0; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar {
    width: 220px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
    transition: width .18s ease; z-index: 10;
  }
  .sidebar.collapsed { width: 40px; }
  .sidebar-toggle {
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px; height: 34px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    color: var(--dim); font-size: 12px; user-select: none; flex-shrink: 0;
  }
  .sidebar-toggle:hover { color: var(--text); background: rgba(255,255,255,.03); }
  .si-icon { font-size: 14px; flex-shrink: 0; line-height: 1; }
  .si-label { white-space: nowrap; overflow: hidden; font-size: 11px; letter-spacing: .4px; text-transform: uppercase; }
  .sidebar-tree { flex: 1; overflow-y: auto; padding: 4px 0; }
  .sidebar-tree::-webkit-scrollbar { width: 4px; }
  .sidebar-tree::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }
  .si-section-head {
    padding: 4px 12px; font-size: 11px; color: var(--dim); cursor: pointer;
    user-select: none; letter-spacing: .4px; text-transform: uppercase;
    display: flex; align-items: center; gap: 5px;
  }
  .si-section-head:hover { color: var(--text); }
  .si-file {
    padding: 3px 12px 3px 24px; font-size: 12px; color: var(--text);
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; gap: 6px;
  }
  .si-file:hover { background: rgba(255,255,255,.04); }
  .si-file.active { background: rgba(41,98,255,.15); color: var(--accent); }
  .sidebar.collapsed .si-label,
  .sidebar.collapsed .sidebar-tree { display: none; }

  /* ── GoldenLayout dark theme overrides ── */
  .lm_goldenlayout { background: var(--bg) !important; }
  .lm_content { background: var(--bg) !important; overflow: hidden !important; }
  .lm_header { background: var(--surface) !important; border-bottom: 1px solid var(--border) !important; }
  .lm_tab { background: var(--surface) !important; border: 1px solid var(--border) !important; color: var(--dim) !important; font-size: 12px !important; }
  .lm_tab.lm_active { color: var(--text) !important; border-bottom: 2px solid var(--accent) !important; }
  .lm_tab:hover { color: var(--text) !important; }
  .lm_tab .lm_close_tab { opacity: .5 !important; }
  .lm_tab .lm_close_tab:hover { opacity: 1 !important; }
  .lm_splitter { background: var(--border) !important; }
  .lm_splitter:hover, .lm_splitter.lm_dragging { background: var(--accent) !important; }
  .lm_controls .lm_close { display: none; }

  /* ── Editor panel ── */
  #editorPanelContent {
    display: flex; flex-direction: column;
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg);
  }
  .ep-tabs {
    display: flex; align-items: center; flex-shrink: 0;
    background: var(--surface); border-bottom: 1px solid var(--border);
    overflow-x: auto; padding: 0 4px; min-height: 35px;
  }
  .ep-tabs::-webkit-scrollbar { height: 3px; }
  .ep-tabs::-webkit-scrollbar-thumb { background: var(--muted); }
  .ep-tab {
    display: flex; align-items: center; gap: 5px; padding: 0 10px;
    height: 34px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    color: var(--dim); font-size: 12px; border-right: 1px solid var(--border);
    border-bottom: 2px solid transparent; user-select: none;
    transition: color .1s, border-color .1s;
  }
  .ep-tab:hover { color: var(--text); }
  .ep-tab.active { color: var(--text); border-bottom-color: var(--accent); background: rgba(41,98,255,.06); }
  .ep-tab.dirty::before { content: '●'; font-size: 8px; color: var(--accent); margin-right: 3px; }
  .ep-tab-close { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 14px; padding: 0; line-height: 1; }
  .ep-tab-close:hover { color: var(--red); }
  .ep-new-tab {
    padding: 0 10px; height: 34px; background: none; border: none;
    color: var(--dim); font-size: 18px; cursor: pointer; flex-shrink: 0;
  }
  .ep-new-tab:hover { color: var(--text); }
  .ep-toolbar {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .ep-toolbar input {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 3px 8px; border-radius: 4px; font-size: 12px; outline: none; width: 160px;
  }
  .ep-toolbar input:focus { border-color: var(--accent); }
  .ep-toolbar select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 3px 6px; border-radius: 4px; font-size: 12px; cursor: pointer; outline: none;
  }
  .ep-params {
    padding: 5px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-height: 32px;
  }
  .ep-monaco { flex: 1; min-height: 0; overflow: hidden; }
  .ep-hint {
    padding: 3px 12px; font-size: 10px; color: var(--dim);
    border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .ep-range {
    display: flex; align-items: center; gap: 6px; padding: 5px 12px;
    border-top: 1px solid var(--border); flex-shrink: 0;
    font-size: 11px; color: var(--dim);
  }
  .ep-range input[type="date"] {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 5px; font-size: 11px; color-scheme: dark; outline: none;
  }
  .ep-range button {
    padding: 2px 7px; border-radius: 4px; border: 1px solid var(--border);
    background: transparent; color: var(--dim); font-size: 10px; cursor: pointer;
  }
  .ep-range button:hover { color: var(--text); border-color: var(--muted); }
  .ep-actions {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-top: 1px solid var(--border); flex-shrink: 0;
  }

  /* ── Topbar ── */
  .topbar {
    display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    overflow: hidden; min-width: 0;
  }
  .topbar-title { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

  select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 3px 6px; border-radius: 4px; font-size: 12px; cursor: pointer; outline: none;
  }
  select:hover { border-color: var(--muted); }

  /* layer toggles */
  .toggles { display: flex; gap: 4px; }
  .tog {
    padding: 3px 9px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--bg); color: var(--dim); font-size: 12px;
    cursor: pointer; user-select: none; white-space: nowrap;
    transition: background .12s, color .12s, border-color .12s;
  }
  .tog.on          { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tog.on.g        { background: var(--green);  border-color: var(--green); }

  /* indicator chips area */
  .ind-area { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; overflow: hidden; min-width: 0; position: relative; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 10px; font-size: 11px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    cursor: pointer; white-space: nowrap; user-select: none;
    transition: opacity .12s;
  }
  .chip.off { opacity: 0.4; }
  .chip-x { color: var(--dim); font-size: 13px; line-height: 1; margin-left: 2px; }
  .chip-x:hover { color: var(--red); }

  /* add indicator button */
  .add-ind-btn {
    padding: 3px 9px; border-radius: 4px; border: 1px dashed var(--muted);
    background: transparent; color: var(--dim); font-size: 12px;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: color .12s, border-color .12s;
  }
  .add-ind-btn:hover { color: var(--text); border-color: var(--text); }

  /* ── Indicator library modal ── */
  .ind-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 300;
    display: none; align-items: flex-start; justify-content: center; padding-top: 56px;
  }
  .ind-modal.open { display: flex; }
  .ind-modal-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    width: 700px; max-height: 72vh; display: flex; flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,.6); overflow: hidden;
  }
  .ind-modal-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .ind-modal-head input {
    flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 5px 10px; border-radius: 4px; font-size: 13px; outline: none;
  }
  .ind-modal-head input:focus { border-color: var(--accent); }
  .ind-modal-close {
    background: none; border: none; color: var(--dim); font-size: 18px;
    cursor: pointer; padding: 0 4px; line-height: 1; flex-shrink: 0;
  }
  .ind-modal-close:hover { color: var(--text); }
  .ind-modal-body { display: flex; flex: 1; overflow: hidden; }

  /* Left: scrollable indicator list */
  .ind-lib-list {
    width: 240px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid var(--border);
  }
  .ind-lib-list::-webkit-scrollbar { width: 4px; }
  .ind-lib-list::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }
  .ind-cat-label {
    padding: 6px 12px 3px; font-size: 10px; color: var(--dim);
    letter-spacing: .5px; text-transform: uppercase; position: sticky; top: 0;
    background: var(--surface); z-index: 1;
  }
  .ind-lib-item {
    padding: 6px 12px; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; justify-content: space-between;
    transition: background .08s;
  }
  .ind-lib-item:hover  { background: var(--border); }
  .ind-lib-item.sel    { background: rgba(41,98,255,.2); color: var(--accent); }
  .ind-lib-item-badge  { font-size: 10px; color: var(--dim); }
  .ind-new-btn {
    margin: 6px 10px; padding: 4px 10px; border-radius: 4px;
    border: 1px dashed var(--muted); background: transparent; color: var(--dim);
    font-size: 11px; cursor: pointer; width: calc(100% - 20px); text-align: left;
  }
  .ind-new-btn:hover { color: var(--text); border-color: var(--text); }

  /* Right: settings panel */
  .ind-settings {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px;
  }
  .ind-settings-title { font-size: 14px; font-weight: 600; }
  .ind-settings-group { display: flex; flex-direction: column; gap: 8px; }
  .ind-settings-row   { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ind-settings-label { font-size: 12px; color: var(--dim); flex-shrink: 0; width: 80px; }
  .ind-settings-row input[type=number], .ind-settings-row select {
    flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 4px 8px; border-radius: 4px; font-size: 12px; outline: none;
  }
  .ind-settings-row input:focus, .ind-settings-row select:focus { border-color: var(--accent); }
  .ind-settings-tf {
    flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 4px 8px; border-radius: 4px; font-size: 12px; outline: none; cursor: pointer;
  }
  .ind-settings-actions { display: flex; gap: 8px; margin-top: 4px; }
  .btn-apply {
    flex: 1; padding: 6px 14px; border-radius: 4px; border: none;
    background: var(--accent); color: #fff; font-size: 12px; cursor: pointer;
    transition: opacity .12s;
  }
  .btn-apply:hover { opacity: .85; }
  .btn-apply:disabled { opacity: .4; cursor: default; }
  .btn-cancel {
    padding: 6px 14px; border-radius: 4px; border: 1px solid var(--border);
    background: transparent; color: var(--dim); font-size: 12px; cursor: pointer;
  }
  .btn-cancel:hover { color: var(--text); }
  .ind-progress {
    font-size: 11px; color: var(--dim); display: none;
    align-items: center; gap: 6px;
  }
  .ind-progress.on { display: flex; }
  .ind-progress .spin { width: 12px; height: 12px; margin: 0; }

  /* ── Editor param chips (used by renderEditorParams) ── */
  .editor-param-chip {
    display: flex; align-items: center; gap: 4px; padding: 2px 8px;
    border: 1px solid var(--border); border-radius: 10px; font-size: 11px;
  }
  .editor-param-chip span { color: var(--dim); }
  .editor-param-chip button { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 13px; padding: 0; }
  .editor-param-chip button:hover { color: var(--red); }
  .editor-add-param {
    padding: 2px 8px; border: 1px dashed var(--muted); border-radius: 10px;
    background: transparent; color: var(--dim); font-size: 11px; cursor: pointer;
  }
  .editor-add-param:hover { color: var(--text); border-color: var(--text); }

  /* price */
  .price-area { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .price-val { font-size: 15px; font-weight: 700; }
  .price-chg { font-size: 11px; }
  .up { color: var(--green); } .dn { color: var(--red); }

  .nav-btn {
    padding: 3px 9px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--bg); color: var(--dim); font-size: 12px;
    text-decoration: none; white-space: nowrap; flex-shrink: 0;
    transition: color .12s, border-color .12s;
  }
  .nav-btn:hover { color: var(--text); border-color: var(--muted); }

  /* ── Chart area (inside GL ChartPanel) ── */
  .chart-area { display: flex; flex-direction: column; overflow: hidden; position: relative; width: 100%; height: 100%; }
  #chartMain { width: 100%; flex: 1 1 auto; min-height: 0; }
  .chart-resizer {
    width: 100%; height: 5px; flex-shrink: 0; cursor: row-resize; position: relative; z-index: 5;
    background: var(--border);
    transition: background .12s;
  }
  .chart-resizer::after {
    content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 32px; height: 3px; border-radius: 2px;
    background: var(--muted); opacity: 0; transition: opacity .15s;
  }
  .chart-resizer:hover::after, .chart-resizer.dragging::after { opacity: 1; }
  .chart-resizer:hover, .chart-resizer.dragging { background: #2a3047; }
  .chart-resizer.h { display: none; }

  /* status bar */
  #status {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
    background: rgba(19,23,34,.8); border-top: 1px solid var(--border);
    padding: 2px 12px; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden;
  }

  /* loading */
  #loader {
    position: absolute; inset: 0; background: rgba(19,23,34,.7);
    display: flex; align-items: center; justify-content: center; z-index: 10; font-size: 13px; color: var(--dim);
  }
  #loader.h { display: none; }
  #loadMoreBar {
    position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
    background: rgba(19,23,34,.85); border: 1px solid var(--border); border-radius: 4px;
    padding: 3px 10px; font-size: 11px; color: var(--dim); z-index: 6;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  #loadMoreBar.h { display: none; }
  .spin {
    width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; margin-right: 10px; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Single crosshair overlay — one dashed line spanning all panels */
  #xhairLine {
    position: absolute; top: 0; left: 0;
    width: 0; border-left: 1px dashed rgba(255,255,255,0.35);
    pointer-events: none; display: none; z-index: 20;
  }
  #xhairTimeLabel {
    position: absolute; bottom: 0; left: 0;
    transform: translateX(-50%);
    background: #4c525e; color: #c0c3cc;
    font-size: 11px; font-family: 'Trebuchet MS', sans-serif;
    padding: 2px 6px; border-radius: 2px;
    white-space: nowrap; display: none;
  }

  /* error */
  #errBanner {
    position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
    background: #7f0000; color: #fff; padding: 5px 14px; border-radius: 4px;
    font-size: 12px; z-index: 9999; display: none;
  }

  /* scrollbar */
  .ind-lib-list::-webkit-scrollbar-track { background: var(--surface); }
  .ind-settings::-webkit-scrollbar { width: 4px; }
  .ind-settings::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

  /* ── OHLCV hover legend ── */
  #chartMain { position: relative; }
  #ohlcLegend {
    position: absolute; top: 6px; left: 6px; z-index: 5;
    font-size: 11px; pointer-events: none; display: flex; gap: 5px; align-items: center;
    user-select: none; white-space: nowrap;
  }
  #ohlcLegend .ol-lbl { color: var(--dim); font-size: 10px; }

  /* ── Sub-chart panel system ── */
  #subChartsArea { display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
  .sub-chart-item { position: relative; flex-shrink: 0; cursor: grab; }
  .sub-chart-item.drag-source { opacity: 0.4; }
  .sub-chart-item.drag-over-top    { border-top: 2px solid var(--accent); }
  .sub-chart-item.drag-over-bottom { border-bottom: 2px solid var(--accent); }
  .sub-chart-inner { width: 100%; overflow: hidden; }
  .sub-resizer {
    width: 100%; height: 5px; cursor: row-resize; background: var(--border);
    flex-shrink: 0; position: relative; z-index: 5; transition: background .12s;
  }
  .sub-resizer::after {
    content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 32px; height: 3px; border-radius: 2px; background: var(--muted);
    opacity: 0; transition: opacity .15s;
  }
  .sub-resizer:hover::after, .sub-resizer.dragging::after { opacity: 1; }
  .sub-resizer:hover, .sub-resizer.dragging { background: #2a3047; }
  .sub-panel-header {
    position: absolute; top: 5px; right: 58px; z-index: 10;
    display: flex; align-items: center; gap: 5px; pointer-events: auto;
    background: rgba(19,23,34,.75); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 7px; opacity: 0; transition: opacity .15s;
  }
  .sub-chart-item:hover .sub-panel-header { opacity: 1; }
  .sub-panel-drag { cursor: grab; color: var(--dim); font-size: 13px; user-select: none; line-height: 1; }
  .sub-panel-drag:active { cursor: grabbing; }
  .sub-panel-label { font-size: 11px; color: var(--text); white-space: nowrap; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
  .sub-panel-close { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 14px; padding: 0; line-height: 1; }
  .sub-panel-close:hover { color: var(--red); }

  /* ── Strategy panel ── */
</style>
</head>
<body>

<!-- Chart area (moved into GL ChartPanel on init) -->
<div class="chart-area" id="chartArea" style="display:none">
  <div id="chartMain">
    <div id="ohlcLegend"></div>
  </div>
  <div id="subChartsArea"></div>
  <div id="xhairLine"><span id="xhairTimeLabel"></span></div>
  <div id="loader"><div class="spin"></div><span id="loaderMsg">Loading…</span></div>
  <div id="loadMoreBar" class="h"></div>
  <div id="status"></div>
</div>

<!-- Editor panel content (moved into GL EditorPanel on init) -->
<div id="editorPanelContent" style="display:none">
  <div class="ep-tabs" id="epTabs">
    <div class="ep-tab active" id="epTabNew">
      <span class="ep-tab-title">New Indicator</span>
    </div>
    <button class="ep-new-tab" onclick="newEditorTab()" title="New file">+</button>
  </div>
  <div class="ep-toolbar">
    <input id="editorName" type="text" placeholder="indicator_name">
    <select id="editorDisplay">
      <option value="sub_panel">Sub-panel</option>
      <option value="overlay">Overlay on chart</option>
    </select>
  </div>
  <div class="ep-params" id="editorParams">
    <button class="editor-add-param" onclick="addEditorParam()">+ param</button>
  </div>
  <div class="ep-monaco" id="monacoMount"></div>
  <div class="ep-hint">
    Available: <code>close open high low volume ts np ta</code> + params above · assign <code>result</code>
  </div>
  <div class="ep-range">
    <span>Range:</span>
    <input type="date" id="rangeFrom">
    <span>→</span>
    <input type="date" id="rangeTo">
    <button onclick="g('rangeFrom').value='';g('rangeTo').value=''">All history</button>
  </div>
  <div class="ep-actions">
    <button class="btn-cancel" onclick="resetEditorPanel()">Clear</button>

<script>
// ═══ State ═══════════════════════════════════════════════════════════
const S = {
  ex: '', sym: '', tf: '',
  layers: { candles: true, volume: true, signals: true },
  sources: [],
  candles: [],
  allSignals: [],
  allInds: [],           // stored indicators from /status
  activeInds: new Map(), // key → { on, series, subRefLines, data, meta }
  indMeta: new Map(),    // key → { display_name } for on-demand computed inds

  charts: { main: null },
  subCharts: new Map(),  // key → { chart, anchor, anchorTs, height, el, chartEl, displayName }
  series: { candle: null, line: null, vol: null },
  emaColors: ['#f6c90e','#a29bfe','#74b9ff','#fd79a8','#81ecec','#55efc4','#fdcb6e'],
  emaColorIdx: 0,
  indColorMap: new Map(),

  loadingMore: false,
  noMoreData: false,
  fitting: false,
  oldestTs: null,
  chartGen: 0,
  displayedCandleT0: null,
  displayedCandleT1: null,
  panelOrder: [],        // ordered array of sub-chart keys
};

// ═══ GoldenLayout ═══════════════════════════════════════════════════
let glLayout = null;
let glEditorContainer = null;

// Refs captured before GL moves elements — survive detached-DOM fallback
const _chartAreaEl       = document.getElementById('chartArea');
const _editorPanelEl     = document.getElementById('editorPanelContent');

function _registerGLComponents(gl) {
  gl.registerComponentFactoryFunction('ChartPanel', glContainer => {
    const el = glContainer.element;
    el.style.cssText = 'overflow:hidden;position:relative;width:100%;height:100%';
    _chartAreaEl.style.cssText = 'display:flex;flex-direction:column;overflow:hidden;position:relative;width:100%;height:100%';
    el.appendChild(_chartAreaEl);
    // GL calls factory before element is attached to DOM — defer until next frame
    requestAnimationFrame(() => initChartsAndLoad());
  });
  gl.registerComponentFactoryFunction('EditorPanel', glContainer => {
    glEditorContainer = glContainer;
    const el = glContainer.element;
    el.style.cssText = 'overflow:hidden;width:100%;height:100%';
    _editorPanelEl.style.display = '';
    el.appendChild(_editorPanelEl);
    glContainer.on('destroy', () => {
      // Rescue _editorPanelEl before GL removes the container element from DOM
      if (_editorPanelEl.parentElement !== document.body) document.body.appendChild(_editorPanelEl);
      glEditorContainer = null;
    });
    requestAnimationFrame(() => {
      _renderTabs();
      if (monacoEditor) {
        monacoEditor.layout(); // re-measure after DOM move
      } else {
        initMonaco();
      }
    });
  });
}

const _glDefaultLayout = {
  root: { type: 'component', componentType: 'ChartPanel', title: 'Chart', isClosable: false }
};

function _syncGLContainerPos() {
  const container = document.getElementById('glContainer');
  const sidebar   = document.getElementById('sidebar');
  if (!container) return;
  container.style.left = (sidebar ? sidebar.offsetWidth : 0) + 'px';
}

function initGoldenLayout() {
  if (typeof GoldenLayout === 'undefined') { initChartsAndLoad(); return; }

  const container = document.getElementById('glContainer');

  // #glContainer is position:absolute; its left edge tracks the sidebar width.
  // top/right/bottom:0 are already set in CSS — GL gets exact pixel dimensions.
  _syncGLContainerPos();

  window.addEventListener('resize', () => {
    _syncGLContainerPos();
    if (glLayout) glLayout.updateSize(container.clientWidth, container.clientHeight);
  });

  const _GL_VERSION = 2; // bump to invalidate saved layouts on breaking changes
  const saved = (() => {
    try {
      const raw = localStorage.getItem('tradingbot_gl_layout');
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (parsed?._v !== _GL_VERSION) { localStorage.removeItem('tradingbot_gl_layout'); return null; }
      return parsed;
    } catch (_) { return null; }
  })();

  const _initGL = (layout) => {
    container.innerHTML = '';
    glLayout = new GoldenLayout(container);
    _registerGLComponents(glLayout);
    glLayout.loadLayout(layout);
  };

  try {
    _initGL(saved || _glDefaultLayout);
  } catch (_) {
    localStorage.removeItem('tradingbot_gl_layout');
    if (!document.body.contains(_chartAreaEl))   document.body.appendChild(_chartAreaEl);
    if (!document.body.contains(_editorPanelEl)) document.body.appendChild(_editorPanelEl);
    try { _initGL(_glDefaultLayout); } catch (e2) { console.error('GL init failed:', e2); initChartsAndLoad(); return; }
  }

  window.addEventListener('beforeunload', () => {
    try {
      const layout = glLayout.saveLayout();
      layout._v = _GL_VERSION;
      localStorage.setItem('tradingbot_gl_layout', JSON.stringify(layout));
    } catch (_) {}
  });
}

function initChartsAndLoad() {
  initCharts();
  loadChart().catch(e => showErr(e.message)).finally(() => load(false));
}

function ensureEditorPanelVisible() {
  if (!glLayout) return;

  // Already open — just activate the tab
  if (glEditorContainer) {
    try { glEditorContainer.tab?.header?.parent?.setActiveContentItem?.(glEditorContainer.tab?.contentItem); } catch (_) {}
    return;
  }

  // _editorPanelEl must be in body so the factory can adopt it
  if (_editorPanelEl.parentElement !== document.body) document.body.appendChild(_editorPanelEl);

  const editorConfig = { type: 'component', componentType: 'EditorPanel', title: 'Editor', isClosable: true };

  // Find the ChartPanel's parent (a Stack/Row/Column) and add EditorPanel as sibling.
  // This is more reliable than calling root.addItem() on a bare component root.
  const root = glLayout.rootItem;
  if (!root) return;

  const findItem = (item, type) => {
    if (item.componentType === type) return item;
    if (item.contentItems) for (const c of item.contentItems) { const r = findItem(c, type); if (r) return r; }
    return null;
  };

  const chartItem = findItem(root, 'ChartPanel');
  const target = chartItem?.parent ?? root;
  try {
    target.addItem(editorConfig);
  } catch (_) {
    // Last resort: add directly to root (GL2 may auto-wrap into a row)
    try { root.addItem(editorConfig); } catch (_2) {}
  }
}

// ═══ Sidebar ══════════════════════════════════════════════════════════
function toggleSidebar() {
  const sb = g('sidebar');
  sb.classList.toggle('collapsed');
  // Sync GL container after the CSS transition (.18s) finishes
  sb.addEventListener('transitionend', () => {
    _syncGLContainerPos();
    const container = document.getElementById('glContainer');
    if (glLayout && container) glLayout.updateSize(container.clientWidth, container.clientHeight);
  }, { once: true });
}

function toggleSiSection(id) {
  const el = g(id);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? '' : 'none';
}

async function loadSidebarFiles() {
  const types = [
    { key: 'indicators', elId: 'si-indicators' },
    { key: 'strategies', elId: 'si-strategies' },
  ];
  for (const { key, elId } of types) {
    try {
      const r = await api(`/api/library/${key}`);
      const el = g(elId);
      if (!el) continue;
      if (!r.items.length) {
        el.innerHTML = `<div class="si-file" style="color:var(--dim);cursor:default">Empty library</div>`;
        continue;
      }
      el.innerHTML = r.items.map(f => `
        <div class="si-file" data-name="${f.name}" data-type="${key}"
             onclick="openFileInEditor('${key}','${f.name}')"
             oncontextmenu="siFileContextMenu(event,'${key}','${f.name}')">
          <span style="color:var(--dim);font-size:11px">py</span>
          <span>${f.name}</span>
        </div>`).join('');
    } catch (_) {}
  }
}

// ═══ Editor Tabs ══════════════════════════════════════════════════════
const editorTabs = new Map(); // tabId → { name, type, dirty }
let activeTabId = 'new';

function _renderTabs() {
  const container = g('epTabs');
  if (!container) return;
  let html = '';
  editorTabs.forEach((tab, id) => {
    const isActive = id === activeTabId;
    const dirty = tab.dirty ? ' dirty' : '';
    html += `<div class="ep-tab${isActive ? ' active' : ''}${dirty}" data-tabid="${id}"
               onclick="switchTab('${id}')">
      <span class="ep-tab-title">${tab.name}</span>
      <button class="ep-tab-close" onclick="closeTab(event,'${id}')" title="Close">×</button>
    </div>`;
  });
  // Keep "new" tab and "+" button at end
  const tabsArea = container.querySelector('.ep-tab[data-tabid="new"]')?.parentElement || container;
  container.innerHTML = html +
    `<div class="ep-tab${activeTabId === 'new' ? ' active' : ''}" data-tabid="new" onclick="switchTab('new')">
       <span class="ep-tab-title">New Indicator</span>
     </div>
     <button class="ep-new-tab" onclick="newEditorTab()" title="New file">+</button>`;
}

function switchTab(id) {
  if (id === activeTabId) return;
  // Save current tab content
  const prevTab = editorTabs.get(activeTabId);
  if (prevTab && monacoEditor) prevTab.code = monacoEditor.getValue();

  activeTabId = id;
  const tab = editorTabs.get(id);
  if (tab) {
    g('editorName').value = tab.name;
    if (monacoEditor) monacoEditor.setValue(tab.code || '');
  } else {
    g('editorName').value = '';
    if (monacoEditor) monacoEditor.setValue(EDITOR_TEMPLATE);
  }
  _renderTabs();
}

function closeTab(e, id) {
  e.stopPropagation();
  editorTabs.delete(id);
  if (activeTabId === id) {
    const remaining = [...editorTabs.keys()];
    activeTabId = remaining.length ? remaining[0] : 'new';
  }
  _renderTabs();
  switchTab(activeTabId);
}

function newEditorTab() {
  resetEditorPanel();
  activeTabId = 'new';
  _renderTabs();
  ensureEditorPanelVisible();
}

async function openFileInEditor(type, name) {
  ensureEditorPanelVisible();
  initMonaco();

  if (editorTabs.has(name)) {
    switchTab(name);
    return;
  }

  // Save current tab content before we overwrite activeTabId (same as switchTab does)
  const prevTab = editorTabs.get(activeTabId);
  if (prevTab && monacoEditor) prevTab.code = monacoEditor.getValue();

  try {
    const r = await api(`/api/library/${type}/${name}`);
    editorTabs.set(name, { name, type, code: r.code, dirty: false });
    document.querySelectorAll('.si-file').forEach(el => el.classList.remove('active'));
    document.querySelector(`.si-file[data-name="${name}"][data-type="${type}"]`)?.classList.add('active');
    activeTabId = name;
    _renderTabs();
    if (monacoEditor) monacoEditor.setValue(r.code);
    g('editorName').value = name;
  } catch (e) { showErr(`Failed to load ${name}: ${e.message}`); }
}

function siFileContextMenu(e, type, name) {
  e.preventDefault();
  if (!confirm(`Delete "${name}" from library?`)) return;
  fetch(`/api/library/${type}/${name}`, { method: 'DELETE' })
    .then(() => { editorTabs.delete(name); _renderTabs(); loadSidebarFiles(); })
    .catch(err => showErr(err.message));
}

// ═══ Boot ════════════════════════════════════════════════════════════
async function boot() {
  try {
    load(true, 'Loading sources…');
    const [srcRes, indRes] = await Promise.all([
      api('/api/data/sources'),
      api('/api/indicators/status'),
    ]);
    S.sources = srcRes.sources || [];
    S.allInds = (indRes.indicators || []).map(i => {
      return { name: i.name, connection: i.connection, count: i.count, ...parseConnection(i.connection) };
    });
    buildSelects();
    initGoldenLayout();
    loadSidebarFiles();
  } catch (e) { console.error('boot error:', e); showErr(e.message); load(false); }
}

function parseConnection(conn) {
  // Format: "whitebit_SOL_USDT_5m" → { exchange: 'whitebit', symbol: 'SOL_USDT', tf: '5m' }
  // First token = exchange (no underscore), last token = timeframe, middle = symbol
  const parts = conn.split('_');
  const tfPatterns = /^\d+[mhdw]$/;
  const tf = parts[parts.length - 1];
  const ex = parts[0];
  const sym = parts.slice(1, parts.length - 1).join('_');
  return { exchange: ex, symbol: sym, tf };
}

// ═══ Selects ═════════════════════════════════════════════════════════
function buildSelects() {
  const exs = [...new Set(S.sources.map(s => s.exchange))].sort();
  fill('selEx', exs); S.ex = exs[0] || '';
  buildSymbols();
}
function buildSymbols() {
  S.ex = val('selEx');
  const syms = [...new Set(S.sources.filter(s => s.exchange === S.ex).map(s => s.symbol))].sort();
  fill('selSym', syms); S.sym = syms[0] || '';
  buildTfs();
}
function buildTfs() {
  S.sym = val('selSym');
  const tfs = [...new Set(S.sources.filter(s => s.exchange === S.ex && s.symbol === S.sym).map(s => s.timeframe))]
    .sort((a, b) => tfMin(a) - tfMin(b));
  fill('selTf', tfs); S.tf = tfs[0] || '';
}
function onExChange() { buildSymbols(); loadChart(); }
function onSymChange() { buildTfs(); loadChart(); }

function fill(id, vals) {
  const el = g(id), prev = el.value;
  el.innerHTML = vals.map(v => `<option value="${v}">${v}</option>`).join('');
  if (vals.includes(prev)) el.value = prev;
}
function tfMin(tf) { return ({1:1,3:3,5:5,15:15,30:30,'1h':60,'2h':120,'4h':240,'6h':360,'12h':720,'1d':1440,'1w':10080})[tf.replace('m','').replace('h','h').replace('d','d').replace('w','w')] || ({ '1m':1,'3m':3,'5m':5,'15m':15,'30m':30,'1h':60,'2h':120,'4h':240,'6h':360,'12h':720,'1d':1440,'1w':10080 })[tf] || 9999; }

// ─── Module-level sync state ─────────────────────────────────────────
let _chartSyncInProgress = false;
let _xhairSync = false;
let _handleCrosshairMove = null; // set by initCrosshairSync, used by dynamic sub-charts

// ─── Shared time-axis sync helpers ───────────────────────────────────
// All panels share a single logical time axis. Moving any chart moves all
// others. Sync is bidirectional: main→sub and sub→main.
//
// Strategy: convert main logical range → timestamps → setVisibleRange on sub.
// setVisibleRange(timestamps) is stable: no dependency on sub-chart logical
// indices, which shift after loadMore. Sub→main uses getVisibleRange() directly
// (timestamps), so no round-trip conversion that caused oscillation before.

// ─── Per-key sub-chart anchor helpers ────────────────────────────────
// Dense anchor: one invisible histogram point per candle, matching main chart's
// timeline. Without it, a sparse indicator series creates a non-uniform internal
// time axis (huge gap between the two endpoints), so setVisibleRange with the same
// timestamps maps timestamps→pixels at a different rate than the main chart.
function _setSubAnchorForKey(key) {
  const subData = S.subCharts.get(key);
  if (!subData || !subData.anchor || !S.candles.length) return;
  const leftTs  = S.candles[0].timestamp;
  const rightTs = S.candles[S.candles.length - 1].timestamp;
  if (subData.anchorTs[0] === leftTs && subData.anchorTs[1] === rightTs) return;
  subData.anchorTs = [leftTs, rightTs];
  _chartSyncInProgress = true;
  // Alternating 0/1 values keep the left price scale non-degenerate (range [0,1]),
  // preventing LWC's "Value is null" render error that occurs when min===max===0.
  const anchorData = S.candles.map((c, i) => ({ time: c.timestamp, value: i & 1 }));
  try { subData.anchor.setData(anchorData); } catch (_) {}
  _chartSyncInProgress = false;
}

function _setAllSubAnchors() {
  S.subCharts.forEach((_, key) => _setSubAnchorForKey(key));
}

// Main-chart logical index → Unix timestamp (extrapolates outside data range).
function _mainLogicalToTime(logIdx) {
  const n = S.candles.length;
  if (!n) return null;
  const dt = n > 1 ? S.candles[n - 1].timestamp - S.candles[n - 2].timestamp : 60;
  if (logIdx >= n - 1) return Math.round(S.candles[n - 1].timestamp + (logIdx - (n - 1)) * dt);
  if (logIdx < 0)      return Math.round(S.candles[0].timestamp + logIdx * dt);
  const lo = Math.floor(logIdx);
  return Math.round(S.candles[lo].timestamp + (logIdx - lo) * (S.candles[lo + 1].timestamp - S.candles[lo].timestamp));
}

// Sync a sub-chart to the main chart's current logical range via timestamps.
// setVisibleRange(timestamps) avoids passing out-of-bounds logical indices to
// the sub-chart (which throws in LWC when priceScaleId:'' overlay is used).
function _syncSubChartByKey(key, mainRange) {
  if (!mainRange || mainRange.from == null || mainRange.to == null) return;
  const fromTs = _mainLogicalToTime(mainRange.from);
  const toTs   = _mainLogicalToTime(mainRange.to);
  if (fromTs === null || toTs === null) return;
  const subData = S.subCharts.get(key);
  if (subData) try { subData.chart.timeScale().setVisibleRange({ from: fromTs, to: toTs }); } catch (_) {}
}

// Sync ALL sub-charts from main range.
function _syncAllSubCharts(mainRange) {
  S.subCharts.forEach((_, key) => _syncSubChartByKey(key, mainRange));
}

// Sync main chart from a specific sub-chart (user dragged that sub).
// Get sub-chart's timestamp range and apply it directly — no round-trip conversion.
function _syncMainFromSubKey(key) {
  const subData = S.subCharts.get(key);
  if (!subData) return;
  const subRange = subData.chart.timeScale().getVisibleRange();
  if (!subRange || subRange.from == null || subRange.to == null) return;
  try { S.charts.main.timeScale().setVisibleRange(subRange); } catch (_) {}
}

// ═══ Charts init ═════════════════════════════════════════════════════
function initCharts() {
  const _vLine = { visible: false, labelVisible: true,  color: '#758696', width: 1, style: 3, labelBackgroundColor: '#4c525e' };
  const _hLine = { visible: true,  labelVisible: true,  color: '#758696', width: 1, style: 2, labelBackgroundColor: '#4c525e' };

  S.charts.main = LightweightCharts.createChart(g('chartMain'), {
    layout: { background: { color: '#131722' }, textColor: '#c0c3cc' },
    grid:   { vertLines: { color: '#1a1e2a' }, horzLines: { color: '#1a1e2a' } },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Magnet,
      vertLine: { ..._vLine },
      horzLine: { ..._hLine },
    },
    timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2a2e39' },
    rightPriceScale: { borderColor: '#2a2e39' },
    handleScroll: { mouseWheel: true, pressedMouseMove: true },
    handleScale:  { axisPressedMouseMove: true, mouseWheel: true, pinch: true },
  });

  S.charts.main.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (_chartSyncInProgress || !range) return;
    if (S.subCharts.size > 0) {
      _chartSyncInProgress = true;
      _syncAllSubCharts(range);
      _chartSyncInProgress = false;
    }
    if (range.from < 20 && !S.loadingMore && !S.noMoreData && !S.fitting) loadMore();
  });

  initCrosshairSync();

  new ResizeObserver(relayout).observe(_chartAreaEl);
  relayout();
}

function relayout() {
  const W = _chartAreaEl.clientWidth, H = _chartAreaEl.clientHeight;
  const statusH = (g('status').offsetHeight || 18) + 8;
  const usableH = H - statusH;

  let subTotalH = 0;
  S.subCharts.forEach(subData => { subTotalH += subData.height + 5; }); // +5 for resizer

  const mainH = Math.max(usableH - subTotalH, 100);

  if (W > 0) {
    try { S.charts.main.resize(W, mainH); } catch (_) {}
    S.subCharts.forEach((subData, key) => {
      subData.chartEl.style.height = `${subData.height}px`;
      try { subData.chart.resize(W, subData.height); } catch (_) {}
    });
  }
  g('xhairLine').style.height = usableH + 'px';
  updateTimeAxes();
  if (S.subCharts.size > 0 && S.candles.length) {
    const _r = S.charts.main.timeScale().getVisibleLogicalRange();
    if (_r) requestAnimationFrame(() => { _syncAllSubCharts(_r); });
  }
}

function hasSubPanel() { return S.subCharts.size > 0; }

function setupSubResizer(resizerEl, key) {
  let startY, startH;
  function onDown(clientY) {
    startY = clientY;
    startH = S.subCharts.get(key)?.height || 140;
    resizerEl.classList.add('dragging');
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';
  }
  function onMove(clientY) {
    const delta = startY - clientY;
    const subData = S.subCharts.get(key);
    if (subData) subData.height = Math.max(60, Math.min(500, startH + delta));
    relayout();
  }
  function onUp() {
    resizerEl.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
  resizerEl.addEventListener('mousedown', e => {
    e.preventDefault();
    onDown(e.clientY);
    const mv = e2 => onMove(e2.clientY);
    const up = () => { onUp(); document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', up);
  });
  resizerEl.addEventListener('touchstart', e => {
    e.preventDefault();
    onDown(e.touches[0].clientY);
    const mv = e2 => onMove(e2.touches[0].clientY);
    const up = () => { onUp(); document.removeEventListener('touchmove', mv); document.removeEventListener('touchend', up); };
    document.addEventListener('touchmove', mv, { passive: false });
    document.addEventListener('touchend', up);
  }, { passive: false });
}

function _formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()];
  const tfMins = tfMin(S.tf || '1h');
  if (tfMins >= 1440) return `${d.getUTCDate()} ${mon} '${String(d.getUTCFullYear()).slice(2)}`;
  const h = String(d.getUTCHours()).padStart(2,'0');
  const m = String(d.getUTCMinutes()).padStart(2,'0');
  return `${d.getUTCDate()} ${mon} '${String(d.getUTCFullYear()).slice(2)} ${h}:${m}`;
}

// ═══ Time axes — only bottommost visible panel shows time ruler ══════
function updateTimeAxes() {
  const tsBase = { timeVisible: true, secondsVisible: false, borderColor: '#2a2e39' };
  const hasSubs = S.panelOrder.length > 0;
  try { S.charts.main.applyOptions({ timeScale: { ...tsBase, visible: !hasSubs } }); } catch (_) {}
  S.panelOrder.forEach((key, i) => {
    const subData = S.subCharts.get(key);
    if (!subData) return;
    const isLast = i === S.panelOrder.length - 1;
    try { subData.chart.applyOptions({ timeScale: { ...tsBase, visible: isLast } }); } catch (_) {}
  });
}

// ═══ Sub-chart creation / destruction ════════════════════════════════
function _subBaseOptions() {
  return {
    layout: { background: { color: '#131722' }, textColor: '#c0c3cc' },
    grid:   { vertLines: { color: '#1a1e2a' }, horzLines: { color: '#1a1e2a' } },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Magnet,
      vertLine: { visible: false, labelVisible: false, color: '#758696', width: 1, style: 3, labelBackgroundColor: '#4c525e' },
      horzLine: { visible: true,  labelVisible: true,  color: '#758696', width: 1, style: 2, labelBackgroundColor: '#4c525e' },
    },
    timeScale: { visible: false },
    rightPriceScale: { scaleMargins: { top: 0.1, bottom: 0.1 }, borderColor: '#2a2e39' },
    leftPriceScale:  { visible: false },
    handleScroll: { mouseWheel: true, pressedMouseMove: true },
    handleScale:  false,
  };
}

function createSubChart(key, displayName) {
  if (S.subCharts.has(key)) return S.subCharts.get(key);
  const height = 140;

  const item = document.createElement('div');
  item.className = 'sub-chart-item';
  item.dataset.key = key;
  item.draggable = true;
  item.innerHTML = `
    <div class="sub-resizer" data-key="${key}"></div>
    <div class="sub-chart-inner" id="sub-inner-${key}" style="height:${height}px"></div>
    <div class="sub-panel-header">
      <span class="sub-panel-drag" title="Drag to reorder">⠿</span>
      <span class="sub-panel-label" title="${displayName}">${displayName}</span>
      <button class="sub-panel-close" title="Remove indicator">×</button>
    </div>`;

  item.querySelector('.sub-panel-close').addEventListener('click', e => {
    e.stopPropagation();
    removeInd(e, key);
  });

  g('subChartsArea').appendChild(item);

  const chartEl = item.querySelector(`#sub-inner-${key}`);
  const chart = LightweightCharts.createChart(chartEl, _subBaseOptions());

  const subData = { chart, anchor: null, anchorTs: [], height, el: item, chartEl, displayName };
  S.subCharts.set(key, subData);
  S.panelOrder.push(key);

  setupSubResizer(item.querySelector('.sub-resizer'), key);
  setupSubDrag(item, key);
  setupSubChartSync(chart, key);

  const W = _chartAreaEl.clientWidth || window.innerWidth;
  try { chart.resize(W, height); } catch (_) {}

  if (_handleCrosshairMove) {
    chart.subscribeCrosshairMove(param => _handleCrosshairMove(chart, param));
  }

  return subData;
}

function destroySubChart(key) {
  const subData = S.subCharts.get(key);
  if (!subData) return;
  const xl = _subXLines.get(key);
  if (xl) { try { xl.series.removePriceLine(xl.line); } catch (_) {} _subXLines.delete(key); }
  try { subData.chart.remove(); } catch (_) {}
  subData.el.remove();
  S.subCharts.delete(key);
  const idx = S.panelOrder.indexOf(key);
  if (idx >= 0) S.panelOrder.splice(idx, 1);
}

function setupSubChartSync(chart, key) {
  let interacting = false;
  let interactTimer = null;
  const setInteracting = v => { interacting = v; };

  const subData = S.subCharts.get(key);
  if (subData) {
    subData.el.addEventListener('mousedown', () => setInteracting(true));
    subData.el.addEventListener('mouseup',   () => setInteracting(false));
    subData.el.addEventListener('mouseleave',() => setInteracting(false));
    subData.el.addEventListener('wheel', () => {
      setInteracting(true);
      clearTimeout(interactTimer);
      interactTimer = setTimeout(() => setInteracting(false), 300);
    }, { passive: true });
  }

  chart.timeScale().subscribeVisibleLogicalRangeChange(() => {
    if (_chartSyncInProgress || !interacting) return;
    _chartSyncInProgress = true;
    _syncMainFromSubKey(key);
    const mainRange = S.charts.main.timeScale().getVisibleLogicalRange();
    if (mainRange) {
      S.subCharts.forEach((_, k) => { if (k !== key) _syncSubChartByKey(k, mainRange); });
    }
    _chartSyncInProgress = false;
  });
}

function setupSubDrag(item, key) {
  item.addEventListener('dragstart', e => {
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', key);
    setTimeout(() => item.classList.add('drag-source'), 0);
  });
  item.addEventListener('dragend', () => {
    item.classList.remove('drag-source');
    g('subChartsArea').querySelectorAll('.sub-chart-item').forEach(el => {
      el.classList.remove('drag-over-top', 'drag-over-bottom');
    });
  });
  item.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const rect = item.getBoundingClientRect();
    g('subChartsArea').querySelectorAll('.sub-chart-item').forEach(el => el.classList.remove('drag-over-top', 'drag-over-bottom'));
    item.classList.add(e.clientY < rect.top + rect.height / 2 ? 'drag-over-top' : 'drag-over-bottom');
  });
  item.addEventListener('dragleave', () => item.classList.remove('drag-over-top', 'drag-over-bottom'));
  item.addEventListener('drop', e => {
    e.preventDefault();
    const fromKey = e.dataTransfer.getData('text/plain');
    if (fromKey === key) return;
    const area = g('subChartsArea');
    const fromEl = area.querySelector(`[data-key="${fromKey}"]`);
    if (!fromEl) return;
    const rect = item.getBoundingClientRect();
    area.insertBefore(fromEl, e.clientY < rect.top + rect.height / 2 ? item : item.nextSibling);
    item.classList.remove('drag-over-top', 'drag-over-bottom');
    S.panelOrder.length = 0;
    area.querySelectorAll('.sub-chart-item').forEach(el => S.panelOrder.push(el.dataset.key));
    updateTimeAxes();
    relayout();
  });
}

// ═══ Crosshair sync + OHLCV legend ═══════════════════════════════
// Main chart: shown when cursor is on sub panel so candle close value stays on right axis
let _mainXLine = null;
let _mainXLineSeries = null;
const _subXLines = new Map(); // key → { line, series }

function updateMainValueLine(time) {
  _removeMainValueLine();
  if (!time || !S.series.candle || !S.candles.length) return;
  let lo = 0, hi = S.candles.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (S.candles[mid].timestamp <= time) lo = mid; else hi = mid - 1; }
  if (!S.candles[lo]) return;
  try {
    _mainXLine = S.series.candle.createPriceLine({
      price: +S.candles[lo].close,
      color: 'rgba(255,255,255,0.55)',
      lineWidth: 1,
      lineStyle: 2,  // LineStyle.Dashed
      axisLabelVisible: true,
      title: '',
    });
    _mainXLineSeries = S.series.candle;
  } catch (_) {}
}

function _removeMainValueLine() {
  if (_mainXLine && _mainXLineSeries) {
    try { _mainXLineSeries.removePriceLine(_mainXLine); } catch (_) {}
    _mainXLine = null; _mainXLineSeries = null;
  }
}

function updateSubValueLines(time) {
  _removeSubValueLines();
  if (!time) return;
  S.subCharts.forEach((subData, key) => {
    const entry = S.activeInds.get(key);
    if (!entry || !entry.on || !entry.series || !entry.data.length) return;
    const data = entry.data;
    let lo = 0, hi = data.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (data[mid].time <= time) lo = mid; else hi = mid - 1; }
    if (!data[lo] || data[lo].time > time) return;
    try {
      const line = entry.series.createPriceLine({
        price: data[lo].value,
        color: 'rgba(255,255,255,0.55)',
        lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '',
      });
      _subXLines.set(key, { line, series: entry.series });
    } catch (_) {}
  });
}

function _removeSubValueLines() {
  _subXLines.forEach(({ line, series }) => { try { series.removePriceLine(line); } catch (_) {} });
  _subXLines.clear();
}

// Returns the Y coordinate for the indicator in a specific sub-chart at `time`.
function _getSubCrosshairY(time, key) {
  const subData = S.subCharts.get(key);
  const fallback = subData ? subData.chartEl.clientHeight / 2 : 0;
  const entry = S.activeInds.get(key);
  if (!entry || !entry.on || entry.displayType !== 'sub_panel' || !entry.series || !entry.data.length) return fallback;
  const data = entry.data;
  let lo = 0, hi = data.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (data[mid].time <= time) lo = mid; else hi = mid - 1; }
  if (data[lo] && data[lo].time <= time) {
    try {
      const y = entry.series.priceToCoordinate(data[lo].value);
      if (y !== null && y !== undefined) return y;
    } catch (_) {}
  }
  return fallback;
}

function initCrosshairSync() {
  const xhairLine      = g('xhairLine');
  const xhairTimeLabel = g('xhairTimeLabel');

  _handleCrosshairMove = function(sourceChart, param) {
    if (_xhairSync) return;
    _xhairSync = true;
    try {
      if (sourceChart === S.charts.main) updateOhlcLegend(param);
      else if (!param.time) updateOhlcLegend(null);

      const time = param.time;

      if (!time) {
        xhairLine.style.display = 'none';
        xhairTimeLabel.style.display = 'none';
        _removeMainValueLine();
        _removeSubValueLines();
        if (sourceChart !== S.charts.main) try { S.charts.main.setCrossHairXY(-1, -1, false); } catch (_) {}
        S.subCharts.forEach((subData) => {
          if (subData.chart !== sourceChart) try { subData.chart.setCrossHairXY(-1, -1, false); } catch (_) {}
        });
      } else if (param.point) {
        // Keep xhairLine height in sync with current layout (sub-charts may have been added)
        const statusH = (g('status').offsetHeight || 18) + 8;
        xhairLine.style.height  = (_chartAreaEl.clientHeight - statusH) + 'px';
        xhairLine.style.left    = param.point.x + 'px';
        xhairLine.style.display = 'block';
        if (S.panelOrder.length > 0) {
          xhairTimeLabel.textContent   = _formatTime(time);
          xhairTimeLabel.style.display = 'block';
        } else {
          xhairTimeLabel.style.display = 'none';
        }
        updateMainValueLine(time);
        updateSubValueLines(time);
        if (sourceChart !== S.charts.main) {
          const mainH = g('chartMain').clientHeight;
          try { S.charts.main.setCrossHairXY(param.point.x, mainH / 2, true); } catch (_) {}
        }
        S.subCharts.forEach((subData, k) => {
          if (subData.chart !== sourceChart) {
            const syncY = _getSubCrosshairY(time, k);
            try { subData.chart.setCrossHairXY(param.point.x, syncY, true); } catch (_) {}
          }
        });
      }
    } finally {
      _xhairSync = false;
    }
  };

  S.charts.main.subscribeCrosshairMove(param => _handleCrosshairMove(S.charts.main, param));
}

function updateOhlcLegend(param) {
  const el = g('ohlcLegend');
  if (!el) return;

  if (!param || !param.time || !S.candles.length) {
    if (S.candles.length) {
      const c = S.candles[S.candles.length - 1];
      renderOhlcLegend(+c.open, +c.high, +c.low, +c.close, +c.volume || 0);
    } else {
      el.innerHTML = '';
    }
    return;
  }

  // Binary-search for the candle nearest to param.time
  const ts = param.time;
  let lo = 0, hi = S.candles.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (S.candles[mid].timestamp < ts) lo = mid + 1;
    else hi = mid;
  }
  // lo = first index with timestamp >= ts; compare with lo-1 to pick nearest
  const c1 = S.candles[lo];
  const c0 = lo > 0 ? S.candles[lo - 1] : null;
  const candle = c0 && Math.abs(c0.timestamp - ts) <= Math.abs(c1.timestamp - ts) ? c0 : c1;
  renderOhlcLegend(+candle.open, +candle.high, +candle.low, +candle.close, +candle.volume || 0);
}

function renderOhlcLegend(o, h, l, c, v) {
  const el = g('ohlcLegend');
  if (!el) return;
  const fmt  = n => (+n).toFixed(4);
  const fmtV = n => n >= 1e6 ? (n/1e6).toFixed(2)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : (+n).toFixed(0);
  const col  = c >= o ? 'var(--green)' : 'var(--red)';
  el.innerHTML =
    `<span class="ol-lbl">O</span><span style="color:${col}">${fmt(o)}</span>` +
    `<span class="ol-lbl">H</span><span style="color:${col}">${fmt(h)}</span>` +
    `<span class="ol-lbl">L</span><span style="color:${col}">${fmt(l)}</span>` +
    `<span class="ol-lbl">C</span><span style="color:${col}">${fmt(c)}</span>` +
    `<span class="ol-lbl">V</span><span style="color:var(--text)">${fmtV(v)}</span>`;
}

function smartLimit() {
  const tf = S.tf || val('selTf') || '1m';
  const mins = tfMin(tf);
  if (mins <= 1)  return 2000;
  if (mins <= 5)  return 5000;
  if (mins <= 60) return 10000;
  return 20000;
}

// ═══ Load chart ══════════════════════════════════════════════════════
async function loadChart() {
  S.ex = val('selEx'); S.sym = val('selSym'); S.tf = val('selTf');
  if (!S.ex || !S.sym || !S.tf) return;
  const gen = ++S.chartGen;
  try {
    load(true, `Loading ${S.sym} ${S.tf}…`);

    const lim = smartLimit();
    const cRes = await api(`/api/chart?exchange=${S.ex}&symbol=${S.sym}&timeframe=${S.tf}&limit=${lim}`);
    if (gen !== S.chartGen) return; // superseded by a newer loadChart() call

    // Drop candles with null/zero OHLC — they have valid timestamps in DB but no
    // price data yet (race condition during ingestion). Keeping them in S.candles
    // would stretch indTsParams() and clipToCandles() beyond the visible chart range,
    // causing RSI/indicator desync.
    S.candles    = (cRes.data || [])
      .filter(c => c.timestamp && isFinite(+c.open) && isFinite(+c.high) && isFinite(+c.low) && isFinite(+c.close)
                   && +c.open && +c.high && +c.low && +c.close)
      .sort((a, b) => a.timestamp - b.timestamp);
    S.oldestTs   = S.candles.length ? S.candles[0].timestamp : null;
    S.noMoreData = false;

    // Clear only after data arrives — avoids blank chart during network wait
    clearMainSeries();
    renderCandles();
    renderVolume();
    await refreshActiveIndicators(gen);
    if (gen !== S.chartGen) return; // superseded during indicator fetch

    renderSignals();
    relayout();
    // Guard: prevent fitContent from triggering the lazy-load scroll handler
    S.fitting = true;
    S.charts.main.timeScale().fitContent();
    setTimeout(() => { S.fitting = false; }, 600);

    buildIndDropdown();
    updateStatus();

    // Load signals in background — don't block chart render
    fetchSignals();

    // Start/restart realtime WS for the new exchange/symbol/timeframe
    connectRealtimeWS();
  } catch (e) { showErr(e.message); }
  finally { if (gen === S.chartGen) load(false); }
}

async function fetchSignals() {
  try {
    const res = await api('/api/strategies/signals?limit=20000');
    S.allSignals = res.data?.signals || [];
    renderSignals();
    updateStatus();
  } catch (_) {}
}

// ═══ Lazy load more (scroll left) ════════════════════════════════════
async function loadMore() {
  if (!S.oldestTs || S.loadingMore) return;
  S.loadingMore = true;
  g('loadMoreBar').classList.remove('h');
  g('loadMoreBar').innerHTML = '<div class="spin" style="width:10px;height:10px;margin:0"></div> Loading older candles…';
  try {
    const lim = smartLimit();
    const res = await api(`/api/chart?exchange=${S.ex}&symbol=${S.sym}&timeframe=${S.tf}&limit=${lim}&before_timestamp=${S.oldestTs}`);
    const more = (res.data || [])
      .filter(c => c.timestamp && isFinite(+c.open) && isFinite(+c.high) && isFinite(+c.low) && isFinite(+c.close)
                   && +c.open && +c.high && +c.low && +c.close && c.timestamp < S.oldestTs);
    if (!more.length) { S.noMoreData = true; S.loadingMore = false; g('loadMoreBar').classList.add('h'); return; }

    // Merge, sort ascending, deduplicate — prevents duplicate-timestamp crash in lightweight-charts
    const merged = [...more, ...S.candles].sort((a, b) => a.timestamp - b.timestamp);
    S.candles = merged.filter((c, i) => i === 0 || c.timestamp !== merged[i - 1].timestamp);
    S.oldestTs = S.candles[0].timestamp;

    // Save visible range before setData — prepending data shifts logical indices
    const visRange = S.charts.main.timeScale().getVisibleLogicalRange();
    const offset = more.length;

    const ohlcData = toOhlc(S.candles);
    if (S.series.candle) S.series.candle.setData(ohlcData);
    if (S.series.line)   S.series.line.setData(ohlcData.map(c => ({ time: c.time, value: c.close })));
    if (S.series.vol)    S.series.vol.setData(volData());
    if (ohlcData.length) {
      S.displayedCandleT0 = ohlcData[0].time;
      S.displayedCandleT1 = ohlcData[ohlcData.length - 1].time;
    }
    // Extend anchor left edge to cover newly prepended candles
    _setAllSubAnchors();
    // Restore shifted viewport so the visible window doesn't jump
    if (visRange) {
      S.charts.main.timeScale().setVisibleLogicalRange({
        from: visRange.from + offset,
        to:   visRange.to  + offset,
      });
    }
    // Force sub-chart sync in next frame — LWC may have already auto-compensated
    // the viewport shift, so setVisibleLogicalRange above might not fire the
    // subscribeVisibleLogicalRangeChange callback (no change detected). Explicit
    // timestamp-based sync guarantees sub-charts show the correct window.
    requestAnimationFrame(() => {
      const r = S.charts.main.timeScale().getVisibleLogicalRange();
      if (r && S.subCharts.size > 0) _syncAllSubCharts(r);
    });

    renderSignals();
    updateStatus();
  } catch (_) {}
  finally {
    S.loadingMore = false;
    g('loadMoreBar').classList.add('h');
  }
}

// ═══ Render candles ═══════════════════════════════════════════════════
function renderCandles() {
  rmSeries(S.charts.main, 'candle');
  rmSeries(S.charts.main, 'line');
  if (!S.layers.candles || !S.candles.length) return;

  const data = toOhlc(S.candles);
  S.displayedCandleT0 = data.length ? data[0].time : null;
  S.displayedCandleT1 = data.length ? data[data.length - 1].time : null;
  S.subCharts.forEach(subData => { subData.anchorTs = []; });
  _setAllSubAnchors();
  S.series.candle = S.charts.main.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350',
    borderUpColor: '#26a69a', borderDownColor: '#ef5350',
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
  });
  S.series.candle.setData(data);
  // invisible line for markers
  S.series.line = S.charts.main.addLineSeries({ color: 'transparent', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  S.series.line.setData(data.map(c => ({ time: c.time, value: c.close })));
  updatePrice();
  updateOhlcLegend(null); // show last candle OHLCV in legend
}

// ═══ Render volume ════════════════════════════════════════════════════
function volData() {
  return S.candles
    .filter(c => c.timestamp)
    .map(c => ({
      time: c.timestamp, value: +c.volume || 0,
      color: +c.close >= +c.open ? 'rgba(38,166,154,.45)' : 'rgba(239,83,80,.45)',
    }));
}
function renderVolume() {
  if (!S.layers.volume) {
    rmSeries(S.charts.main, 'vol');
    return;
  }
  if (!S.candles.length) return;
  if (S.series.vol) {
    S.series.vol.setData(volData());
  } else {
    S.series.vol = S.charts.main.addHistogramSeries({
      priceScaleId: '',
      priceFormat: { type: 'volume' },
      scaleMargins: { top: 0.85, bottom: 0 },
      lastValueVisible: false,
      priceLineVisible: false,
    });
    S.series.vol.setData(volData());
  }
}

// ═══ Render signals ════════════════════════════════════════════════════
function renderSignals() {
  const target = S.series.candle || S.series.line;
  if (target) target.setMarkers([]);
  if (!S.layers.signals || !S.allSignals.length || !target) return;

  // Only show signals at timestamps that exactly exist in the loaded candles.
  // This prevents stacking markers outside the visible candle range.
  const candleTs = new Set(S.candles.map(c => c.timestamp));

  const markers = S.allSignals
    .filter(s => s.exchange === S.ex && s.symbol === S.sym && candleTs.has(s.timestamp))
    .map(s => {
      const buy = s.signal_type?.toLowerCase() === 'buy';
      const label = s.strategy_name.replace(/_strategy.*/, '').replace(/_multi_timeframe/, '');
      const conf  = s.confidence != null ? ` ${(s.confidence * 100 | 0)}%` : '';
      return {
        time: s.timestamp,
        position: buy ? 'belowBar' : 'aboveBar',
        color: buy ? '#26a69a' : '#ef5350',
        shape: buy ? 'arrowUp' : 'arrowDown',
        text: label + conf,
        size: 1,
      };
    })
    .sort((a, b) => a.time - b.time);

  target.setMarkers(markers);
}

// ═══ Indicator Library Modal ══════════════════════════════════════════
let L = { pandas_ta: [], primitives: [], user: [] }; // library data
let L_loaded = false;
let L_sel = null;   // currently selected indicator schema object

async function openIndModal() {
  g('indModal').classList.add('open');
  g('indSearch').value = '';
  if (!L_loaded) await loadLibrary();
  renderLibraryList('');
  g('indSearch').focus();
}

function closeIndModal() { g('indModal').classList.remove('open'); L_sel = null; }
function onModalBgClick(e) { if (e.target === g('indModal')) closeIndModal(); }

document.addEventListener('keydown', e => {

async function loadLibrary() {
  try {
    const r = await api('/api/indicators/library');
    L.pandas_ta  = r.pandas_ta  || [];
    L.primitives = r.primitives || [];
    L.user       = r.user       || [];
    L_loaded = true;
  } catch (_) { L_loaded = false; }
}

function filterLibrary(q) { renderLibraryList(q.trim().toLowerCase()); }

function renderLibraryList(q) {
  const match = item => !q || item.name.toLowerCase().includes(q)
                             || (item.display || '').toLowerCase().includes(q);

  // Build grouped list: active (on chart) first, then by category
  const categories = {};
  const addToGroup = (item, badge) => {
    const cat = item.category || 'Other';
    (categories[cat] = categories[cat] || []).push({ ...item, badge });
  };

  // Stored/active indicators on top
  if (!q) {
    S.activeInds.forEach((_, key) => {
      const meta = S.indMeta.get(key);
      if (meta) addToGroup({ name: key, display: meta.display_name || key, category: 'On Chart' }, '✓');
    });
  }

  [...L.user, ...L.primitives].filter(match).forEach(i => addToGroup(i, ''));
  L.pandas_ta.filter(match).forEach(i => addToGroup(i, ''));

  let html = '';
  if (Object.keys(categories).length === 0 && q) {
    html = '<div style="padding:14px;color:var(--dim);font-size:12px">No results</div>';
  } else {
    const ORDER = ['On Chart', 'My Indicators', 'Custom Primitives',
                   'Trend', 'Oscillators', 'Momentum', 'Volatility', 'Volume',
                   'Statistics', 'Overlap', 'Performance', 'Candle'];
    // Put "Other" always last
    const allCats = [...new Set([...ORDER, ...Object.keys(categories)])].filter(c => categories[c]);
    const sorted = [...allCats.filter(c => c !== 'Other'), ...allCats.filter(c => c === 'Other')];
    sorted.forEach(cat => {
      html += `<div class="ind-cat-label">${cat}</div>`;
      html += categories[cat].map(item => {
        const sel = L_sel && L_sel.name === item.name ? ' sel' : '';
        return `<div class="ind-lib-item${sel}" onclick='selectLibItem(${JSON.stringify(JSON.stringify(item))})'>
          <span>${item.display || item.name.toUpperCase()}</span>
          <span class="ind-lib-item-badge">${item.badge || ''}</span>
        </div>`;
      }).join('');
    });
    html += `<div style="padding:4px 0"><button class="ind-new-btn" onclick="openEditorModal()">+ Write custom indicator</button></div>`;
  }
  g('indLibList').innerHTML = html;
}

function selectLibItem(jsonStr) {

  // Re-render list to highlight selected
  renderLibraryList(g('indSearch').value.trim().toLowerCase());
  renderSettings(L_sel);
