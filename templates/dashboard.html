<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Dashboard</title>
<script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #131722; --surface: #1e222d; --border: #2a2e39; --muted: #434651;
    --text: #d1d4dc; --dim: #787b86; --accent: #2962ff; --green: #26a69a; --red: #ef5350;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; overflow: hidden; }
  .layout { display: grid; grid-template-rows: 44px 1fr; height: 100vh; }

  /* ── Topbar ── */
  .topbar {
    display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    overflow: hidden; min-width: 0;
  }
  .topbar-title { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

  select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 3px 6px; border-radius: 4px; font-size: 12px; cursor: pointer; outline: none;
  }
  select:hover { border-color: var(--muted); }

  /* layer toggles */
  .toggles { display: flex; gap: 4px; }
  .tog {
    padding: 3px 9px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--bg); color: var(--dim); font-size: 12px;
    cursor: pointer; user-select: none; white-space: nowrap;
    transition: background .12s, color .12s, border-color .12s;
  }
  .tog.on          { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tog.on.g        { background: var(--green);  border-color: var(--green); }

  /* indicator chips area */
  .ind-area { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; overflow: hidden; min-width: 0; position: relative; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 10px; font-size: 11px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    cursor: pointer; white-space: nowrap; user-select: none;
    transition: opacity .12s;
  }
  .chip.off { opacity: 0.4; }
  .chip-x { color: var(--dim); font-size: 13px; line-height: 1; margin-left: 2px; }
  .chip-x:hover { color: var(--red); }

  /* add indicator button */
  .add-ind-btn {
    padding: 3px 9px; border-radius: 4px; border: 1px dashed var(--muted);
    background: transparent; color: var(--dim); font-size: 12px;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: color .12s, border-color .12s;
  }
  .add-ind-btn:hover { color: var(--text); border-color: var(--text); }

  /* ── Indicator library modal ── */
  .ind-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 300;
    display: none; align-items: flex-start; justify-content: center; padding-top: 56px;
  }
  .ind-modal.open { display: flex; }
  .ind-modal-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    width: 700px; max-height: 72vh; display: flex; flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,.6); overflow: hidden;
  }
  .ind-modal-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .ind-modal-head input {
    flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 5px 10px; border-radius: 4px; font-size: 13px; outline: none;
  }
  .ind-modal-head input:focus { border-color: var(--accent); }
  .ind-modal-close {
    background: none; border: none; color: var(--dim); font-size: 18px;
    cursor: pointer; padding: 0 4px; line-height: 1; flex-shrink: 0;
  }
  .ind-modal-close:hover { color: var(--text); }
  .ind-modal-body { display: flex; flex: 1; overflow: hidden; }

  /* Left: scrollable indicator list */
  .ind-lib-list {
    width: 240px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid var(--border);
  }
  .ind-lib-list::-webkit-scrollbar { width: 4px; }
  .ind-lib-list::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }
  .ind-cat-label {
    padding: 6px 12px 3px; font-size: 10px; color: var(--dim);
    letter-spacing: .5px; text-transform: uppercase; position: sticky; top: 0;
    background: var(--surface); z-index: 1;
  }
  .ind-lib-item {
    padding: 6px 12px; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; justify-content: space-between;
    transition: background .08s;
  }
  .ind-lib-item:hover  { background: var(--border); }
  .ind-lib-item.sel    { background: rgba(41,98,255,.2); color: var(--accent); }
  .ind-lib-item-badge  { font-size: 10px; color: var(--dim); }
  .ind-new-btn {
    margin: 6px 10px; padding: 4px 10px; border-radius: 4px;
    border: 1px dashed var(--muted); background: transparent; color: var(--dim);
    font-size: 11px; cursor: pointer; width: calc(100% - 20px); text-align: left;
  }
  .ind-new-btn:hover { color: var(--text); border-color: var(--text); }

  /* Right: settings panel */
  .ind-settings {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px;
  }
  .ind-settings-title { font-size: 14px; font-weight: 600; }
  .ind-settings-group { display: flex; flex-direction: column; gap: 8px; }
  .ind-settings-row   { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ind-settings-label { font-size: 12px; color: var(--dim); flex-shrink: 0; width: 80px; }
  .ind-settings-row input[type=number], .ind-settings-row select {
    flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 4px 8px; border-radius: 4px; font-size: 12px; outline: none;
  }
  .ind-settings-row input:focus, .ind-settings-row select:focus { border-color: var(--accent); }
  .ind-settings-tf {
    flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 4px 8px; border-radius: 4px; font-size: 12px; outline: none; cursor: pointer;
  }
  .ind-settings-actions { display: flex; gap: 8px; margin-top: 4px; }
  .btn-apply {
    flex: 1; padding: 6px 14px; border-radius: 4px; border: none;
    background: var(--accent); color: #fff; font-size: 12px; cursor: pointer;
    transition: opacity .12s;
  }
  .btn-apply:hover { opacity: .85; }
  .btn-apply:disabled { opacity: .4; cursor: default; }
  .btn-cancel {
    padding: 6px 14px; border-radius: 4px; border: 1px solid var(--border);
    background: transparent; color: var(--dim); font-size: 12px; cursor: pointer;
  }
  .btn-cancel:hover { color: var(--text); }
  .ind-progress {
    font-size: 11px; color: var(--dim); display: none;
    align-items: center; gap: 6px;
  }
  .ind-progress.on { display: flex; }
  .ind-progress .spin { width: 12px; height: 12px; margin: 0; }

  /* ── Custom indicator editor modal ── */
  .editor-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 400;
    display: none; align-items: center; justify-content: center;
  }
  .editor-modal.open { display: flex; }
  .editor-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    width: 900px; height: min(680px, 88vh); display: flex; flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,.7); overflow: hidden;
  }
  .editor-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .editor-head-title { font-size: 13px; font-weight: 600; }
  .editor-head input {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 4px 8px; border-radius: 4px; font-size: 12px; outline: none; width: 160px;
  }
  .editor-head input:focus { border-color: var(--accent); }
  .editor-close {
    margin-left: auto; background: none; border: none; color: var(--dim);
    font-size: 18px; cursor: pointer; padding: 0 4px;
  }
  .editor-close:hover { color: var(--text); }
  .editor-params {
    padding: 8px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .editor-param-chip {
    display: flex; align-items: center; gap: 4px; padding: 2px 8px;
    border: 1px solid var(--border); border-radius: 10px; font-size: 11px;
  }
  .editor-param-chip span { color: var(--dim); }
  .editor-param-chip button { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 13px; padding: 0; }
  .editor-param-chip button:hover { color: var(--red); }
  .editor-add-param {
    padding: 2px 8px; border: 1px dashed var(--muted); border-radius: 10px;
    background: transparent; color: var(--dim); font-size: 11px; cursor: pointer;
  }
  .editor-add-param:hover { color: var(--text); border-color: var(--text); }
  #monacoMount { flex: 1; min-height: 320px; }
  .editor-hint {
    padding: 4px 14px; font-size: 10px; color: var(--dim);
    border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .editor-range {
    display: flex; align-items: center; gap: 6px; padding: 6px 14px;
    border-top: 1px solid var(--border); flex-shrink: 0; background: var(--panel);
  }
  .editor-range .range-label { font-size: 11px; color: var(--dim); flex-shrink: 0; }
  .editor-range .range-sep   { font-size: 11px; color: var(--dim); }
  .editor-range input[type="date"] {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 6px; font-size: 11px; color-scheme: dark;
  }
  .editor-range .range-clear {
    font-size: 10px; padding: 2px 7px; border-radius: 4px;
    border: 1px solid var(--border); background: transparent; color: var(--dim);
    cursor: pointer; margin-left: 2px;
  }
  .editor-range .range-clear:hover { color: var(--text); border-color: var(--muted); }
  .editor-actions {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    border-top: 1px solid var(--border); flex-shrink: 0;
  }

  /* price */
  .price-area { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .price-val { font-size: 15px; font-weight: 700; }
  .price-chg { font-size: 11px; }
  .up { color: var(--green); } .dn { color: var(--red); }

  .nav-btn {
    padding: 3px 9px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--bg); color: var(--dim); font-size: 12px;
    text-decoration: none; white-space: nowrap; flex-shrink: 0;
    transition: color .12s, border-color .12s;
  }
  .nav-btn:hover { color: var(--text); border-color: var(--muted); }

  /* ── Chart area ── */
  .chart-area { display: flex; flex-direction: column; overflow: hidden; position: relative; }
  #chartMain   { width: 100%; flex: 1 1 auto; min-height: 0; }
  #chartVolume { width: 100%; flex: 0 0 auto; }
  #chartSub    { width: 100%; flex: 0 0 auto; }
  #chartVolume.h, #chartSub.h { display: none; }
  .chart-resizer {
    width: 100%; height: 5px; flex-shrink: 0; cursor: row-resize; position: relative; z-index: 5;
    background: var(--border);
    transition: background .12s;
  }
  .chart-resizer::after {
    content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 32px; height: 3px; border-radius: 2px;
    background: var(--muted); opacity: 0; transition: opacity .15s;
  }
  .chart-resizer:hover::after, .chart-resizer.dragging::after { opacity: 1; }
  .chart-resizer:hover, .chart-resizer.dragging { background: #2a3047; }
  .chart-resizer.h { display: none; }

  /* status bar */
  #status {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
    background: rgba(19,23,34,.8); border-top: 1px solid var(--border);
    padding: 2px 12px; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden;
  }

  /* loading */
  #loader {
    position: absolute; inset: 0; background: rgba(19,23,34,.7);
    display: flex; align-items: center; justify-content: center; z-index: 10; font-size: 13px; color: var(--dim);
  }
  #loader.h { display: none; }
  #loadMoreBar {
    position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
    background: rgba(19,23,34,.85); border: 1px solid var(--border); border-radius: 4px;
    padding: 3px 10px; font-size: 11px; color: var(--dim); z-index: 6;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  #loadMoreBar.h { display: none; }
  .spin {
    width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; margin-right: 10px; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Single crosshair overlay — one dashed line spanning all panels */
  #xhairLine {
    position: absolute; top: 0; left: 0;
    width: 0; border-left: 1px dashed rgba(255,255,255,0.35);
    pointer-events: none; display: none; z-index: 4;
  }
  #xhairTimeLabel {
    position: absolute; bottom: 0; left: 0;
    transform: translateX(-50%);
    background: #4c525e; color: #c0c3cc;
    font-size: 11px; font-family: 'Trebuchet MS', sans-serif;
    padding: 2px 6px; border-radius: 2px;
    white-space: nowrap; display: none;
  }

  /* error */
  #errBanner {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    background: #7f0000; color: #fff; padding: 5px 14px; border-radius: 4px;
    font-size: 12px; z-index: 20; display: none;
  }

  /* scrollbar */
  .ind-lib-list::-webkit-scrollbar-track { background: var(--surface); }
  .ind-settings::-webkit-scrollbar { width: 4px; }
  .ind-settings::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

  /* ── OHLCV hover legend ── */
  #chartMain { position: relative; }
  #ohlcLegend {
    position: absolute; top: 6px; left: 6px; z-index: 5;
    font-size: 11px; pointer-events: none; display: flex; gap: 5px; align-items: center;
    user-select: none; white-space: nowrap;
  }
  #ohlcLegend .ol-lbl { color: var(--dim); font-size: 10px; }

  /* ── Sub-panel move buttons ── */
  #chartVolume, #chartSub { position: relative; }
  .panel-hdr {
    position: absolute; top: 3px; left: 4px; z-index: 10;
    display: flex; align-items: center; gap: 2px;
    opacity: 0.35; transition: opacity .15s; pointer-events: all;
  }
  #chartVolume:hover .panel-hdr, #chartSub:hover .panel-hdr { opacity: 1; }
  .panel-move-btn {
    background: rgba(19,23,34,.85); border: 1px solid var(--muted); color: var(--dim);
    width: 18px; height: 18px; border-radius: 3px; font-size: 10px; cursor: pointer;
    padding: 0; line-height: 1; display: inline-flex; align-items: center; justify-content: center;
  }
  .panel-move-btn:hover { color: #fff; border-color: var(--text); background: var(--accent); }
  .panel-move-btn:disabled { opacity: .25; cursor: default; }

  /* ── Strategy panel ── */
  #stratPanel {
    position: fixed; top: 44px; right: 0; bottom: 0; width: 360px;
    background: var(--surface); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 50;
    transform: translateX(100%); transition: transform .2s ease;
  }
  #stratPanel.open { transform: translateX(0); }
  .sp-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .sp-title { font-size: 13px; font-weight: 600; }
  .sp-close {
    background: none; border: none; color: var(--dim); font-size: 18px;
    cursor: pointer; padding: 0 4px; line-height: 1;
  }
  .sp-close:hover { color: var(--text); }
  .sp-body { flex: 1; overflow-y: auto; padding: 8px 0; }
  .sp-body::-webkit-scrollbar { width: 4px; }
  .sp-body::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }
  .strat-row {
    padding: 8px 14px; cursor: pointer; border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  .strat-row:hover { background: var(--border); }
  .strat-row.active { background: rgba(41,98,255,.15); }
  .strat-name { font-size: 12px; font-weight: 600; margin-bottom: 3px; }
  .strat-meta { font-size: 11px; color: var(--dim); display: flex; gap: 10px; }
  .strat-sig-count { color: var(--accent); }
  .strat-last-sig { }
  /* signal detail table */
  .sig-detail { display: none; padding: 0; }
  .sig-detail.open { display: block; }
  .sig-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .sig-table th {
    padding: 5px 10px; text-align: left; color: var(--dim);
    border-bottom: 1px solid var(--border); font-weight: 400; position: sticky; top: 0;
    background: var(--surface);
  }
  .sig-table td { padding: 4px 10px; border-bottom: 1px solid rgba(42,46,57,.5); }
  .sig-buy  { color: var(--green); }
  .sig-sell { color: var(--red); }
  .sp-back {
    display: none; padding: 8px 14px; font-size: 12px; color: var(--accent);
    cursor: pointer; border-bottom: 1px solid var(--border);
  }
  .sp-back:hover { background: var(--border); }
</style>
</head>
<body>
<div class="layout">

  <!-- Topbar -->
  <div class="topbar" id="topbar">
    <span class="topbar-title">Trading</span>
    <div class="sep"></div>

    <select id="selEx"  onchange="onExChange()"></select>
    <select id="selSym" onchange="onSymChange()"></select>
    <select id="selTf"  onchange="loadChart()"></select>

    <div class="sep"></div>

    <div class="toggles">
      <button class="tog on"  id="btnC" onclick="tog('candles')">Candles</button>
      <button class="tog on g" id="btnV" onclick="tog('volume')">Volume</button>
      <button class="tog on g" id="btnS" onclick="tog('signals')">Signals</button>
    </div>

    <div class="sep"></div>

    <!-- Indicator area -->
    <div class="ind-area" id="indArea">
      <button class="add-ind-btn" onclick="openIndModal()">+ Indicator</button>
    </div>

    <div class="price-area">
      <span id="priceVal" class="price-val">—</span>
      <span id="priceChg" class="price-chg">—</span>
      <span id="wsLive" style="font-size:11px;margin-left:8px;color:#555;font-family:monospace">WS --</span>
    </div>
    <a href="/progress" class="nav-btn">Progress</a>
    <button class="nav-btn" id="btnStrat" onclick="toggleStratPanel()">Strategies</button>
  </div>

  <!-- Indicator library modal -->
  <div class="ind-modal" id="indModal" onclick="onModalBgClick(event)">
    <div class="ind-modal-box">
      <div class="ind-modal-head">
        <input id="indSearch" type="text" placeholder="Search indicators…" oninput="filterLibrary(this.value)" autofocus>
        <button class="ind-modal-close" onclick="closeIndModal()">×</button>
      </div>
      <div class="ind-modal-body">
        <!-- Left: indicator list -->
        <div class="ind-lib-list" id="indLibList"></div>
        <!-- Right: settings panel -->
        <div class="ind-settings" id="indSettings">
          <div style="color:var(--dim);font-size:12px;margin-top:20px;text-align:center">
            Select an indicator from the list
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Custom indicator editor modal -->
  <div class="editor-modal" id="editorModal" onclick="onEditorBgClick(event)">
    <div class="editor-box">
      <div class="editor-head">
        <span class="editor-head-title">New Indicator</span>
        <input id="editorName" type="text" placeholder="indicator_name">
        <button class="editor-close" onclick="closeEditorModal()">×</button>
      </div>
      <div class="editor-params" id="editorParams">
        <button class="editor-add-param" onclick="addEditorParam()">+ param</button>
      </div>
      <div id="monacoMount"></div>
      <div class="editor-hint">
        Available: <code>close open high low volume ts np ta</code> + your params above · assign <code>result</code>
      </div>
      <div class="editor-range">
        <span class="range-label">Range:</span>
        <input type="date" id="rangeFrom" title="Start date (leave empty for all history)">
        <span class="range-sep">→</span>
        <input type="date" id="rangeTo" title="End date (leave empty for all history)">
        <button class="range-clear" onclick="g('rangeFrom').value='';g('rangeTo').value=''">All history</button>
      </div>
      <div class="editor-actions">
        <button class="btn-cancel" onclick="closeEditorModal()">Cancel</button>
        <select id="editorDisplay" style="background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:12px;cursor:pointer">
          <option value="sub_panel">Sub-panel</option>
          <option value="overlay">Overlay on chart</option>
        </select>
        <button class="btn-apply" onclick="testCustomIndicator()" style="background:var(--muted)">▶ Test Run</button>
        <button class="btn-apply" onclick="saveCustomIndicator()">💾 Save to Library</button>
      </div>
    </div>
  </div>

  <!-- Strategy panel -->
  <div id="stratPanel">
    <div class="sp-header">
      <span class="sp-title" id="spTitle">Strategies</span>
      <button class="sp-close" onclick="toggleStratPanel()">×</button>
    </div>
    <div class="sp-back" id="spBack" onclick="showStratList()">← Back</div>
    <div class="sp-body" id="spBody">
      <div style="padding:20px;text-align:center;color:var(--dim);font-size:12px">Loading…</div>
    </div>
  </div>

  <!-- Charts -->
  <div class="chart-area" id="chartArea">
    <div id="chartMain">
      <div id="ohlcLegend"></div>
    </div>
    <div class="chart-resizer h" id="resizerVol"></div>
    <div id="chartVolume">
      <div class="panel-hdr" id="volHdr">
        <button class="panel-move-btn" id="volUpBtn" onclick="movePanel('vol',-1)" title="Move up">↑</button>
        <button class="panel-move-btn" id="volDnBtn" onclick="movePanel('vol',1)"  title="Move down">↓</button>
      </div>
    </div>
    <div class="chart-resizer h" id="resizerSub"></div>
    <div id="chartSub" class="h">
      <div class="panel-hdr" id="subHdr">
        <button class="panel-move-btn" id="subUpBtn" onclick="movePanel('sub',-1)" title="Move up">↑</button>
        <button class="panel-move-btn" id="subDnBtn" onclick="movePanel('sub',1)"  title="Move down">↓</button>
      </div>
    </div>

    <!-- Single crosshair line spanning main+resizer+sub panels -->
    <div id="xhairLine"><span id="xhairTimeLabel"></span></div>

    <div id="loader"><div class="spin"></div><span id="loaderMsg">Loading…</span></div>
    <div id="loadMoreBar" class="h"></div>
    <div id="errBanner"></div>
    <div id="status"></div>
  </div>
</div>

<script>
// ═══ State ═══════════════════════════════════════════════════════════
const S = {
  ex: '', sym: '', tf: '',
  layers: { candles: true, volume: true, signals: true },
  sources: [],
  candles: [],
  allSignals: [],
  allInds: [],           // stored indicators from /status
  activeInds: new Map(), // key → { on, series, subRefLines, data, meta }
  indMeta: new Map(),    // key → { display_name } for on-demand computed inds

  charts: { main: null, sub: null },
  series: { candle: null, line: null, vol: null, subAnchor: null },
  emaColors: ['#f6c90e','#a29bfe','#74b9ff','#fd79a8','#81ecec','#55efc4','#fdcb6e'],
  emaColorIdx: 0,
  indColorMap: new Map(),

  loadingMore: false,
  noMoreData: false,
  fitting: false,
  oldestTs: null,
  chartGen: 0,
  displayedCandleT0: null,
  displayedCandleT1: null,
  panelH: { sub: 140 },
  panelOrder: ['sub'],
};

// ═══ Boot ════════════════════════════════════════════════════════════
async function boot() {
  try {
    load(true, 'Loading sources…');
    const [srcRes, indRes] = await Promise.all([
      api('/api/data/sources'),
      api('/api/indicators/status'),
    ]);
    S.sources = srcRes.sources || [];
    S.allInds = (indRes.indicators || []).map(i => {
      const parts = i.connection.split('_'); // e.g. "whitebit_SOL_USDT_5m"
      // connection format: exchange_SYMBOL_tf (symbol may have underscore)
      return { name: i.name, connection: i.connection, count: i.count, ...parseConnection(i.connection) };
    });
    buildSelects();
    initCharts();
    initResizers();
    await loadChart();
  } catch (e) { showErr(e.message); }
  finally { load(false); }
}

function parseConnection(conn) {
  // Format: "whitebit_SOL_USDT_5m" → { exchange: 'whitebit', symbol: 'SOL_USDT', tf: '5m' }
  // First token = exchange (no underscore), last token = timeframe, middle = symbol
  const parts = conn.split('_');
  const tfPatterns = /^\d+[mhdw]$/;
  const tf = parts[parts.length - 1];
  const ex = parts[0];
  const sym = parts.slice(1, parts.length - 1).join('_');
  return { exchange: ex, symbol: sym, tf };
}

// ═══ Selects ═════════════════════════════════════════════════════════
function buildSelects() {
  const exs = [...new Set(S.sources.map(s => s.exchange))].sort();
  fill('selEx', exs); S.ex = exs[0] || '';
  buildSymbols();
}
function buildSymbols() {
  S.ex = val('selEx');
  const syms = [...new Set(S.sources.filter(s => s.exchange === S.ex).map(s => s.symbol))].sort();
  fill('selSym', syms); S.sym = syms[0] || '';
  buildTfs();
}
function buildTfs() {
  S.sym = val('selSym');
  const tfs = [...new Set(S.sources.filter(s => s.exchange === S.ex && s.symbol === S.sym).map(s => s.timeframe))]
    .sort((a, b) => tfMin(a) - tfMin(b));
  fill('selTf', tfs); S.tf = tfs[0] || '';
}
function onExChange() { buildSymbols(); loadChart(); }
function onSymChange() { buildTfs(); loadChart(); }

function fill(id, vals) {
  const el = g(id), prev = el.value;
  el.innerHTML = vals.map(v => `<option value="${v}">${v}</option>`).join('');
  if (vals.includes(prev)) el.value = prev;
}
function tfMin(tf) { return ({1:1,3:3,5:5,15:15,30:30,'1h':60,'2h':120,'4h':240,'6h':360,'12h':720,'1d':1440,'1w':10080})[tf.replace('m','').replace('h','h').replace('d','d').replace('w','w')] || ({ '1m':1,'3m':3,'5m':5,'15m':15,'30m':30,'1h':60,'2h':120,'4h':240,'6h':360,'12h':720,'1d':1440,'1w':10080 })[tf] || 9999; }

// ─── Shared time-axis sync helpers ───────────────────────────────────
// All panels share a single logical time axis. Moving any chart moves all
// others. Sync is bidirectional: main→sub and sub→main.

// Convert main-chart logical index → Unix timestamp (extrapolates outside data).
function _mainLogicalToTime(logIdx) {
  const n = S.candles.length;
  if (!n) return null;
  const dt = n > 1 ? S.candles[n - 1].timestamp - S.candles[n - 2].timestamp : 60;
  if (logIdx >= n - 1)
    return Math.round(S.candles[n - 1].timestamp + (logIdx - (n - 1)) * dt);
  if (logIdx < 0)
    return Math.round(S.candles[0].timestamp + logIdx * dt);
  const lo = Math.floor(logIdx);
  const frac = logIdx - lo;
  return Math.round(S.candles[lo].timestamp + frac * (S.candles[lo + 1].timestamp - S.candles[lo].timestamp));
}

// Inverse: Unix timestamp → main-chart fractional logical index.
function _timeToMainLogical(ts) {
  const n = S.candles.length;
  if (!n) return null;
  const dt = n > 1 ? S.candles[n - 1].timestamp - S.candles[n - 2].timestamp : 60;
  if (ts <= S.candles[0].timestamp) return (ts - S.candles[0].timestamp) / dt;
  if (ts >= S.candles[n - 1].timestamp) return (n - 1) + (ts - S.candles[n - 1].timestamp) / dt;
  let lo = 0, hi = n - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (S.candles[mid].timestamp <= ts) lo = mid; else hi = mid - 1; }
  const nextTs = S.candles[lo + 1]?.timestamp ?? S.candles[lo].timestamp + dt;
  return lo + (ts - S.candles[lo].timestamp) / (nextTs - S.candles[lo].timestamp);
}

// Sync lock — prevents the mutual callbacks from looping.
let _chartSyncInProgress = false;

// True only while the user is actively touching the sub chart (drag or wheel).
// Guards sub→main sync so programmatic setVisibleLogicalRange on sub never drives main.
let _subUserInteracting = false;
let _subInteractTimer   = null;

function _initSubInteraction() {
  const el = g('chartSub');
  if (!el) return;
  el.addEventListener('mousedown',  () => { _subUserInteracting = true; });
  el.addEventListener('mouseup',    () => { _subUserInteracting = false; });
  el.addEventListener('mouseleave', () => { _subUserInteracting = false; });
  el.addEventListener('wheel', () => {
    _subUserInteracting = true;
    clearTimeout(_subInteractTimer);
    _subInteractTimer = setTimeout(() => { _subUserInteracting = false; }, 300);
  }, { passive: true });
}

// [leftTs, rightTs] of the sub chart's transparent anchor series.
// Tracked here so _getSubTimeline() can include them in the merged timeline,
// ensuring the sub chart's logical indices match what we compute.
let _subAnchorTs = [];

// Set (or update) the sub chart anchor to span the full loaded candle range.
// Called once when candles load and when older candles are prepended.
// Only updates if the range actually changed; guards setData with
// _chartSyncInProgress so the triggered range-change event doesn't propagate.
function _setSubAnchor() {
  if (!S.series.subAnchor || !S.candles.length) return;
  const leftTs  = S.candles[0].timestamp;
  const rightTs = S.candles[S.candles.length - 1].timestamp;
  if (_subAnchorTs[0] === leftTs && _subAnchorTs[1] === rightTs) return;
  _subAnchorTs = [leftTs, rightTs];
  _chartSyncInProgress = true;
  try { S.series.subAnchor.setData([{ time: leftTs, value: 0 }, { time: rightTs, value: 0 }]); } catch (_) {}
  _chartSyncInProgress = false;
}

// Merged sorted array of all active sub-panel timestamps PLUS anchor timestamps.
// This exactly matches the sub chart's internal logical timeline so that our
// computed logical indices agree with LightweightCharts' internal indices.
function _getSubTimeline() {
  const tsSet = new Set(_subAnchorTs);
  for (const entry of S.activeInds.values()) {
    if (entry.on && entry.displayType === 'sub_panel' && entry.data.length) {
      for (const p of entry.data) tsSet.add(p.time);
    }
  }
  if (!tsSet.size) return null;
  const arr = Array.from(tsSet);
  arr.sort((a, b) => a - b);
  return arr;
}

// Convert a Unix timestamp → fractional logical index in the sub chart's timeline.
function _mainTimeToSubLogical(ts, timeline) {
  const n = timeline.length;
  const dt = n > 1 ? timeline[n - 1] - timeline[n - 2] : 60;
  if (ts <= timeline[0]) return (ts - timeline[0]) / dt;
  if (ts >= timeline[n - 1]) return (n - 1) + (ts - timeline[n - 1]) / dt;
  let lo = 0, hi = n - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (timeline[mid] <= ts) lo = mid; else hi = mid - 1; }
  const nextTs = timeline[lo + 1] ?? timeline[lo] + dt;
  return lo + (ts - timeline[lo]) / (nextTs - timeline[lo]);
}

// Convert a fractional logical index in the sub chart → Unix timestamp.
function _subLogicalToTime(l, timeline) {
  const n = timeline.length;
  const dt = n > 1 ? timeline[n - 1] - timeline[n - 2] : 60;
  if (l >= n - 1) return timeline[n - 1] + (l - (n - 1)) * dt;
  if (l < 0) return timeline[0] + l * dt;
  const lo = Math.floor(l);
  const t0 = timeline[lo], t1 = timeline[lo + 1] ?? timeline[lo] + dt;
  return t0 + (l - lo) * (t1 - t0);
}

// Sync sub chart to match main chart's current logical range.
// Uses setVisibleLogicalRange — no anchor coverage required, no setData side-effects.
function _syncSubChart(mainRange) {
  if (!mainRange) return;
  const timeline = _getSubTimeline();
  if (!timeline) return;
  const fromTime = _mainLogicalToTime(mainRange.from);
  const toTime   = _mainLogicalToTime(mainRange.to);
  if (fromTime === null || toTime === null) return;
  const fromL = _mainTimeToSubLogical(fromTime, timeline);
  const toL   = _mainTimeToSubLogical(toTime, timeline);
  try { S.charts.sub.timeScale().setVisibleLogicalRange({ from: fromL, to: toL }); } catch (_) {}
}

// Sync main chart to match sub chart's visible window (user dragged sub chart).
function _syncMainFromSub() {
  const subRange = S.charts.sub.timeScale().getVisibleLogicalRange();
  if (!subRange || !S.candles.length) return;
  const timeline = _getSubTimeline();
  if (!timeline) return;
  const fromTime = _subLogicalToTime(subRange.from, timeline);
  const toTime   = _subLogicalToTime(subRange.to, timeline);
  const mFrom = _timeToMainLogical(fromTime);
  const mTo   = _timeToMainLogical(toTime);
  if (mFrom === null || mTo === null) return;
  const span = mTo - mFrom;
  if (span < 2 || span > S.candles.length * 3) return;
  try { S.charts.main.timeScale().setVisibleLogicalRange({ from: mFrom, to: mTo }); } catch (_) {}
}

// ═══ Charts init ═════════════════════════════════════════════════════
function initCharts() {
  // Full crosshair line specs — all properties explicit to avoid v3.8 null errors
  // when a partial object is merged with uninitialised internal defaults.
  const _vLine = { visible: false, labelVisible: true,  color: '#758696', width: 1, style: 3, labelBackgroundColor: '#4c525e' };
  const _hLine = { visible: true,  labelVisible: true,  color: '#758696', width: 1, style: 2, labelBackgroundColor: '#4c525e' };

  const base = {
    layout: { background: { color: '#131722' }, textColor: '#c0c3cc' },
    grid:   { vertLines: { color: '#1a1e2a' }, horzLines: { color: '#1a1e2a' } },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Magnet,
      vertLine: { ..._vLine },  // native vertLine hidden — CSS #xhairLine overlay used instead
      horzLine: { ..._hLine },  // main chart shows horzLine at current price level
    },
    timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2a2e39' },
    rightPriceScale: { borderColor: '#2a2e39' },
    handleScroll: { mouseWheel: true, pressedMouseMove: true },
    handleScale:  { axisPressedMouseMove: true, mouseWheel: true, pinch: true },
  };
  S.charts.main = LightweightCharts.createChart(g('chartMain'), { ...base });
  // S.charts.vol intentionally omitted — volume is overlaid on main chart;
  // creating a chart on a container that immediately gets display:none caused
  // "Value is null" errors from lightweight-charts' internal ResizeObserver.
  S.charts.sub  = LightweightCharts.createChart(g('chartSub'), {
    ...base,
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Magnet,
      vertLine: { ..._vLine, labelVisible: false },  // native time label hidden — custom #xhairTimeLabel used instead
      horzLine: { ..._hLine },  // native dashed horzLine — Y is snapped to indicator value via priceToCoordinate
    },
    timeScale: { visible: false },
    rightPriceScale: { scaleMargins: { top: 0.1, bottom: 0.1 }, borderColor: '#2a2e39' },
    handleScroll: { mouseWheel: true, pressedMouseMove: true },
    handleScale:  false,
  });

  // ── Bidirectional shared-time-axis sync ─────────────────────────────
  // Main → Sub: map main's logical range to sub's logical range via data timeline.
  S.charts.main.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (_chartSyncInProgress || !range) return;
    if (hasSubPanel()) {
      _chartSyncInProgress = true;
      _syncSubChart(range);
      _chartSyncInProgress = false;
    }
    if (range.from < 20 && !S.loadingMore && !S.noMoreData && !S.fitting) loadMore();
  });

  // Sub → Main: only when the user is physically interacting with the sub chart.
  S.charts.sub.timeScale().subscribeVisibleLogicalRangeChange(() => {
    if (_chartSyncInProgress || !_subUserInteracting) return;
    _chartSyncInProgress = true;
    _syncMainFromSub();
    _chartSyncInProgress = false;
  });

  _initSubInteraction();
  initCrosshairSync();
  updatePanelOrder();

  new ResizeObserver(relayout).observe(g('chartArea'));
  // Size charts correctly after creation (important: chartVolume is visible at init)
  relayout();
}

function relayout() {
  const W = g('chartArea').clientWidth, H = g('chartArea').clientHeight;
  const statusH = (g('status').offsetHeight || 18) + 8;  // status bar + breathing room for time labels
  const usableH = H - statusH;
  const subVisible = hasSubPanel() && !g('chartSub').classList.contains('h');
  const subH       = subVisible ? S.panelH.sub : 0;
  const resizerH   = subVisible ? (g('resizerSub').offsetHeight || 5) : 0;

  // Volume is an overlay on main chart — the separate vol panel stays hidden
  g('chartVolume').classList.add('h');
  g('resizerVol').classList.add('h');
  g('chartSub').style.height = subH ? `${subH}px` : '';
  g('resizerSub').classList.toggle('h', !subVisible);

  if (W > 0) {
    try { S.charts.main.resize(W, Math.max(usableH - subH - resizerH, 100)); } catch (_) {}
    if (subH) { try { S.charts.sub.resize(W, subH); } catch (_) {} }
  }
  g('xhairLine').style.height = usableH + 'px';
  updateTimeAxes();
  // Re-sync sub chart after resize/applyOptions (which can trigger deferred
  // fitContent inside LightweightCharts). RAF ensures our sync fires after any
  // such deferred resets.
  if (subH && S.candles.length) {
    const _r = S.charts.main.timeScale().getVisibleLogicalRange();
    if (_r) requestAnimationFrame(() => { _syncSubChart(_r); });
  }
}
function hasSubPanel() { return [...S.activeInds.values()].some(v => v.on && v.displayType === 'sub_panel'); }

function initResizers() {
  // panel: 'vol' | 'sub'
  // dragging the handle UP shrinks the panel, DOWN grows it
  function setupResizer(id, panel, minH, maxH) {
    const el = g(id);
    if (!el) return;
    let startY, startH;

    function onDown(clientY) {
      startY = clientY;
      startH = S.panelH[panel];
      el.classList.add('dragging');
      document.body.style.cursor = 'row-resize';
      document.body.style.userSelect = 'none';
    }
    function onMove(clientY) {
      // drag UP (startY > clientY) → expand panel; drag DOWN → shrink panel
      const delta = startY - clientY;
      S.panelH[panel] = Math.max(minH, Math.min(maxH, startH + delta));
      relayout();
    }
    function onUp() {
      el.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    }

    // Mouse
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      onDown(e.clientY);
      const mv = e2 => onMove(e2.clientY);
      const up = () => { onUp(); document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
      document.addEventListener('mousemove', mv);
      document.addEventListener('mouseup', up);
    });

    // Touch
    el.addEventListener('touchstart', e => {
      e.preventDefault();
      onDown(e.touches[0].clientY);
      const mv = e2 => onMove(e2.touches[0].clientY);
      const up = () => { onUp(); document.removeEventListener('touchmove', mv); document.removeEventListener('touchend', up); };
      document.addEventListener('touchmove', mv, { passive: false });
      document.addEventListener('touchend', up);
    }, { passive: false });
  }

  setupResizer('resizerVol', 'vol', 70, 250);
  setupResizer('resizerSub', 'sub', 90, 500);
}

function _formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()];
  const tfMins = tfMin(S.tf || '1h');
  if (tfMins >= 1440) return `${d.getUTCDate()} ${mon} '${String(d.getUTCFullYear()).slice(2)}`;
  const h = String(d.getUTCHours()).padStart(2,'0');
  const m = String(d.getUTCMinutes()).padStart(2,'0');
  return `${d.getUTCDate()} ${mon} '${String(d.getUTCFullYear()).slice(2)} ${h}:${m}`;
}

// ═══ Panel order (move buttons) ══════════════════════════════════
function updatePanelOrder() {
  const map = {
    vol: { resizer: g('resizerVol'), panel: g('chartVolume') },
    sub: { resizer: g('resizerSub'), panel: g('chartSub') },
  };
  S.panelOrder.forEach((k, i) => {
    map[k].resizer.style.order = i * 2 + 1;
    map[k].panel.style.order   = i * 2 + 2;
  });
  // Update disabled state of move buttons
  S.panelOrder.forEach((k, i) => {
    const upBtn = g(k + 'UpBtn'), dnBtn = g(k + 'DnBtn');
    if (upBtn) upBtn.disabled = (i === 0);
    if (dnBtn) dnBtn.disabled = (i === S.panelOrder.length - 1);
  });
}

function movePanel(key, dir) {
  const idx = S.panelOrder.indexOf(key);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= S.panelOrder.length) return;
  const other = S.panelOrder[newIdx];
  S.panelOrder[idx] = other;
  S.panelOrder[newIdx] = key;
  updatePanelOrder();
  updateTimeAxes();
}

// ═══ Time axes — only bottommost visible panel shows time ruler ══
function updateTimeAxes() {
  const subVis = hasSubPanel() && !g('chartSub').classList.contains('h');
  const tsBase = { timeVisible: true, secondsVisible: false, borderColor: '#2a2e39' };
  try { S.charts.main.applyOptions({ timeScale: { ...tsBase, visible: !subVis } }); } catch (_) {}
  try { S.charts.sub.applyOptions({  timeScale: { ...tsBase, visible: subVis  } }); } catch (_) {}
}

// ═══ Crosshair sync + OHLCV legend ═══════════════════════════════
// Main chart: shown when cursor is on sub panel so candle close value stays on right axis
let _mainXLine = null;
let _mainXLineSeries = null;

function updateMainValueLine(time) {
  _removeMainValueLine();
  if (!time || !S.series.candle || !S.candles.length) return;
  let lo = 0, hi = S.candles.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (S.candles[mid].timestamp <= time) lo = mid; else hi = mid - 1; }
  if (!S.candles[lo]) return;
  try {
    _mainXLine = S.series.candle.createPriceLine({
      price: +S.candles[lo].close,
      color: 'rgba(255,255,255,0.55)',
      lineWidth: 1,
      lineStyle: 2,  // LineStyle.Dashed
      axisLabelVisible: true,
      title: '',
    });
    _mainXLineSeries = S.series.candle;
  } catch (_) {}
}

function _removeMainValueLine() {
  if (_mainXLine && _mainXLineSeries) {
    try { _mainXLineSeries.removePriceLine(_mainXLine); } catch (_) {}
    _mainXLine = null; _mainXLineSeries = null;
  }
}

// Returns the sub-chart Y pixel coordinate for the indicator value at `time`.
// Used to position setCrossHairXY so the native dashed horzLine appears ON the indicator.
function _getSubCrosshairY(time) {
  const subEl = g('chartSub');
  const fallback = subEl ? subEl.clientHeight / 2 : 0;
  for (const entry of S.activeInds.values()) {
    if (!entry.on || entry.displayType !== 'sub_panel' || !entry.series || !entry.data.length) continue;
    const data = entry.data;
    let lo = 0, hi = data.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (data[mid].time <= time) lo = mid; else hi = mid - 1; }
    if (data[lo] && data[lo].time <= time) {
      try {
        const y = entry.series.priceToCoordinate(data[lo].value);
        if (y !== null && y !== undefined) return y;
      } catch (_) {}
    }
    break;
  }
  return fallback;
}

function initCrosshairSync() {
  let _xhairSync = false;
  const allCharts = [S.charts.main, S.charts.sub];
  const xhairLine      = g('xhairLine');
  const xhairTimeLabel = g('xhairTimeLabel');

  function chartEl(c) {
    return c === S.charts.main ? g('chartMain') : g('chartSub');
  }

  allCharts.forEach(chart => {
    chart.subscribeCrosshairMove(param => {
      if (_xhairSync) return;
      _xhairSync = true;

      if (chart === S.charts.main) updateOhlcLegend(param);
      if (chart !== S.charts.main && !param.time) updateOhlcLegend(null);

      const time = param.time;
      const others = allCharts.filter(c => c !== chart);

      if (!time) {
        xhairLine.style.display = 'none';
        xhairTimeLabel.style.display = 'none';
        _removeMainValueLine();
        others.forEach(c => {
          const el = chartEl(c);
          if (!el || el.classList.contains('h')) return;
          try { c.setCrossHairXY(-1, -1, false); } catch (_) {}
        });
      } else if (param.point) {
        xhairLine.style.left    = param.point.x + 'px';
        xhairLine.style.display = 'block';
        // Show custom label whenever sub panel owns the time axis (native sub label is
        // hidden via labelVisible:false, so custom label is the only one in both cases).
        const _subOwnsAxis = hasSubPanel() && !g('chartSub').classList.contains('h');
        if (_subOwnsAxis) {
          xhairTimeLabel.textContent   = _formatTime(time);
          xhairTimeLabel.style.display = 'block';
        } else {
          xhairTimeLabel.style.display = 'none';
        }

        updateMainValueLine(time);

        others.forEach(c => {
          const el = chartEl(c);
          if (!el || el.classList.contains('h')) return;
          // For sub chart: snap crosshair Y to indicator value so native dashed horzLine
          // appears on the indicator line rather than at an arbitrary vertical position.
          const syncY = (c === S.charts.sub) ? _getSubCrosshairY(time) : el.clientHeight / 2;
          try { c.setCrossHairXY(param.point.x, syncY, true); } catch (_) {}
        });
      }

      _xhairSync = false;
    });
  });
}

function updateOhlcLegend(param) {
  const el = g('ohlcLegend');
  if (!el) return;

  if (!param || !param.time || !S.candles.length) {
    if (S.candles.length) {
      const c = S.candles[S.candles.length - 1];
      renderOhlcLegend(+c.open, +c.high, +c.low, +c.close, +c.volume || 0);
    } else {
      el.innerHTML = '';
    }
    return;
  }

  // Binary-search for the candle nearest to param.time
  const ts = param.time;
  let lo = 0, hi = S.candles.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (S.candles[mid].timestamp < ts) lo = mid + 1;
    else hi = mid;
  }
  // lo = first index with timestamp >= ts; compare with lo-1 to pick nearest
  const c1 = S.candles[lo];
  const c0 = lo > 0 ? S.candles[lo - 1] : null;
  const candle = c0 && Math.abs(c0.timestamp - ts) <= Math.abs(c1.timestamp - ts) ? c0 : c1;
  renderOhlcLegend(+candle.open, +candle.high, +candle.low, +candle.close, +candle.volume || 0);
}

function renderOhlcLegend(o, h, l, c, v) {
  const el = g('ohlcLegend');
  if (!el) return;
  const fmt  = n => (+n).toFixed(4);
  const fmtV = n => n >= 1e6 ? (n/1e6).toFixed(2)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : (+n).toFixed(0);
  const col  = c >= o ? 'var(--green)' : 'var(--red)';
  el.innerHTML =
    `<span class="ol-lbl">O</span><span style="color:${col}">${fmt(o)}</span>` +
    `<span class="ol-lbl">H</span><span style="color:${col}">${fmt(h)}</span>` +
    `<span class="ol-lbl">L</span><span style="color:${col}">${fmt(l)}</span>` +
    `<span class="ol-lbl">C</span><span style="color:${col}">${fmt(c)}</span>` +
    `<span class="ol-lbl">V</span><span style="color:var(--text)">${fmtV(v)}</span>`;
}

function smartLimit() {
  const tf = S.tf || val('selTf') || '1m';
  const mins = tfMin(tf);
  if (mins <= 1)  return 2000;
  if (mins <= 5)  return 5000;
  if (mins <= 60) return 10000;
  return 20000;
}

// ═══ Load chart ══════════════════════════════════════════════════════
async function loadChart() {
  S.ex = val('selEx'); S.sym = val('selSym'); S.tf = val('selTf');
  if (!S.ex || !S.sym || !S.tf) return;
  const gen = ++S.chartGen;
  try {
    load(true, `Loading ${S.sym} ${S.tf}…`);

    const lim = smartLimit();
    const cRes = await api(`/api/chart?exchange=${S.ex}&symbol=${S.sym}&timeframe=${S.tf}&limit=${lim}`);
    if (gen !== S.chartGen) return; // superseded by a newer loadChart() call

    // Drop candles with null/zero OHLC — they have valid timestamps in DB but no
    // price data yet (race condition during ingestion). Keeping them in S.candles
    // would stretch indTsParams() and clipToCandles() beyond the visible chart range,
    // causing RSI/indicator desync.
    S.candles    = (cRes.data || [])
      .filter(c => c.timestamp && isFinite(+c.open) && isFinite(+c.high) && isFinite(+c.low) && isFinite(+c.close)
                   && +c.open && +c.high && +c.low && +c.close)
      .sort((a, b) => a.timestamp - b.timestamp);
    S.oldestTs   = S.candles.length ? S.candles[0].timestamp : null;
    S.noMoreData = false;

    // Clear only after data arrives — avoids blank chart during network wait
    clearMainSeries();
    renderCandles();
    renderVolume();
    await refreshActiveIndicators(gen);
    if (gen !== S.chartGen) return; // superseded during indicator fetch

    renderSignals();
    relayout();
    // Guard: prevent fitContent from triggering the lazy-load scroll handler
    S.fitting = true;
    S.charts.main.timeScale().fitContent();
    setTimeout(() => { S.fitting = false; }, 600);

    buildIndDropdown();
    updateStatus();

    // Load signals in background — don't block chart render
    fetchSignals();

    // Start/restart realtime WS for the new exchange/symbol/timeframe
    connectRealtimeWS();
  } catch (e) { showErr(e.message); }
  finally { if (gen === S.chartGen) load(false); }
}

async function fetchSignals() {
  try {
    const res = await api('/api/strategies/signals?limit=20000');
    S.allSignals = res.data?.signals || [];
    renderSignals();
    updateStatus();
  } catch (_) {}
}

// ═══ Lazy load more (scroll left) ════════════════════════════════════
async function loadMore() {
  if (!S.oldestTs || S.loadingMore) return;
  S.loadingMore = true;
  g('loadMoreBar').classList.remove('h');
  g('loadMoreBar').innerHTML = '<div class="spin" style="width:10px;height:10px;margin:0"></div> Loading older candles…';
  try {
    const lim = smartLimit();
    const res = await api(`/api/chart?exchange=${S.ex}&symbol=${S.sym}&timeframe=${S.tf}&limit=${lim}&before_timestamp=${S.oldestTs}`);
    const more = (res.data || [])
      .filter(c => c.timestamp && isFinite(+c.open) && isFinite(+c.high) && isFinite(+c.low) && isFinite(+c.close)
                   && +c.open && +c.high && +c.low && +c.close && c.timestamp < S.oldestTs);
    if (!more.length) { S.noMoreData = true; S.loadingMore = false; g('loadMoreBar').classList.add('h'); return; }

    // Merge, sort ascending, deduplicate — prevents duplicate-timestamp crash in lightweight-charts
    const merged = [...more, ...S.candles].sort((a, b) => a.timestamp - b.timestamp);
    S.candles = merged.filter((c, i) => i === 0 || c.timestamp !== merged[i - 1].timestamp);
    S.oldestTs = S.candles[0].timestamp;

    // Save visible range before setData — prepending data shifts logical indices
    const visRange = S.charts.main.timeScale().getVisibleLogicalRange();
    const offset = more.length;

    const ohlcData = toOhlc(S.candles);
    if (S.series.candle) S.series.candle.setData(ohlcData);
    if (S.series.line)   S.series.line.setData(ohlcData.map(c => ({ time: c.time, value: c.close })));
    if (S.series.vol)    S.series.vol.setData(volData());
    if (ohlcData.length) {
      S.displayedCandleT0 = ohlcData[0].time;
      S.displayedCandleT1 = ohlcData[ohlcData.length - 1].time;
    }
    // Extend anchor left edge to cover newly prepended candles
    _setSubAnchor();
    // Restore shifted viewport so the visible window doesn't jump
    if (visRange) {
      S.charts.main.timeScale().setVisibleLogicalRange({
        from: visRange.from + offset,
        to:   visRange.to  + offset,
      });
    }

    renderSignals();
    updateStatus();
  } catch (_) {}
  finally {
    S.loadingMore = false;
    g('loadMoreBar').classList.add('h');
  }
}

// ═══ Render candles ═══════════════════════════════════════════════════
function renderCandles() {
  rmSeries(S.charts.main, 'candle');
  rmSeries(S.charts.main, 'line');
  if (!S.layers.candles || !S.candles.length) return;

  const data = toOhlc(S.candles);
  S.displayedCandleT0 = data.length ? data[0].time : null;
  S.displayedCandleT1 = data.length ? data[data.length - 1].time : null;
  _subAnchorTs = []; // reset so _setSubAnchor() rebuilds for new candle range
  _setSubAnchor();
  S.series.candle = S.charts.main.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350',
    borderUpColor: '#26a69a', borderDownColor: '#ef5350',
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
  });
  S.series.candle.setData(data);
  // invisible line for markers
  S.series.line = S.charts.main.addLineSeries({ color: 'transparent', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  S.series.line.setData(data.map(c => ({ time: c.time, value: c.close })));
  updatePrice();
  updateOhlcLegend(null); // show last candle OHLCV in legend
}

// ═══ Render volume ════════════════════════════════════════════════════
function volData() {
  return S.candles
    .filter(c => c.timestamp)
    .map(c => ({
      time: c.timestamp, value: +c.volume || 0,
      color: +c.close >= +c.open ? 'rgba(38,166,154,.45)' : 'rgba(239,83,80,.45)',
    }));
}
function renderVolume() {
  if (!S.layers.volume) {
    rmSeries(S.charts.main, 'vol');
    return;
  }
  if (!S.candles.length) return;
  if (S.series.vol) {
    S.series.vol.setData(volData());
  } else {
    S.series.vol = S.charts.main.addHistogramSeries({
      priceScaleId: '',
      priceFormat: { type: 'volume' },
      scaleMargins: { top: 0.85, bottom: 0 },
      lastValueVisible: false,
      priceLineVisible: false,
    });
    S.series.vol.setData(volData());
  }
}

// ═══ Render signals ════════════════════════════════════════════════════
function renderSignals() {
  const target = S.series.candle || S.series.line;
  if (target) target.setMarkers([]);
  if (!S.layers.signals || !S.allSignals.length || !target) return;

  // Only show signals at timestamps that exactly exist in the loaded candles.
  // This prevents stacking markers outside the visible candle range.
  const candleTs = new Set(S.candles.map(c => c.timestamp));

  const markers = S.allSignals
    .filter(s => s.exchange === S.ex && s.symbol === S.sym && candleTs.has(s.timestamp))
    .map(s => {
      const buy = s.signal_type?.toLowerCase() === 'buy';
      const label = s.strategy_name.replace(/_strategy.*/, '').replace(/_multi_timeframe/, '');
      const conf  = s.confidence != null ? ` ${(s.confidence * 100 | 0)}%` : '';
      return {
        time: s.timestamp,
        position: buy ? 'belowBar' : 'aboveBar',
        color: buy ? '#26a69a' : '#ef5350',
        shape: buy ? 'arrowUp' : 'arrowDown',
        text: label + conf,
        size: 1,
      };
    })
    .sort((a, b) => a.time - b.time);

  target.setMarkers(markers);
}

function renderLibraryList(q) {
  const match = item => !q || item.name.toLowerCase().includes(q)
                             || (item.display || '').toLowerCase().includes(q);

  // Build grouped list: active (on chart) first, then by category
  const categories = {};
  const addToGroup = (item, badge) => {
    const cat = item.category || 'Other';
    (categories[cat] = categories[cat] || []).push({ ...item, badge });
  };

  // Stored/active indicators on top
  if (!q) {
    S.activeInds.forEach((_, key) => {
      const meta = S.indMeta.get(key);
      if (meta) addToGroup({ name: key, display: meta.display_name || key, category: 'On Chart' }, '✓');
    });
  }

  [...L.user, ...L.primitives].filter(match).forEach(i => addToGroup(i, ''));
  L.pandas_ta.filter(match).forEach(i => addToGroup(i, ''));

  let html = '';
  if (Object.keys(categories).length === 0 && q) {
    html = '<div style="padding:14px;color:var(--dim);font-size:12px">No results</div>';
  } else {
    const ORDER = ['On Chart', 'My Indicators', 'Custom Primitives',
                   'Trend', 'Oscillators', 'Momentum', 'Volatility', 'Volume',
                   'Statistics', 'Overlap', 'Performance', 'Candle'];
    // Put "Other" always last
    const allCats = [...new Set([...ORDER, ...Object.keys(categories)])].filter(c => categories[c]);
    const sorted = [...allCats.filter(c => c !== 'Other'), ...allCats.filter(c => c === 'Other')];
    sorted.forEach(cat => {
      html += `<div class="ind-cat-label">${cat}</div>`;
      html += categories[cat].map(item => {
        const sel = L_sel && L_sel.name === item.name ? ' sel' : '';
        return `<div class="ind-lib-item${sel}" onclick='selectLibItem(${JSON.stringify(JSON.stringify(item))})'>
          <span>${item.display || item.name.toUpperCase()}</span>
          <span class="ind-lib-item-badge">${item.badge || ''}</span>
        </div>`;
      }).join('');
    });
    html += `<div style="padding:4px 0"><button class="ind-new-btn" onclick="openEditorModal()">+ Write custom indicator</button></div>`;
  }
  g('indLibList').innerHTML = html;
}

async function applyIndicator() {
  if (!L_sel) return;
  const btn  = g('btnApplyInd');
  const prog = g('indProgress');
  const msg  = g('indProgressMsg');

  btn.disabled = true;
  prog.classList.add('on');

  // Snapshot chart gen — if chart reloads during async compute we must abort
  const gen = S.chartGen;

  // Collect params
  const body = {
    type:      L_sel.name,
    timeframe: g('ip_timeframe')?.value || S.tf,
    exchange:  S.ex,
    symbol:    S.sym,
  };
  (L_sel.params || []).forEach(p => {
    const el = g(`ip_${p.key}`);
    if (el) body[p.key] = p.type === 'int' ? parseInt(el.value) : el.value;
  });
  const displayType = g('ip_display')?.value || 'overlay';

  // Pass visible candle range → server returns only what's needed for display.
  // Resolver still computes and caches the full history; this only limits the
  // rows returned in the SSE "done" payload (avoids 300MB+ responses).
  if (S.candles.length) {
    body.start_ts = S.candles[0].timestamp;
    body.end_ts   = S.candles[S.candles.length - 1].timestamp;
  }

  const indKey = `${body.type}_${body.period || ''}_${body.timeframe}`;

  try {
    await streamCompute('/api/indicators/compute', body, ev => {
      if (ev.stage === 'aggregating') msg.textContent = `Aggregating ${ev.timeframe}…`;
      else if (ev.stage === 'loading')  msg.textContent = ev.message || 'Loading candles…';
      else if (ev.stage === 'computing') msg.textContent = ev.message || 'Computing…';
      else if (ev.stage === 'storing')  msg.textContent = ev.message || 'Storing…';
      else if (ev.stage === 'error') { showErr(ev.message || 'Compute error'); closeIndModal(); }
      else if (ev.stage === 'done') {
        if (gen !== S.chartGen) { closeIndModal(); return; } // chart was reloaded during compute
        // Sort, deduplicate and sanitise before handing to lightweight-charts
        const raw = (ev.data || [])
          .map(p => ({ time: p.timestamp, value: parseFloat(p.value) }))
          .filter(p => p.time && isFinite(p.value))
          .sort((a, b) => a.time - b.time);
        const seen = new Set();
        const pts = raw.filter(p => { if (seen.has(p.time)) return false; seen.add(p.time); return true; });
        addIndToChart(indKey, pts, { ...body, display_type: displayType });
        closeIndModal();
      }
    });
  } catch (e) {
    showErr(`Failed: ${e.message}`);
  } finally {
    btn.disabled = false;
    prog.classList.remove('on');
  }
}

async function streamCompute(url, body, onEvent) {
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split('\n\n');
    buf = parts.pop();
    for (const part of parts) {
      const line = part.replace(/^data:\s*/, '').trim();
      if (line) { try { onEvent(JSON.parse(line)); } catch (_) {} }
    }
  }
}

function addIndToChart(key, pts, meta) {
  const existing = S.activeInds.get(key);
  if (existing) removeIndSeries(key, existing);

  if (!S.indColorMap.has(key))
    S.indColorMap.set(key, S.emaColors[S.emaColorIdx++ % S.emaColors.length]);

  // Determine display type and whether to use the left Y-axis.
  // • No explicit choice: auto-detect → sub_panel when values differ from price.
  // • Explicit overlay + values differ from price → left Y-axis (TradingView pattern):
  //   indicator stays on main chart but gets its own scale, candles keep right axis.
  // • Explicit overlay + values in price range → right Y-axis (shared with candles).
  let displayType = meta.display_type || 'overlay';
  let useLeftScale = false;

  if (displayType === 'overlay' && pts.length > 0 && S.candles.length > 0) {
    const lastPrice = +S.candles[S.candles.length - 1].close;
    const sample = pts.slice(-50).map(p => p.value);
    const avg = sample.reduce((a, b) => a + b, 0) / sample.length;
    const scalesDiffer = avg < lastPrice * 0.05 || avg > lastPrice * 3;
    if (scalesDiffer) {
      if (meta.explicit_display) {
        useLeftScale = true;   // user insisted on overlay → left axis
      } else {
        displayType = 'sub_panel';  // auto-detect → move to sub panel
      }
    }
  }

  const entry = { on: true, series: null, subRefLines: [], data: pts, displayType, useLeftScale,
                   meta: { name: key, exchange: meta.exchange, symbol: meta.symbol,
                           tf: meta.timeframe } };
  S.activeInds.set(key, entry);
  S.indMeta = S.indMeta || new Map();
  S.indMeta.set(key, { display_name: `${meta.type?.toUpperCase()} (${meta.period || ''}, ${meta.timeframe?.toUpperCase()})` });

  buildIndChips();
  try { renderIndSeries(key, entry); } catch (e) { console.warn('renderIndSeries error:', e.message); }
  updateSubPanel();
  relayout();
}

// Keep existing toggleInd for backwards compat with stored indicators
async function toggleInd(name) {
  if (S.activeInds.has(name)) {
    const entry = S.activeInds.get(name);
    removeIndSeries(name, entry);
    S.activeInds.delete(name);
    S.indColorMap.delete(name);
    buildIndChips();
    updateSubPanel();
    relayout();
    return;
  }
  const meta = S.allInds.find(i => i.name === name);
  if (!meta) return;
  if (!S.indColorMap.has(name))
    S.indColorMap.set(name, S.emaColors[S.emaColorIdx++ % S.emaColors.length]);
  S.activeInds.set(name, { on: true, series: null, subRefLines: [], data: [], meta });
  buildIndChips();
  try {
    const tsParams = indTsParams();
    const r = await api(`/api/indicators?indicator_name=${name}&exchange=${meta.exchange}&symbol=${meta.symbol}&timeframe=${meta.tf}${tsParams}`);
    const pts = (r.data?.indicators || [])
      .map(p => ({ time: p.timestamp, value: parseFloat(p.value) }))
      .filter(p => p.value > 0).sort((a, b) => a.time - b.time);
    const entry = S.activeInds.get(name);
    if (!entry) return;
    entry.data = pts;
    renderIndSeries(name, entry);
    updateSubPanel();
    relayout();
  } catch (e) { showErr(`Failed to load ${name}: ${e.message}`); }
}

function renderIndSeries(name, entry) {
  if (!entry.on || !entry.data.length) return;
  const isSubPanel = (entry.displayType || 'overlay') === 'sub_panel';
  const col = S.indColorMap.get(name) || '#f6c90e';

  // Clip data to currently loaded candle range to prevent viewport jumps
  const data = clipToCandles(entry.data);
  if (!data.length) return;

  // Save logical range before setData (S.fitting=true blocks loadMore so indices won't shift)
  const mainRange = S.charts.main.timeScale().getVisibleLogicalRange();

  // Block loadMore from firing during setData — scroll events during setData
  // can prepend candles and shift logical indices, corrupting the restore below
  const prevFitting = S.fitting;
  S.fitting = true;

  if (isSubPanel) {
    // pre-size before removing .h to prevent layout jump
    g('chartSub').style.height = `${S.panelH.sub}px`;
    g('chartSub').classList.remove('h');
    // Sub chart was created while hidden (0×0). Resize it to real dimensions
    // before adding series — lightweight-charts v3.8 throws "Value is null"
    // when addLineSeries is called on a chart that has never been sized.
    const subW = g('chartArea').clientWidth || window.innerWidth;
    try { S.charts.sub.resize(subW, S.panelH.sub); } catch (_) {}
    // Create the transparent anchor series once the chart has real dimensions.
    // The anchor spans the full candle range so the time axis can resolve
    // timestamps for any pixel x (including before the first indicator point).
    if (!S.series.subAnchor) {
      try {
        S.series.subAnchor = S.charts.sub.addHistogramSeries({
          color: 'transparent', priceScaleId: '',
          priceFormat: { type: 'volume' }, lastValueVisible: false, priceLineVisible: false,
        });
        _setSubAnchor();
      } catch (_) {}
    }
    let s;
    try {
      s = S.charts.sub.addLineSeries({
        color: col, lineWidth: 1, priceLineVisible: false, lastValueVisible: true, title: name,
      });
    } catch (e) {
      console.warn('renderIndSeries sub-panel addLineSeries error:', e.message);
      S.fitting = prevFitting;
      return;
    }
    try {
      s.setData(data);
    } catch (e) {
      console.warn('renderIndSeries sub-panel setData error:', e.message);
      S.fitting = prevFitting;
      try { S.charts.sub.removeSeries(s); } catch (_) {}
      return;
    }
    entry.series = s;
    if (mainRange) {
      // Restore main chart viewport (setData on indicator may shift logical indices).
      try { S.charts.main.timeScale().setVisibleLogicalRange(mainRange); } catch (_) {}
      // relayout() called by addIndToChart applies correct sub viewport via RAF.
    }
    // reference lines only for true 0-100 bounded oscillators (RSI, Stoch, etc.)
    // min >= 0 and max in [50, 105] indicates a 0-100 range oscillator
    const sample20 = data.slice(-20).map(p => p.value);
    const maxVal = Math.max(...sample20);
    const minVal = Math.min(...sample20);
    if (minVal >= 0 && maxVal >= 50 && maxVal <= 105 && data.length > 1) {
      const addRef = (v, c) => {
        let rs;
        try { rs = S.charts.sub.addLineSeries({ color: c, lineWidth: 1, lineStyle: 2,
                                                 priceLineVisible: false, lastValueVisible: false }); }
        catch (_) { return; }
        const t0 = data[0].time, t1 = data[data.length-1].time;
        try { rs.setData([{ time: t0, value: v }, { time: t1, value: v }]); } catch (_) { try { S.charts.sub.removeSeries(rs); } catch (_2) {} return; }
        entry.subRefLines.push(rs);
      };
      addRef(70, 'rgba(239,83,80,.3)');
      addRef(30, 'rgba(38,166,154,.3)');
    }
  } else {
    // Overlay: use left Y-axis when indicator values are in different units from price.
    // This keeps candles on the right axis (undistorted) while the indicator still
    // appears visually overlaid on the same chart pane.
    const scaleId = entry.useLeftScale ? 'left' : 'right';
    let s;
    try {
      s = S.charts.main.addLineSeries({
        color: col, lineWidth: 1, priceLineVisible: false, lastValueVisible: true, title: name,
        priceScaleId: scaleId,
      });
    } catch (e) {
      console.warn('renderIndSeries overlay addLineSeries error:', e.message);
      S.fitting = prevFitting;
      return;
    }
    if (entry.useLeftScale) {
      try {
        S.charts.main.priceScale('left').applyOptions({
          visible: true,
          borderColor: '#2a2e39',
          scaleMargins: { top: 0.1, bottom: 0.1 },
        });
      } catch (_) {}
    }
    try {
      s.setData(data);
    } catch (e) {
      console.warn('renderIndSeries overlay setData error:', e.message);
      S.fitting = prevFitting;
      try { S.charts.main.removeSeries(s); } catch (_) {}
      return;
    }
    entry.series = s;
    // Restore viewport via timestamps — logical indices may have shifted if loadMore
    // ran between the save and restore, but timestamps are always stable
    if (mainRange) {
      try { S.charts.main.timeScale().setVisibleLogicalRange(mainRange); } catch (_) {}
    }
  }

  S.fitting = prevFitting;
}

function clipToCandles(data) {
  if (!data.length) return data;
  const t0 = S.displayedCandleT0 ?? (S.candles.length ? S.candles[0].timestamp : null);
  const t1 = S.displayedCandleT1 ?? (S.candles.length ? S.candles[S.candles.length - 1].timestamp : null);
  if (!t0 || !t1) return data;
  return data.filter(p => p.time >= t0 && p.time <= t1);
}

function removeIndSeries(name, entry) {
  const isSubPanel = (entry.displayType || 'overlay') === 'sub_panel';
  const chart = isSubPanel ? S.charts.sub : S.charts.main;
  if (entry.series) { try { chart.removeSeries(entry.series); } catch (_) {} }
  entry.subRefLines.forEach(rs => { try { S.charts.sub.removeSeries(rs); } catch (_) {} });
  entry.series = null; entry.subRefLines = [];
  // Hide left price scale if no other overlay indicators still use it
  if (entry.useLeftScale) {
    const anyLeft = [...S.activeInds.values()].some(
      e => e !== entry && e.on && e.useLeftScale && e.series
    );
    if (!anyLeft) {
      try { S.charts.main.priceScale('left').applyOptions({ visible: false }); } catch (_) {}
    }
  }
}

function updateSubPanel() {
  const anySubPanel = [...S.activeInds.values()].some(v => v.on && v.displayType === 'sub_panel' && v.series);
  g('chartSub').classList.toggle('h', !anySubPanel);
}

function indTsParams() {
  const st = S.displayedCandleT0 ?? (S.candles.length ? S.candles[0].timestamp : null);
  const et = S.displayedCandleT1 ?? (S.candles.length ? S.candles[S.candles.length - 1].timestamp : null);
  if (!st || !et) return '';
  return `&start_ts=${st}&end_ts=${et}`;
}

async function refreshActiveIndicators(gen) {
  // Re-fetch data for all active indicators when chart params change
  const tsParams = indTsParams();
  await Promise.all([...S.activeInds.entries()].map(async ([name, entry]) => {
    removeIndSeries(name, entry);
    entry.series = null; entry.subRefLines = []; entry.data = [];
    try {
      const r = await api(`/api/indicators?indicator_name=${name}&exchange=${entry.meta.exchange}&symbol=${entry.meta.symbol}&timeframe=${entry.meta.tf}${tsParams}`);
      if (gen !== undefined && gen !== S.chartGen) return; // superseded
      entry.data = (r.data?.indicators || [])
        .map(p => ({ time: p.timestamp, value: parseFloat(p.value) }))
        .filter(p => p.value > 0)
        .sort((a, b) => a.time - b.time);
      if (entry.on) renderIndSeries(name, entry);
    } catch (_) {}
  }));
  updateSubPanel();
}

// ═══ Chips ════════════════════════════════════════════════════════════
function buildIndChips() {
  document.querySelectorAll('.chip').forEach(el => el.remove());
  const area = g('indArea');
  [...S.activeInds.entries()].forEach(([name, entry]) => {
    const col = S.indColorMap.get(name) || '#f6c90e';
    const chip = document.createElement('div');
    chip.className = 'chip' + (entry.on ? '' : ' off');
    chip.innerHTML = `<span style="width:8px;height:8px;border-radius:50%;background:${col};flex-shrink:0;display:inline-block"></span>`
      + `<span>${name}</span>`
      + `<span class="chip-x" onclick="removeInd(event,'${name}')">×</span>`;
    chip.addEventListener('click', (e) => { if (!e.target.classList.contains('chip-x')) flipInd(name); });
    area.insertBefore(chip, area.querySelector('.add-ind-btn'));
  });
}

function flipInd(name) {
  const entry = S.activeInds.get(name);
  if (!entry) return;
  entry.on = !entry.on;
  const chart = entry.displayType === 'sub_panel' ? S.charts.sub : S.charts.main;
  if (!entry.on) {
    if (entry.series) { try { chart.removeSeries(entry.series); } catch (_) {} entry.series = null; }
    entry.subRefLines.forEach(rs => { try { S.charts.sub.removeSeries(rs); } catch (_) {} });
    entry.subRefLines = [];
  } else {
    renderIndSeries(name, entry);
  }
  buildIndChips();
  updateSubPanel();
  relayout();
}

function buildIndDropdown() { /* modal-based UI — no legacy dropdown needed */ }

function removeInd(e, name) {
  e.stopPropagation();
  const entry = S.activeInds.get(name);
  if (entry) removeIndSeries(name, entry);
  S.activeInds.delete(name);
  S.indColorMap.delete(name);
  buildIndChips();
  buildIndDropdown();
  updateSubPanel();
  relayout();
}

function rmSeries(chart, key) {

function toOhlc(candles) {
  const seen = new Set();
  return candles
    .map(c => ({ time: c.timestamp, open: +c.open, high: +c.high, low: +c.low, close: +c.close }))
    .filter(c => c.time && isFinite(c.open) && isFinite(c.high) && isFinite(c.low) && isFinite(c.close)
                 && c.open && c.high && c.low && c.close)
    .sort((a, b) => a.time - b.time)
    .filter(c => { if (seen.has(c.time)) return false; seen.add(c.time); return true; });
}

function updatePrice() {
  if (!S.candles.length) return;
  const last  = S.candles[S.candles.length - 1];
  const first = S.candles[0];
  const close = +last.close, open = +first.open;
  const pct = ((close - open) / open * 100).toFixed(2);
  const up = close >= open;
  g('priceVal').textContent = close.toFixed(4);
  g('priceVal').className   = 'price-val ' + (up ? 'up' : 'dn');
  g('priceChg').textContent  = (up ? '+' : '') + pct + '%';
  g('priceChg').className    = 'price-chg ' + (up ? 'up' : 'dn');
}

function updateStatus() {
  const sigs = S.allSignals.filter(s => s.exchange === S.ex && s.symbol === S.sym).length;
  g('status').textContent = `${S.candles.length.toLocaleString()} candles  •  ${sigs} signals  •  ${S.ex} ${S.sym} ${S.tf}`;
}

let stratPanelOpen = false;

function toggleStratPanel() {
  stratPanelOpen = !stratPanelOpen;
  g('stratPanel').classList.toggle('open', stratPanelOpen);
  g('btnStrat').classList.toggle('on', stratPanelOpen);
  if (stratPanelOpen && !stratStatusCache) loadStratStatus();

async function loadStratStatus() {
  try {
    const res = await api('/api/strategies/status');
    stratStatusCache = res;
    showStratList();
  } catch (e) {
    g('spBody').innerHTML = `<div style="padding:14px;color:var(--red);font-size:12px">${e.message}</div>`;
  }
}

function showStratList() {
  g('spTitle').textContent = 'Strategies';
  g('spBack').style.display = 'none';

  if (!stratStatusCache) return;
  const rows = Object.entries(stratStatusCache).map(([name, info]) => {
    const latest = info.latest_signal;
    const latestStr = latest
      ? `${latest.signal_type?.toUpperCase()} @ ${latest.price?.toFixed(2) ?? '—'}`
      : '—';
    const ts = latest?.timestamp ? new Date(latest.timestamp * 1000).toLocaleDateString('en-GB', { day:'2-digit', month:'short' }) : '';
    return `<div class="strat-row" onclick="showStratSignals('${name}')">
      <div class="strat-name">${name}</div>
      <div class="strat-meta">
        <span class="strat-sig-count">${info.total_signals} signals</span>
        <span class="strat-last-sig">${ts ? ts + ' · ' : ''}${latestStr}</span>
      </div>
    </div>`;
  }).join('');

  g('spBody').innerHTML = rows || '<div style="padding:14px;color:var(--dim);font-size:12px">No strategies found</div>';
}

function showStratSignals(stratName) {
  g('spTitle').textContent = stratName.replace(/_strategy.*/, '');
  g('spBack').style.display = 'block';

  const sigs = S.allSignals
    .filter(s => s.strategy_name === stratName)
    .sort((a, b) => b.timestamp - a.timestamp);

  if (!sigs.length) {
    g('spBody').innerHTML = '<div style="padding:14px;color:var(--dim);font-size:12px">No signals loaded. Try increasing limit or check symbol filter.</div>';
    return;
  }

  const rows = sigs.map(s => {
    const buy = s.signal_type?.toLowerCase() === 'buy';
    const dt = new Date(s.timestamp * 1000);
    const dateStr = dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'2-digit' });
    const timeStr = dt.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    return `<tr>
      <td>${dateStr} ${timeStr}</td>
      <td class="${buy ? 'sig-buy' : 'sig-sell'}">${s.signal_type?.toUpperCase()}</td>
      <td>${s.price?.toFixed(2) ?? '—'}</td>
      <td>${s.confidence != null ? (s.confidence * 100 | 0) + '%' : '—'}</td>
      <td style="color:var(--dim)">${s.symbol}</td>
    </tr>`;
  }).join('');

  g('spBody').innerHTML = `<table class="sig-table">
    <thead><tr><th>Date</th><th>Type</th><th>Price</th><th>Conf</th><th>Symbol</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}
