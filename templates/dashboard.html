<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Dashboard</title>
<script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #131722; --surface: #1e222d; --border: #2a2e39; --muted: #434651;
    --text: #d1d4dc; --dim: #787b86; --accent: #2962ff; --green: #26a69a; --red: #ef5350;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; overflow: hidden; }
  .layout { display: grid; grid-template-rows: 44px 1fr; height: 100vh; }

  /* ── Topbar ── */
  .topbar {
    display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    overflow: hidden; min-width: 0;
  }
  .topbar-title { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

  select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 3px 6px; border-radius: 4px; font-size: 12px; cursor: pointer; outline: none;
  }
  select:hover { border-color: var(--muted); }

  /* layer toggles */
  .toggles { display: flex; gap: 4px; }
  .tog {
    padding: 3px 9px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--bg); color: var(--dim); font-size: 12px;
    cursor: pointer; user-select: none; white-space: nowrap;
    transition: background .12s, color .12s, border-color .12s;
  }
  .tog.on          { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tog.on.g        { background: var(--green);  border-color: var(--green); }

  /* indicator chips area */
  .ind-area { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; overflow: hidden; min-width: 0; position: relative; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 10px; font-size: 11px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    cursor: pointer; white-space: nowrap; user-select: none;
    transition: opacity .12s;
  }
  .chip.off { opacity: 0.4; }
  .chip-x { color: var(--dim); font-size: 13px; line-height: 1; margin-left: 2px; }
  .chip-x:hover { color: var(--red); }

  /* add indicator button */
  .add-ind-btn {
    padding: 3px 9px; border-radius: 4px; border: 1px dashed var(--muted);
    background: transparent; color: var(--dim); font-size: 12px;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: color .12s, border-color .12s;
  }
  .add-ind-btn:hover { color: var(--text); border-color: var(--text); }

  /* indicator dropdown — fixed so overflow:hidden on topbar doesn't clip it */
  .ind-dropdown {
    position: fixed; top: 44px; left: 0; min-width: 280px; max-height: 320px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    overflow-y: auto; z-index: 200; box-shadow: 0 4px 20px rgba(0,0,0,.5);
    display: none;
  }
  .ind-dropdown.open { display: block; }
  .ind-group { padding: 6px 0; border-bottom: 1px solid var(--border); }
  .ind-group:last-child { border-bottom: none; }
  .ind-group-label { padding: 4px 12px; font-size: 10px; color: var(--dim); letter-spacing: .5px; text-transform: uppercase; }
  .ind-item {
    padding: 6px 12px; cursor: pointer; display: flex; justify-content: space-between;
    align-items: center; font-size: 12px;
  }
  .ind-item:hover { background: var(--border); }
  .ind-item.active { color: var(--accent); }
  .ind-item-count { font-size: 11px; color: var(--dim); }

  /* price */
  .price-area { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .price-val { font-size: 15px; font-weight: 700; }
  .price-chg { font-size: 11px; }
  .up { color: var(--green); } .dn { color: var(--red); }

  .nav-btn {
    padding: 3px 9px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--bg); color: var(--dim); font-size: 12px;
    text-decoration: none; white-space: nowrap; flex-shrink: 0;
    transition: color .12s, border-color .12s;
  }
  .nav-btn:hover { color: var(--text); border-color: var(--muted); }

  /* ── Chart area ── */
  .chart-area { display: flex; flex-direction: column; overflow: hidden; position: relative; }
  #chartMain   { width: 100%; flex: 1 1 auto; min-height: 0; }
  #chartVolume { width: 100%; flex: 0 0 80px; border-top: 1px solid var(--border); }
  #chartRsi    { width: 100%; flex: 0 0 110px; border-top: 1px solid var(--border); }
  #chartVolume.h, #chartRsi.h { display: none; }

  /* status bar */
  #status {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
    background: rgba(19,23,34,.8); border-top: 1px solid var(--border);
    padding: 2px 12px; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden;
  }

  /* loading */
  #loader {
    position: absolute; inset: 0; background: rgba(19,23,34,.7);
    display: flex; align-items: center; justify-content: center; z-index: 10; font-size: 13px; color: var(--dim);
  }
  #loader.h { display: none; }
  .spin {
    width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; margin-right: 10px; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* error */
  #errBanner {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    background: #7f0000; color: #fff; padding: 5px 14px; border-radius: 4px;
    font-size: 12px; z-index: 20; display: none;
  }

  /* scrollbar */
  .ind-dropdown::-webkit-scrollbar { width: 4px; }
  .ind-dropdown::-webkit-scrollbar-track { background: var(--surface); }
  .ind-dropdown::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

  /* ── Strategy panel ── */
  #stratPanel {
    position: fixed; top: 44px; right: 0; bottom: 0; width: 360px;
    background: var(--surface); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 50;
    transform: translateX(100%); transition: transform .2s ease;
  }
  #stratPanel.open { transform: translateX(0); }
  .sp-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .sp-title { font-size: 13px; font-weight: 600; }
  .sp-close {
    background: none; border: none; color: var(--dim); font-size: 18px;
    cursor: pointer; padding: 0 4px; line-height: 1;
  }
  .sp-close:hover { color: var(--text); }
  .sp-body { flex: 1; overflow-y: auto; padding: 8px 0; }
  .sp-body::-webkit-scrollbar { width: 4px; }
  .sp-body::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }
  .strat-row {
    padding: 8px 14px; cursor: pointer; border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  .strat-row:hover { background: var(--border); }
  .strat-row.active { background: rgba(41,98,255,.15); }
  .strat-name { font-size: 12px; font-weight: 600; margin-bottom: 3px; }
  .strat-meta { font-size: 11px; color: var(--dim); display: flex; gap: 10px; }
  .strat-sig-count { color: var(--accent); }
  .strat-last-sig { }
  /* signal detail table */
  .sig-detail { display: none; padding: 0; }
  .sig-detail.open { display: block; }
  .sig-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .sig-table th {
    padding: 5px 10px; text-align: left; color: var(--dim);
    border-bottom: 1px solid var(--border); font-weight: 400; position: sticky; top: 0;
    background: var(--surface);
  }
  .sig-table td { padding: 4px 10px; border-bottom: 1px solid rgba(42,46,57,.5); }
  .sig-buy  { color: var(--green); }
  .sig-sell { color: var(--red); }
  .sp-back {
    display: none; padding: 8px 14px; font-size: 12px; color: var(--accent);
    cursor: pointer; border-bottom: 1px solid var(--border);
  }
  .sp-back:hover { background: var(--border); }
</style>
</head>
<body>
<div class="layout">

  <!-- Topbar -->
  <div class="topbar" id="topbar">
    <span class="topbar-title">Trading</span>
    <div class="sep"></div>

    <select id="selEx"  onchange="onExChange()"></select>
    <select id="selSym" onchange="onSymChange()"></select>
    <select id="selTf"  onchange="loadChart()"></select>

    <div class="sep"></div>

    <div class="toggles">
      <button class="tog on"  id="btnC" onclick="tog('candles')">Candles</button>
      <button class="tog on g" id="btnV" onclick="tog('volume')">Volume</button>
      <button class="tog on g" id="btnS" onclick="tog('signals')">Signals</button>
    </div>

    <div class="sep"></div>

    <!-- Indicator area -->
    <div class="ind-area" id="indArea">
      <button class="add-ind-btn" onclick="toggleIndMenu(event)">+ Indicator</button>
      <div class="ind-dropdown" id="indDropdown"></div>
    </div>

    <div class="price-area">
      <span id="priceVal" class="price-val">—</span>
      <span id="priceChg" class="price-chg">—</span>
    </div>
    <a href="/progress" class="nav-btn">Progress</a>
    <button class="nav-btn" id="btnStrat" onclick="toggleStratPanel()">Strategies</button>
  </div>

  <!-- Strategy panel -->
  <div id="stratPanel">
    <div class="sp-header">
      <span class="sp-title" id="spTitle">Strategies</span>
      <button class="sp-close" onclick="toggleStratPanel()">×</button>
    </div>
    <div class="sp-back" id="spBack" onclick="showStratList()">← Back</div>
    <div class="sp-body" id="spBody">
      <div style="padding:20px;text-align:center;color:var(--dim);font-size:12px">Loading…</div>
    </div>
  </div>

  <!-- Charts -->
  <div class="chart-area" id="chartArea">
    <div id="chartMain"></div>
    <div id="chartVolume"></div>
    <div id="chartRsi"    class="h"></div>

    <div id="loader"><div class="spin"></div><span id="loaderMsg">Loading…</span></div>
    <div id="errBanner"></div>
    <div id="status"></div>
  </div>
</div>

<script>
// ═══ State ═══════════════════════════════════════════════════════════
const S = {
  ex: '', sym: '', tf: '',
  layers: { candles: true, volume: true, signals: true },
  sources: [],
  candles: [],          // loaded OHLCV array
  allSignals: [],       // all signals (unfiltered)
  allInds: [],          // available indicators from /status (objects with name, exchange, symbol, timeframe, count)
  activeInds: new Map(),// name -> { on: bool, series: Series|null, rsiRefLines: [], data: [] }

  charts: { main: null, vol: null, rsi: null },
  series: { candle: null, line: null, vol: null, rsiMap: new Map() },
  emaColors: ['#f6c90e','#a29bfe','#74b9ff','#fd79a8','#81ecec','#55efc4','#fdcb6e'],
  emaColorIdx: 0,
  indColorMap: new Map(), // name -> color (stable across re-renders)

  loadingMore: false,
  fitting: false,       // true while fitContent() is running — blocks lazy load
  oldestTs: null,
  chartGen: 0,          // incremented on each loadChart() to cancel stale continuations
};

// ═══ Boot ════════════════════════════════════════════════════════════
async function boot() {
  try {
    load(true, 'Loading sources…');
    const [srcRes, indRes] = await Promise.all([
      api('/api/data/sources'),
      api('/api/indicators/status'),
    ]);
    S.sources = srcRes.sources || [];
    S.allInds = (indRes.indicators || []).map(i => {
      const parts = i.connection.split('_'); // e.g. "whitebit_SOL_USDT_5m"
      // connection format: exchange_SYMBOL_tf (symbol may have underscore)
      return { name: i.name, connection: i.connection, count: i.count, ...parseConnection(i.connection) };
    });
    buildSelects();
    initCharts();
    await loadChart();
  } catch (e) { showErr(e.message); }
  finally { load(false); }
}

function parseConnection(conn) {
  // Format: "whitebit_SOL_USDT_5m" → { exchange: 'whitebit', symbol: 'SOL_USDT', tf: '5m' }
  // First token = exchange (no underscore), last token = timeframe, middle = symbol
  const parts = conn.split('_');
  const tfPatterns = /^\d+[mhdw]$/;
  const tf = parts[parts.length - 1];
  const ex = parts[0];
  const sym = parts.slice(1, parts.length - 1).join('_');
  return { exchange: ex, symbol: sym, tf };
}

// ═══ Selects ═════════════════════════════════════════════════════════
function buildSelects() {
  const exs = [...new Set(S.sources.map(s => s.exchange))].sort();
  fill('selEx', exs); S.ex = exs[0] || '';
  buildSymbols();
}
function buildSymbols() {
  S.ex = val('selEx');
  const syms = [...new Set(S.sources.filter(s => s.exchange === S.ex).map(s => s.symbol))].sort();
  fill('selSym', syms); S.sym = syms[0] || '';
  buildTfs();
}
function buildTfs() {
  S.sym = val('selSym');
  const tfs = [...new Set(S.sources.filter(s => s.exchange === S.ex && s.symbol === S.sym).map(s => s.timeframe))]
    .sort((a, b) => tfMin(a) - tfMin(b));
  fill('selTf', tfs); S.tf = tfs[0] || '';
}
function onExChange() { buildSymbols(); loadChart(); }
function onSymChange() { buildTfs(); loadChart(); }

function fill(id, vals) {
  const el = g(id), prev = el.value;
  el.innerHTML = vals.map(v => `<option value="${v}">${v}</option>`).join('');
  if (vals.includes(prev)) el.value = prev;
}
function tfMin(tf) { return ({1:1,3:3,5:5,15:15,30:30,'1h':60,'2h':120,'4h':240,'6h':360,'12h':720,'1d':1440,'1w':10080})[tf.replace('m','').replace('h','h').replace('d','d').replace('w','w')] || ({ '1m':1,'3m':3,'5m':5,'15m':15,'30m':30,'1h':60,'2h':120,'4h':240,'6h':360,'12h':720,'1d':1440,'1w':10080 })[tf] || 9999; }

// ═══ Charts init ═════════════════════════════════════════════════════
function initCharts() {
  const base = {
    layout: { background: { color: '#131722' }, textColor: '#787b86' },
    grid:   { vertLines: { color: '#1a1e2a' }, horzLines: { color: '#1a1e2a' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2a2e39' },
    rightPriceScale: { borderColor: '#2a2e39' },
    handleScroll: { mouseWheel: true, pressedMouseMove: true },
    handleScale:  { axisPressedMouseMove: true, mouseWheel: true, pinch: true },
  };
  S.charts.main = LightweightCharts.createChart(g('chartMain'), { ...base });
  S.charts.vol  = LightweightCharts.createChart(g('chartVolume'), {
    ...base,
    timeScale: { visible: false },
    rightPriceScale: { scaleMargins: { top: 0.05, bottom: 0 }, borderColor: '#2a2e39' },
  });
  S.charts.rsi  = LightweightCharts.createChart(g('chartRsi'), {
    ...base,
    timeScale: { visible: false },
    rightPriceScale: { scaleMargins: { top: 0.1, bottom: 0.1 }, borderColor: '#2a2e39' },
  });

  // sync
  const all = [S.charts.main, S.charts.vol, S.charts.rsi];
  all.forEach(src => {
    src.timeScale().subscribeVisibleLogicalRangeChange(range => {
      if (!range) return;
      all.forEach(t => { if (t !== src) t.timeScale().setVisibleLogicalRange(range); });
    });
  });

  // lazy load on scroll to left edge — guarded by S.fitting to prevent loop after fitContent
  S.charts.main.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (range && range.from < 5 && !S.loadingMore && !S.fitting) loadMore();
  });

  new ResizeObserver(relayout).observe(g('chartArea'));
  // Size charts correctly after creation (important: chartVolume is visible at init)
  relayout();
}

function relayout() {
  const W = g('chartArea').clientWidth, H = g('chartArea').clientHeight;
  const volH = (S.layers.volume && !g('chartVolume').classList.contains('h')) ? 80  : 0;
  const rsiH = (hasRsi()        && !g('chartRsi').classList.contains('h'))    ? 110 : 0;
  try { S.charts.main.resize(W, Math.max(H - volH - rsiH, 100)); } catch (_) {}
  if (volH) { try { S.charts.vol.resize(W, volH); } catch (_) {} }
  if (rsiH) { try { S.charts.rsi.resize(W, rsiH); } catch (_) {} }
}
function hasRsi() { return [...S.activeInds.entries()].some(([n, v]) => v.on && n.includes('rsi')); }

function smartLimit() {
  const tf = S.tf || val('selTf') || '1m';
  const mins = tfMin(tf);
  if (mins <= 1)  return 2000;
  if (mins <= 5)  return 5000;
  if (mins <= 60) return 10000;
  return 20000;
}

// ═══ Load chart ══════════════════════════════════════════════════════
async function loadChart() {
  S.ex = val('selEx'); S.sym = val('selSym'); S.tf = val('selTf');
  if (!S.ex || !S.sym || !S.tf) return;
  const gen = ++S.chartGen;
  try {
    load(true, `Loading ${S.sym} ${S.tf}…`);

    const lim = smartLimit();
    const cRes = await api(`/api/chart?exchange=${S.ex}&symbol=${S.sym}&timeframe=${S.tf}&limit=${lim}`);
    if (gen !== S.chartGen) return; // superseded by a newer loadChart() call

    S.candles  = (cRes.data || []).sort((a, b) => a.timestamp - b.timestamp);
    S.oldestTs = S.candles.length ? S.candles[0].timestamp : null;

    // Clear only after data arrives — avoids blank chart during network wait
    clearMainSeries();
    renderCandles();
    renderVolume();
    await refreshActiveIndicators(gen);
    if (gen !== S.chartGen) return; // superseded during indicator fetch

    renderSignals();
    relayout();
    // Guard: prevent fitContent from triggering the lazy-load scroll handler
    S.fitting = true;
    S.charts.main.timeScale().fitContent();
    setTimeout(() => { S.fitting = false; }, 600);

    buildIndDropdown();
    updateStatus();

    // Load signals in background — don't block chart render
    fetchSignals();
  } catch (e) { showErr(e.message); }
  finally { if (gen === S.chartGen) load(false); }
}

async function fetchSignals() {
  try {
    const res = await api('/api/strategies/signals?limit=20000');
    S.allSignals = res.data?.signals || [];
    renderSignals();
    updateStatus();
  } catch (_) {}
}

// ═══ Lazy load more (scroll left) ════════════════════════════════════
async function loadMore() {
  if (!S.oldestTs || S.loadingMore) return;
  S.loadingMore = true;
  try {
    const lim = smartLimit();
    const res = await api(`/api/chart?exchange=${S.ex}&symbol=${S.sym}&timeframe=${S.tf}&limit=${lim}&before_timestamp=${S.oldestTs}`);
    const more = (res.data || []).filter(c => c.timestamp < S.oldestTs);
    if (!more.length) { S.loadingMore = false; return; }

    // Merge, sort ascending, deduplicate — prevents duplicate-timestamp crash in lightweight-charts
    const merged = [...more, ...S.candles].sort((a, b) => a.timestamp - b.timestamp);
    S.candles = merged.filter((c, i) => i === 0 || c.timestamp !== merged[i - 1].timestamp);
    S.oldestTs = S.candles[0].timestamp;

    // Save visible range before setData — prepending data shifts logical indices
    const visRange = S.charts.main.timeScale().getVisibleLogicalRange();
    const offset = more.length;

    if (S.series.candle) S.series.candle.setData(toOhlc(S.candles));
    if (S.series.line)   S.series.line.setData(S.candles.map(c => ({ time: c.timestamp, value: +c.close })));
    if (S.series.vol)    S.series.vol.setData(volData());

    // Restore shifted viewport so the visible window doesn't jump
    if (visRange) {
      S.charts.main.timeScale().setVisibleLogicalRange({
        from: visRange.from + offset,
        to:   visRange.to  + offset,
      });
    }

    renderSignals();
    updateStatus();
  } catch (_) {}
  finally { S.loadingMore = false; }
}

// ═══ Render candles ═══════════════════════════════════════════════════
function renderCandles() {
  rmSeries(S.charts.main, 'candle');
  rmSeries(S.charts.main, 'line');
  if (!S.layers.candles || !S.candles.length) return;

  const data = toOhlc(S.candles);
  S.series.candle = S.charts.main.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350',
    borderUpColor: '#26a69a', borderDownColor: '#ef5350',
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
  });
  S.series.candle.setData(data);
  // invisible line for markers
  S.series.line = S.charts.main.addLineSeries({ color: 'transparent', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  S.series.line.setData(data.map(c => ({ time: c.time, value: c.close })));
  updatePrice();
}

// ═══ Render volume ════════════════════════════════════════════════════
function volData() {
  return S.candles.map(c => ({
    time: c.timestamp, value: +c.volume || 0,
    color: +c.close >= +c.open ? 'rgba(38,166,154,.45)' : 'rgba(239,83,80,.45)',
  }));
}
function renderVolume() {
  const el = g('chartVolume');
  if (!S.layers.volume) {
    el.classList.add('h');
    rmSeries(S.charts.vol, 'vol');
    return;
  }
  el.classList.remove('h');
  if (!S.candles.length) return;
  if (S.series.vol) {
    // Update existing series (faster than recreate)
    S.series.vol.setData(volData());
  } else {
    S.series.vol = S.charts.vol.addHistogramSeries({
      priceFormat: { type: 'volume' },
      scaleMargins: { top: 0.1, bottom: 0 },
    });
    S.series.vol.setData(volData());
  }
}

// ═══ Render signals ════════════════════════════════════════════════════
function renderSignals() {
  const target = S.series.candle || S.series.line;
  if (target) target.setMarkers([]);
  if (!S.layers.signals || !S.allSignals.length || !target) return;

  // Only show signals at timestamps that exactly exist in the loaded candles.
  // This prevents stacking markers outside the visible candle range.
  const candleTs = new Set(S.candles.map(c => c.timestamp));

  const markers = S.allSignals
    .filter(s => s.exchange === S.ex && s.symbol === S.sym && candleTs.has(s.timestamp))
    .map(s => {
      const buy = s.signal_type?.toLowerCase() === 'buy';
      const label = s.strategy_name.replace(/_strategy.*/, '').replace(/_multi_timeframe/, '');
      const conf  = s.confidence != null ? ` ${(s.confidence * 100 | 0)}%` : '';
      return {
        time: s.timestamp,
        position: buy ? 'belowBar' : 'aboveBar',
        color: buy ? '#26a69a' : '#ef5350',
        shape: buy ? 'arrowUp' : 'arrowDown',
        text: label + conf,
        size: 1,
      };
    })
    .sort((a, b) => a.time - b.time);

  target.setMarkers(markers);
}

// ═══ Indicators ═══════════════════════════════════════════════════════
function buildIndDropdown() {
  const el = g('indDropdown');
  if (!S.allInds.length) { el.innerHTML = '<div style="padding:10px 12px;color:var(--dim);font-size:12px">No indicators found</div>'; return; }

  // Group by type
  const emas = S.allInds.filter(i => i.name.includes('ema'));
  const rsis = S.allInds.filter(i => i.name.includes('rsi'));
  const others = S.allInds.filter(i => !i.name.includes('ema') && !i.name.includes('rsi'));

  let html = '';
  const group = (label, items) => {
    if (!items.length) return '';
    const rows = items.map(i => {
      const active = S.activeInds.has(i.name);
      return `<div class="ind-item${active ? ' active' : ''}" onclick="toggleInd('${i.name}')">
        <span>${i.name}</span>
        <span class="ind-item-count">${i.tf} · ${fmtNum(i.count)}</span>
      </div>`;
    }).join('');
    return `<div class="ind-group"><div class="ind-group-label">${label}</div>${rows}</div>`;
  };
  html += group('EMA', emas);
  html += group('RSI', rsis);
  html += group('Other', others);
  el.innerHTML = html;
}

function toggleIndMenu(e) {
  e.stopPropagation();
  const el = g('indDropdown');
  if (el.classList.toggle('open')) {
    const rect = e.currentTarget.getBoundingClientRect();
    el.style.left = Math.min(rect.left, window.innerWidth - 290) + 'px';
  }
}

document.addEventListener('click', () => { g('indDropdown').classList.remove('open'); });

async function toggleInd(name) {
  if (S.activeInds.has(name)) {
    // remove
    const entry = S.activeInds.get(name);
    removeIndSeries(name, entry);
    S.activeInds.delete(name);
    S.indColorMap.delete(name);
    buildIndChips();
    buildIndDropdown();
    updateRsiPanel();
    relayout();
    return;
  }

  // add
  const meta = S.allInds.find(i => i.name === name);
  if (!meta) return;

  // Assign stable color for EMA
  if (!S.indColorMap.has(name)) {
    S.indColorMap.set(name, S.emaColors[S.emaColorIdx++ % S.emaColors.length]);
  }

  S.activeInds.set(name, { on: true, series: null, rsiRefLines: [], data: [], meta });
  buildIndChips();
  buildIndDropdown();

  try {
    const tsParams = indTsParams();
    const r = await api(`/api/indicators?indicator_name=${name}&exchange=${meta.exchange}&symbol=${meta.symbol}&timeframe=${meta.tf}${tsParams}`);
    const pts = (r.data?.indicators || [])
      .map(p => ({ time: p.timestamp, value: parseFloat(p.value) }))
      .filter(p => p.value > 0)
      .sort((a, b) => a.time - b.time);

    const entry = S.activeInds.get(name);
    if (!entry) return; // removed while loading
    entry.data = pts;
    renderIndSeries(name, entry);
    updateRsiPanel();
    relayout();
  } catch (e) { showErr(`Failed to load ${name}: ${e.message}`); }
}

function renderIndSeries(name, entry) {
  if (!entry.on || !entry.data.length) return;
  const isRsi = name.includes('rsi');

  if (isRsi) {
    // RSI sub-panel
    g('chartRsi').classList.remove('h');
    const s = S.charts.rsi.addLineSeries({
      color: '#a29bfe', lineWidth: 1, priceLineVisible: false, lastValueVisible: true, title: name,
    });
    s.setData(entry.data);
    entry.series = s;
    // reference lines
    const addRef = (v, col) => {
      const rs = S.charts.rsi.addLineSeries({ color: col, lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false });
      const t0 = entry.data[0].time, t1 = entry.data[entry.data.length-1].time;
      rs.setData([{ time: t0, value: v }, { time: t1, value: v }]);
      entry.rsiRefLines.push(rs);
    };
    addRef(70, 'rgba(239,83,80,.3)');
    addRef(30, 'rgba(38,166,154,.3)');
  } else {
    // EMA / other → main chart overlay
    const col = S.indColorMap.get(name) || '#f6c90e';
    const s = S.charts.main.addLineSeries({
      color: col, lineWidth: 1, priceLineVisible: false, lastValueVisible: true, title: name,
    });
    s.setData(entry.data);
    entry.series = s;
  }
}

function removeIndSeries(name, entry) {
  const isRsi = name.includes('rsi');
  const chart = isRsi ? S.charts.rsi : S.charts.main;
  if (entry.series) { try { chart.removeSeries(entry.series); } catch (_) {} }
  entry.rsiRefLines.forEach(rs => { try { S.charts.rsi.removeSeries(rs); } catch (_) {} });
  entry.series = null; entry.rsiRefLines = [];
}

function updateRsiPanel() {
  const anyRsiOn = [...S.activeInds.entries()].some(([n, v]) => v.on && n.includes('rsi') && v.series);
  g('chartRsi').classList.toggle('h', !anyRsiOn);
}

function indTsParams() {
  if (!S.candles.length) return '';
  const st = S.candles[0].timestamp;
  const et = S.candles[S.candles.length - 1].timestamp;
  return `&start_ts=${st}&end_ts=${et}`;
}

async function refreshActiveIndicators(gen) {
  // Re-fetch data for all active indicators when chart params change
  const tsParams = indTsParams();
  await Promise.all([...S.activeInds.entries()].map(async ([name, entry]) => {
    removeIndSeries(name, entry);
    entry.series = null; entry.rsiRefLines = []; entry.data = [];
    try {
      const r = await api(`/api/indicators?indicator_name=${name}&exchange=${entry.meta.exchange}&symbol=${entry.meta.symbol}&timeframe=${entry.meta.tf}${tsParams}`);
      if (gen !== undefined && gen !== S.chartGen) return; // superseded
      entry.data = (r.data?.indicators || [])
        .map(p => ({ time: p.timestamp, value: parseFloat(p.value) }))
        .filter(p => p.value > 0)
        .sort((a, b) => a.time - b.time);
      if (entry.on) renderIndSeries(name, entry);
    } catch (_) {}
  }));
  updateRsiPanel();
}

// ═══ Chips ════════════════════════════════════════════════════════════
function buildIndChips() {
  // Remove old chips
  document.querySelectorAll('.chip').forEach(el => el.remove());
  const area = g('indArea');
  [...S.activeInds.entries()].forEach(([name, entry]) => {
    const isRsi = name.includes('rsi');
    const col = isRsi ? '#a29bfe' : (S.indColorMap.get(name) || '#f6c90e');
    const chip = document.createElement('div');
    chip.className = 'chip' + (entry.on ? '' : ' off');
    chip.innerHTML = `<span style="width:8px;height:8px;border-radius:50%;background:${col};flex-shrink:0;display:inline-block"></span>`
      + `<span>${name}</span>`
      + `<span class="chip-x" onclick="removeInd(event,'${name}')">×</span>`;
    chip.addEventListener('click', (e) => { if (!e.target.classList.contains('chip-x')) flipInd(name); });
    area.insertBefore(chip, area.querySelector('.ind-dropdown'));
  });
}

function flipInd(name) {
  const entry = S.activeInds.get(name);
  if (!entry) return;
  entry.on = !entry.on;
  const isRsi = name.includes('rsi');
  const chart  = isRsi ? S.charts.rsi : S.charts.main;
  if (!entry.on) {
    if (entry.series)  { try { chart.removeSeries(entry.series); } catch (_) {} entry.series = null; }
    entry.rsiRefLines.forEach(rs => { try { S.charts.rsi.removeSeries(rs); } catch (_) {} });
    entry.rsiRefLines = [];
  } else {
    renderIndSeries(name, entry);
  }
  buildIndChips();
  updateRsiPanel();
  relayout();
}

function removeInd(e, name) {
  e.stopPropagation();
  const entry = S.activeInds.get(name);
  if (entry) removeIndSeries(name, entry);
  S.activeInds.delete(name);
  S.indColorMap.delete(name);
  buildIndChips();
  buildIndDropdown();
  updateRsiPanel();
  relayout();
}

// ═══ Toggle layers ════════════════════════════════════════════════════
function tog(layer) {
  S.layers[layer] = !S.layers[layer];
  const ids = { candles: 'btnC', volume: 'btnV', signals: 'btnS' };
  const btn = g(ids[layer]);
  const green = layer !== 'candles';
  btn.classList.toggle('on', S.layers[layer]);
  if (green) btn.classList.toggle('g', S.layers[layer]);
  switch (layer) {
    case 'candles': renderCandles(); renderSignals(); break;
    case 'volume':  renderVolume();  break;
    case 'signals': renderSignals(); break;
  }
  relayout();
}

// ═══ Utils ════════════════════════════════════════════════════════════
function clearMainSeries() {
  rmSeries(S.charts.main, 'candle');
  rmSeries(S.charts.main, 'line');
  rmSeries(S.charts.vol,  'vol');
  // Remove active indicator series (but keep the map — user's selection persists)
  [...S.activeInds.entries()].forEach(([name, entry]) => {
    removeIndSeries(name, entry);
  });
}

function rmSeries(chart, key) {
  const s = S.series[key];
  if (s) { try { chart.removeSeries(s); } catch (_) {} S.series[key] = null; }
}

function toOhlc(candles) {
  return candles
    .map(c => ({ time: c.timestamp, open: +c.open, high: +c.high, low: +c.low, close: +c.close }))
    .filter(c => c.open && c.high && c.low && c.close)
    .sort((a, b) => a.time - b.time);
}

function updatePrice() {
  if (!S.candles.length) return;
  const last  = S.candles[S.candles.length - 1];
  const first = S.candles[0];
  const close = +last.close, open = +first.open;
  const pct = ((close - open) / open * 100).toFixed(2);
  const up = close >= open;
  g('priceVal').textContent = close.toFixed(4);
  g('priceVal').className   = 'price-val ' + (up ? 'up' : 'dn');
  g('priceChg').textContent  = (up ? '+' : '') + pct + '%';
  g('priceChg').className    = 'price-chg ' + (up ? 'up' : 'dn');
}

function updateStatus() {
  const sigs = S.allSignals.filter(s => s.exchange === S.ex && s.symbol === S.sym).length;
  g('status').textContent = `${S.candles.length.toLocaleString()} candles  •  ${sigs} signals  •  ${S.ex} ${S.sym} ${S.tf}`;
}

function load(on, msg) {
  g('loader').classList.toggle('h', !on);
  if (msg) g('loaderMsg').textContent = msg;
}
function showErr(msg) {
  const el = g('errBanner'); el.textContent = msg; el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 6000);
}
async function api(url) {
  const r = await fetch(url); if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json();
}
function g(id) { return document.getElementById(id); }
function val(id) { return g(id).value; }
function fmtNum(n) { return n >= 1000 ? (n/1000).toFixed(1)+'k' : String(n); }

const S_COLORS = ['#f6c90e','#a29bfe','#74b9ff','#fd79a8','#81ecec','#55efc4','#fdcb6e'];
S.emaColors = S_COLORS;

// ═══ Strategy panel ══════════════════════════════════════════════════
let stratPanelOpen = false;
let stratStatusCache = null;

function toggleStratPanel() {
  stratPanelOpen = !stratPanelOpen;
  g('stratPanel').classList.toggle('open', stratPanelOpen);
  g('btnStrat').classList.toggle('on', stratPanelOpen);
  if (stratPanelOpen && !stratStatusCache) loadStratStatus();
}

async function loadStratStatus() {
  try {
    const res = await api('/api/strategies/status');
    stratStatusCache = res;
    showStratList();
  } catch (e) {
    g('spBody').innerHTML = `<div style="padding:14px;color:var(--red);font-size:12px">${e.message}</div>`;
  }
}

function showStratList() {
  g('spTitle').textContent = 'Strategies';
  g('spBack').style.display = 'none';

  if (!stratStatusCache) return;
  const rows = Object.entries(stratStatusCache).map(([name, info]) => {
    const latest = info.latest_signal;
    const latestStr = latest
      ? `${latest.signal_type?.toUpperCase()} @ ${latest.price?.toFixed(2) ?? '—'}`
      : '—';
    const ts = latest?.timestamp ? new Date(latest.timestamp * 1000).toLocaleDateString('en-GB', { day:'2-digit', month:'short' }) : '';
    return `<div class="strat-row" onclick="showStratSignals('${name}')">
      <div class="strat-name">${name}</div>
      <div class="strat-meta">
        <span class="strat-sig-count">${info.total_signals} signals</span>
        <span class="strat-last-sig">${ts ? ts + ' · ' : ''}${latestStr}</span>
      </div>
    </div>`;
  }).join('');

  g('spBody').innerHTML = rows || '<div style="padding:14px;color:var(--dim);font-size:12px">No strategies found</div>';
}

function showStratSignals(stratName) {
  g('spTitle').textContent = stratName.replace(/_strategy.*/, '');
  g('spBack').style.display = 'block';

  const sigs = S.allSignals
    .filter(s => s.strategy_name === stratName)
    .sort((a, b) => b.timestamp - a.timestamp);

  if (!sigs.length) {
    g('spBody').innerHTML = '<div style="padding:14px;color:var(--dim);font-size:12px">No signals loaded. Try increasing limit or check symbol filter.</div>';
    return;
  }

  const rows = sigs.map(s => {
    const buy = s.signal_type?.toLowerCase() === 'buy';
    const dt = new Date(s.timestamp * 1000);
    const dateStr = dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'2-digit' });
    const timeStr = dt.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    return `<tr>
      <td>${dateStr} ${timeStr}</td>
      <td class="${buy ? 'sig-buy' : 'sig-sell'}">${s.signal_type?.toUpperCase()}</td>
      <td>${s.price?.toFixed(2) ?? '—'}</td>
      <td>${s.confidence != null ? (s.confidence * 100 | 0) + '%' : '—'}</td>
      <td style="color:var(--dim)">${s.symbol}</td>
    </tr>`;
  }).join('');

  g('spBody').innerHTML = `<table class="sig-table">
    <thead><tr><th>Date</th><th>Type</th><th>Price</th><th>Conf</th><th>Symbol</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

window.addEventListener('DOMContentLoaded', boot);
</script>
