async function applyIndicator() {
  if (!L_sel) return;
  const btn  = g('btnApplyInd');
  const prog = g('indProgress');
  const msg  = g('indProgressMsg');

  btn.disabled = true;
  prog.classList.add('on');

  // Snapshot chart gen — if chart reloads during async compute we must abort
  const gen = S.chartGen;

  // Collect params
  const body = {
    type:      L_sel.name,
    timeframe: g('ip_timeframe')?.value || S.tf,
    exchange:  S.ex,
    symbol:    S.sym,
  };
  (L_sel.params || []).forEach(p => {
    const el = g(`ip_${p.key}`);
    if (el) body[p.key] = p.type === 'int' ? parseInt(el.value) : el.value;
  });
  const displayType = g('ip_display')?.value || 'overlay';

  // Pass visible candle range → server returns only what's needed for display.
  // Resolver still computes and caches the full history; this only limits the
  // rows returned in the SSE "done" payload (avoids 300MB+ responses).
  if (S.candles.length) {
    body.start_ts = S.candles[0].timestamp;
    body.end_ts   = S.candles[S.candles.length - 1].timestamp;
  }

  const indKey = `${body.type}_${body.period || ''}_${body.timeframe}`;

  try {
    await streamCompute('/api/indicators/compute', body, ev => {
      if (ev.stage === 'aggregating') msg.textContent = `Aggregating ${ev.timeframe}…`;
      else if (ev.stage === 'loading')  msg.textContent = ev.message || 'Loading candles…';
      else if (ev.stage === 'computing') msg.textContent = ev.message || 'Computing…';
      else if (ev.stage === 'storing')  msg.textContent = ev.message || 'Storing…';
      else if (ev.stage === 'error') { showErr(ev.message || 'Compute error'); closeIndModal(); }
      else if (ev.stage === 'done') {
        if (gen !== S.chartGen) { closeIndModal(); return; } // chart was reloaded during compute
        // Sort, deduplicate and sanitise before handing to lightweight-charts
        const raw = (ev.data || [])
          .map(p => ({ time: p.timestamp, value: parseFloat(p.value) }))
          .filter(p => p.time && isFinite(p.value))
          .sort((a, b) => a.time - b.time);
        const seen = new Set();
        const pts = raw.filter(p => { if (seen.has(p.time)) return false; seen.add(p.time); return true; });
        addIndToChart(indKey, pts, { ...body, display_type: displayType });
        closeIndModal();
      }
    });
  } catch (e) {
    showErr(`Failed: ${e.message}`);
  } finally {
    btn.disabled = false;
    prog.classList.remove('on');
  }
}

async function streamCompute(url, body, onEvent) {
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split('\n\n');
    buf = parts.pop();
    for (const part of parts) {
      const line = part.replace(/^data:\s*/, '').trim();
      if (line) { try { onEvent(JSON.parse(line)); } catch (_) {} }
    }
  }
}

function addIndToChart(key, pts, meta) {
  const existing = S.activeInds.get(key);
  if (existing) removeIndSeries(key, existing);

  if (!S.indColorMap.has(key))
    S.indColorMap.set(key, S.emaColors[S.emaColorIdx++ % S.emaColors.length]);

  // Determine display type and whether to use the left Y-axis.
  // • No explicit choice: auto-detect → sub_panel when values differ from price.
  // • Explicit overlay + values differ from price → left Y-axis (TradingView pattern):
  //   indicator stays on main chart but gets its own scale, candles keep right axis.
  // • Explicit overlay + values in price range → right Y-axis (shared with candles).
  let displayType = meta.display_type || 'overlay';
  let useLeftScale = false;

  if (displayType === 'overlay' && pts.length > 0 && S.candles.length > 0) {
    const lastPrice = +S.candles[S.candles.length - 1].close;
    const sample = pts.slice(-50).map(p => p.value);
    const avg = sample.reduce((a, b) => a + b, 0) / sample.length;
    const scalesDiffer = avg < lastPrice * 0.05 || avg > lastPrice * 3;
    if (scalesDiffer) {
      if (meta.explicit_display) {
        useLeftScale = true;   // user insisted on overlay → left axis
      } else {
        displayType = 'sub_panel';  // auto-detect → move to sub panel
      }
    }
  }

  const entry = { on: true, series: null, subRefLines: [], data: pts, displayType, useLeftScale,
                   meta: { name: key, exchange: meta.exchange, symbol: meta.symbol,
                           tf: meta.timeframe } };
  S.activeInds.set(key, entry);
  S.indMeta = S.indMeta || new Map();
  S.indMeta.set(key, { display_name: `${meta.type?.toUpperCase()} (${meta.period || ''}, ${meta.timeframe?.toUpperCase()})` });

  buildIndChips();
  try { renderIndSeries(key, entry); } catch (e) { console.warn('renderIndSeries error:', e.message); }
  updateSubPanel();
  relayout();
}

// Keep existing toggleInd for backwards compat with stored indicators
async function toggleInd(name) {
  if (S.activeInds.has(name)) {
    const entry = S.activeInds.get(name);
    removeIndSeries(name, entry);
    S.activeInds.delete(name);
    S.indColorMap.delete(name);
    buildIndChips();
    updateSubPanel();
    relayout();
    return;
  }
  const meta = S.allInds.find(i => i.name === name);
  if (!meta) return;
  if (!S.indColorMap.has(name))
    S.indColorMap.set(name, S.emaColors[S.emaColorIdx++ % S.emaColors.length]);
  S.activeInds.set(name, { on: true, series: null, subRefLines: [], data: [], meta });
  buildIndChips();
  try {
    const tsParams = indTsParams();
    const r = await api(`/api/indicators?indicator_name=${name}&exchange=${meta.exchange}&symbol=${meta.symbol}&timeframe=${meta.tf}${tsParams}`);
    const pts = (r.data?.indicators || [])
      .map(p => ({ time: p.timestamp, value: parseFloat(p.value) }))
      .filter(p => p.time && isFinite(p.value)).sort((a, b) => a.time - b.time);
    const entry = S.activeInds.get(name);
    if (!entry) return;
    entry.data = pts;
    renderIndSeries(name, entry);
    updateSubPanel();
    relayout();
  } catch (e) { showErr(`Failed to load ${name}: ${e.message}`); }
}

function renderIndSeries(name, entry) {
  if (!entry.on || !entry.data.length) return;
  const isSubPanel = (entry.displayType || 'overlay') === 'sub_panel';
  const col = S.indColorMap.get(name) || '#f6c90e';

  // Clip data to currently loaded candle range to prevent viewport jumps
  const data = clipToCandles(entry.data);
  if (!data.length) return;

  // Save logical range before setData (S.fitting=true blocks loadMore so indices won't shift)
  const mainRange = S.charts.main.timeScale().getVisibleLogicalRange();

  // Block loadMore from firing during setData — scroll events during setData
  // can prepend candles and shift logical indices, corrupting the restore below
  const prevFitting = S.fitting;
  S.fitting = true;

  if (isSubPanel) {
    // Get or create dedicated sub-chart for this indicator
    const displayName = S.indMeta.get(name)?.display_name || name.toUpperCase();
    const subData = S.subCharts.has(name) ? S.subCharts.get(name) : createSubChart(name, displayName);
    if (!subData) { S.fitting = prevFitting; return; }

    // Create anchor series if not yet done (spans full candle range for time-axis sync)
    if (!subData.anchor) {
      try {
        subData.anchor = subData.chart.addHistogramSeries({
          color: 'rgba(0,0,0,0)', priceScaleId: 'left',
          lastValueVisible: false, priceLineVisible: false,
        });
        _setSubAnchorForKey(name);
      } catch (_) {}
    }

    let s;
    try {
      s = subData.chart.addLineSeries({
        color: col, lineWidth: 1, priceLineVisible: false, lastValueVisible: true, title: name,
      });
    } catch (e) {
      console.warn('renderIndSeries sub-panel addLineSeries error:', e.message);
      S.fitting = prevFitting;
      return;
    }
    try {
      s.setData(data);
    } catch (e) {
      console.warn('renderIndSeries sub-panel setData error:', e.message);
      S.fitting = prevFitting;
      try { subData.chart.removeSeries(s); } catch (_) {}
      return;
    }
    entry.series = s;
    if (mainRange) {
      try { S.charts.main.timeScale().setVisibleLogicalRange(mainRange); } catch (_) {}
      // setVisibleLogicalRange(same value) doesn't fire visibleLogicalRangeChange,
      // so the new sub-chart never gets synced — call explicitly
      try { _syncSubChartByKey(name, mainRange); } catch (_) {}
    }
    // Reference lines for 0-100 bounded oscillators
    const sample20 = data.slice(-20).map(p => p.value);
    const maxVal = Math.max(...sample20);
    const minVal = Math.min(...sample20);
    if (minVal >= 0 && maxVal >= 50 && maxVal <= 105 && data.length > 1) {
      const addRef = (v, c) => {
        let rs;
        try { rs = subData.chart.addLineSeries({ color: c, lineWidth: 1, lineStyle: 2,
                                                  priceLineVisible: false, lastValueVisible: false }); }
        catch (_) { return; }
        const t0 = data[0].time, t1 = data[data.length-1].time;
        try { rs.setData([{ time: t0, value: v }, { time: t1, value: v }]); }
        catch (_) { try { subData.chart.removeSeries(rs); } catch (_2) {} return; }
        entry.subRefLines.push(rs);
      };
      addRef(70, 'rgba(239,83,80,.3)');
      addRef(30, 'rgba(38,166,154,.3)');
    }
  } else {
    // Overlay: use left Y-axis when indicator values are in different units from price.
    // This keeps candles on the right axis (undistorted) while the indicator still
    // appears visually overlaid on the same chart pane.
    const scaleId = entry.useLeftScale ? 'left' : 'right';
    let s;
    try {
      s = S.charts.main.addLineSeries({
        color: col, lineWidth: 1, priceLineVisible: false, lastValueVisible: true, title: name,
        priceScaleId: scaleId,
      });
    } catch (e) {
      console.warn('renderIndSeries overlay addLineSeries error:', e.message);
      S.fitting = prevFitting;
      return;
    }
    if (entry.useLeftScale) {
      try {
        S.charts.main.priceScale('left').applyOptions({
          visible: true,
          borderColor: '#2a2e39',
          scaleMargins: { top: 0.1, bottom: 0.1 },
        });
      } catch (_) {}
    }
    try {
      s.setData(data);
    } catch (e) {
      console.warn('renderIndSeries overlay setData error:', e.message);
      S.fitting = prevFitting;
      try { S.charts.main.removeSeries(s); } catch (_) {}
      return;
    }
    entry.series = s;
    // Restore viewport via timestamps — logical indices may have shifted if loadMore
    // ran between the save and restore, but timestamps are always stable
    if (mainRange) {
      try { S.charts.main.timeScale().setVisibleLogicalRange(mainRange); } catch (_) {}
    }
  }

  S.fitting = prevFitting;
}

function clipToCandles(data) {
  if (!data.length) return data;
  const t0 = S.displayedCandleT0 ?? (S.candles.length ? S.candles[0].timestamp : null);
  const t1 = S.displayedCandleT1 ?? (S.candles.length ? S.candles[S.candles.length - 1].timestamp : null);
  if (!t0 || !t1) return data;
  return data.filter(p => p.time >= t0 && p.time <= t1);
}

function removeIndSeries(name, entry) {
  const isSubPanel = (entry.displayType || 'overlay') === 'sub_panel';
  if (isSubPanel) {
    const subData = S.subCharts.get(name);
    if (subData) {
      if (entry.series) { try { subData.chart.removeSeries(entry.series); } catch (_) {} }
      entry.subRefLines.forEach(rs => { try { subData.chart.removeSeries(rs); } catch (_) {} });
      destroySubChart(name);
    }
  } else {
    if (entry.series) { try { S.charts.main.removeSeries(entry.series); } catch (_) {} }
    if (entry.useLeftScale) {
      const anyLeft = [...S.activeInds.values()].some(e => e !== entry && e.on && e.useLeftScale && e.series);
      if (!anyLeft) try { S.charts.main.priceScale('left').applyOptions({ visible: false }); } catch (_) {}
    }
  }
  entry.series = null; entry.subRefLines = [];
}

function updateSubPanel() { /* sub-charts are shown/hidden by createSubChart/destroySubChart */ }

function indTsParams() {
  const st = S.displayedCandleT0 ?? (S.candles.length ? S.candles[0].timestamp : null);
  const et = S.displayedCandleT1 ?? (S.candles.length ? S.candles[S.candles.length - 1].timestamp : null);
  if (!st || !et) return '';
  return `&start_ts=${st}&end_ts=${et}`;
}

async function refreshActiveIndicators(gen) {
  // Re-fetch data for all active indicators when chart params change.
  // Preview indicators (added via Test Run) are removed on timeframe/symbol change
  // since they were computed for a specific tf — keeping them with a mismatched tf
  // causes sub-chart ↔ main chart sync to go haywire (1m indicator vs 4h candles).
  const tsParams = indTsParams();
  const toRemove = [];
  for (const [name, entry] of S.activeInds) {
    if (name.startsWith('preview_') || entry.meta.tf !== S.tf) {
      toRemove.push(name);
    }
  }
  for (const name of toRemove) {
    const entry = S.activeInds.get(name);
    if (entry) removeIndSeries(name, entry);
    S.activeInds.delete(name);
    S.indColorMap.delete(name);
  }
  if (toRemove.length) buildIndChips();

  await Promise.all([...S.activeInds.entries()].map(async ([name, entry]) => {
    removeIndSeries(name, entry);
    entry.series = null; entry.subRefLines = []; entry.data = [];
    try {
      const r = await api(`/api/indicators?indicator_name=${name}&exchange=${entry.meta.exchange}&symbol=${entry.meta.symbol}&timeframe=${S.tf}${tsParams}`);
      if (gen !== undefined && gen !== S.chartGen) return; // superseded
      entry.data = (r.data?.indicators || [])
        .map(p => ({ time: p.timestamp, value: parseFloat(p.value) }))
        .filter(p => p.time && isFinite(p.value))
        .sort((a, b) => a.time - b.time);
      if (entry.on) renderIndSeries(name, entry);
    } catch (_) {}
  }));
  updateSubPanel();
}

// ═══ Chips ════════════════════════════════════════════════════════════
function buildIndChips() {
  document.querySelectorAll('.chip').forEach(el => el.remove());
  const area = g('indArea');
  [...S.activeInds.entries()].forEach(([name, entry]) => {
    const col = S.indColorMap.get(name) || '#f6c90e';
    const chip = document.createElement('div');
    chip.className = 'chip' + (entry.on ? '' : ' off');
    chip.innerHTML = `<span style="width:8px;height:8px;border-radius:50%;background:${col};flex-shrink:0;display:inline-block"></span>`
      + `<span>${name}</span>`
      + `<span class="chip-x" onclick="removeInd(event,'${name}')">×</span>`;
    chip.addEventListener('click', (e) => { if (!e.target.classList.contains('chip-x')) flipInd(name); });
    area.insertBefore(chip, area.querySelector('.add-ind-btn'));
  });
}

function flipInd(name) {
  const entry = S.activeInds.get(name);
  if (!entry) return;
  entry.on = !entry.on;
  if (!entry.on) {
    if (entry.displayType === 'sub_panel') {
      const subData = S.subCharts.get(name);
      if (subData) {
        if (entry.series) { try { subData.chart.removeSeries(entry.series); } catch (_) {} entry.series = null; }
        entry.subRefLines.forEach(rs => { try { subData.chart.removeSeries(rs); } catch (_) {} });
        entry.subRefLines = [];
        destroySubChart(name);
      }
    } else {
      if (entry.series) { try { S.charts.main.removeSeries(entry.series); } catch (_) {} entry.series = null; }
    }
  } else {
    renderIndSeries(name, entry);
  }
  buildIndChips();
  updateSubPanel();
  relayout();
}

function buildIndDropdown() { /* modal-based UI — no legacy dropdown needed */ }

function removeInd(e, name) {
  e.stopPropagation();
  const entry = S.activeInds.get(name);
  if (entry) removeIndSeries(name, entry);
  S.activeInds.delete(name);
  S.indColorMap.delete(name);
  buildIndChips();
  buildIndDropdown();
  updateSubPanel();
  relayout();
}

// ═══ Toggle layers ════════════════════════════════════════════════════
function tog(layer) {
  S.layers[layer] = !S.layers[layer];
  const ids = { candles: 'btnC', volume: 'btnV', signals: 'btnS' };
  const btn = g(ids[layer]);
  const green = layer !== 'candles';
  btn.classList.toggle('on', S.layers[layer]);
  if (green) btn.classList.toggle('g', S.layers[layer]);
  switch (layer) {
    case 'candles': renderCandles(); renderSignals(); break;
    case 'volume':  renderVolume();  break;
    case 'signals': renderSignals(); break;
  }
  relayout();
}

function clearMainSeries() {
  _removeMainValueLine();
  rmSeries(S.charts.main, 'candle');
  rmSeries(S.charts.main, 'line');
  rmSeries(S.charts.main, 'vol');
  // Remove active indicator series (but keep the map — user's selection persists)
  [...S.activeInds.entries()].forEach(([name, entry]) => {
    removeIndSeries(name, entry);
  });
}

function rmSeries(chart, key) {
  const s = S.series[key];
  if (s) { try { chart.removeSeries(s); } catch (_) {} S.series[key] = null; }
}

function toOhlc(candles) {
  const seen = new Set();
  return candles
    .map(c => ({ time: c.timestamp, open: +c.open, high: +c.high, low: +c.low, close: +c.close }))
    .filter(c => c.time && isFinite(c.open) && isFinite(c.high) && isFinite(c.low) && isFinite(c.close)
                 && c.open && c.high && c.low && c.close)
    .sort((a, b) => a.time - b.time)
    .filter(c => { if (seen.has(c.time)) return false; seen.add(c.time); return true; });
}

function updatePrice() {
  if (!S.candles.length) return;
  const last  = S.candles[S.candles.length - 1];
  const first = S.candles[0];
  const close = +last.close, open = +first.open;
  const pct = ((close - open) / open * 100).toFixed(2);
  const up = close >= open;
  g('priceVal').textContent = close.toFixed(4);
  g('priceVal').className   = 'price-val ' + (up ? 'up' : 'dn');
  g('priceChg').textContent  = (up ? '+' : '') + pct + '%';
  g('priceChg').className    = 'price-chg ' + (up ? 'up' : 'dn');
}

function updateStatus() {
  const sigs = S.allSignals.filter(s => s.exchange === S.ex && s.symbol === S.sym).length;
  g('status').textContent = `${S.candles.length.toLocaleString()} candles  •  ${sigs} signals  •  ${S.ex} ${S.sym} ${S.tf}`;
}

function load(on, msg) {
  const ld = g('loader'); if (ld) ld.classList.toggle('h', !on);
  if (msg) { const lm = g('loaderMsg'); if (lm) lm.textContent = msg; }
}
function showErr(msg) {
  console.error('[TradingBot]', msg);
  const el = g('errBanner');
  if (!el) return;
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 6000);
}
async function api(url) {
  const r = await fetch(url); if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json();
}
function g(id) { return document.getElementById(id); }
function val(id) { return g(id).value; }
function fmtNum(n) { return n >= 1000 ? (n/1000).toFixed(1)+'k' : String(n); }

const S_COLORS = ['#f6c90e','#a29bfe','#74b9ff','#fd79a8','#81ecec','#55efc4','#fdcb6e'];
S.emaColors = S_COLORS;

// ═══ Strategy panel ══════════════════════════════════════════════════
let stratPanelOpen = false;
let stratStatusCache = null;

function toggleStratPanel() {
  stratPanelOpen = !stratPanelOpen;
  g('stratPanel').classList.toggle('open', stratPanelOpen);
  g('btnStrat').classList.toggle('on', stratPanelOpen);
  if (stratPanelOpen && !stratStatusCache) loadStratStatus();
}

async function loadStratStatus() {
  try {
    const res = await api('/api/strategies/status');
    stratStatusCache = res;
    showStratList();
  } catch (e) {
    g('spBody').innerHTML = `<div style="padding:14px;color:var(--red);font-size:12px">${e.message}</div>`;
  }
}

function showStratList() {
  g('spTitle').textContent = 'Strategies';
  g('spBack').style.display = 'none';

  if (!stratStatusCache) return;
  const rows = Object.entries(stratStatusCache).map(([name, info]) => {
    const latest = info.latest_signal;
    const latestStr = latest
      ? `${latest.signal_type?.toUpperCase()} @ ${latest.price?.toFixed(2) ?? '—'}`
      : '—';
    const ts = latest?.timestamp ? new Date(latest.timestamp * 1000).toLocaleDateString('en-GB', { day:'2-digit', month:'short' }) : '';
    return `<div class="strat-row" onclick="showStratSignals('${name}')">
      <div class="strat-name">${name}</div>
      <div class="strat-meta">
        <span class="strat-sig-count">${info.total_signals} signals</span>
        <span class="strat-last-sig">${ts ? ts + ' · ' : ''}${latestStr}</span>
      </div>
    </div>`;
  }).join('');

  g('spBody').innerHTML = rows || '<div style="padding:14px;color:var(--dim);font-size:12px">No strategies found</div>';
}

function showStratSignals(stratName) {
  g('spTitle').textContent = stratName.replace(/_strategy.*/, '');
  g('spBack').style.display = 'block';

  const sigs = S.allSignals
    .filter(s => s.strategy_name === stratName)
    .sort((a, b) => b.timestamp - a.timestamp);

  if (!sigs.length) {
    g('spBody').innerHTML = '<div style="padding:14px;color:var(--dim);font-size:12px">No signals loaded. Try increasing limit or check symbol filter.</div>';
    return;
  }

  const rows = sigs.map(s => {
    const buy = s.signal_type?.toLowerCase() === 'buy';
    const dt = new Date(s.timestamp * 1000);
    const dateStr = dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'2-digit' });
    const timeStr = dt.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    return `<tr>
      <td>${dateStr} ${timeStr}</td>
      <td class="${buy ? 'sig-buy' : 'sig-sell'}">${s.signal_type?.toUpperCase()}</td>
      <td>${s.price?.toFixed(2) ?? '—'}</td>
      <td>${s.confidence != null ? (s.confidence * 100 | 0) + '%' : '—'}</td>
      <td style="color:var(--dim)">${s.symbol}</td>
    </tr>`;
  }).join('');

  g('spBody').innerHTML = `<table class="sig-table">
    <thead><tr><th>Date</th><th>Type</th><th>Price</th><th>Conf</th><th>Symbol</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ═══ Monaco editor (custom indicators) ══════════════════════════════
let monacoEditor = null;
let _monacoLoading = false;
let editorParams = []; // [{key, type, default}]

const EDITOR_TEMPLATE = `# Available: close open high low volume ts np ta
# ta.rsi() ta.ema() ta.sma() ta.macd() ta.bbands() ... + custom primitives
# Assign your result to the variable:  result = np.ndarray (one value per candle)

# --- EMA deviation (% above / below EMA) ---
ema    = ta.ema(close, period)
result = (close - ema) / ema * 100
`;

function openEditorModal() {
  closeIndModal();
  resetEditorPanel();
  ensureEditorPanelVisible();
  initMonaco();
  if (monacoEditor) monacoEditor.setValue(EDITOR_TEMPLATE);
}

function resetEditorPanel() {
  g('editorName').value = '';
  editorParams = [{ key: 'period', type: 'int', default: 14 }];
  renderEditorParams();
  if (monacoEditor) monacoEditor.setValue(EDITOR_TEMPLATE);
}

function closeEditorModal() { /* editor panel is permanent; closing handled by GL */ }
function onEditorBgClick(e) { /* no-op: editor is a panel, not a modal */ }

function newEditorTab() { openEditorModal(); }

function initMonaco() {
  if (monacoEditor || _monacoLoading) return;
  _monacoLoading = true;
  if (typeof require === 'undefined') {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js';
    script.onload = () => {
      require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
      require(['vs/editor/editor.main'], createMonacoEditor);
    };
    document.head.appendChild(script);
  } else {
    require(['vs/editor/editor.main'], createMonacoEditor);
  }
}

function createMonacoEditor() {
  const mount = g('monacoMount');
  if (!mount || mount.dataset.monacoInit) return;
  mount.dataset.monacoInit = '1';
  // Show the active tab's code immediately, not the generic template
  const activeTab = editorTabs.get(activeTabId);
  const initialCode = activeTab?.code ?? EDITOR_TEMPLATE;
  monacoEditor = monaco.editor.create(mount, {
    value: initialCode,
    language: 'python',
    theme: 'vs-dark',
    fontSize: 12,
    minimap: { enabled: false },
    scrollBeyondLastLine: false,
    automaticLayout: true,
    lineNumbers: 'on',
    padding: { top: 8 },
  });
}

function renderEditorParams() {
  const area = g('editorParams');
  let html = editorParams.map((p, i) => `
    <div class="editor-param-chip">
      <code>${p.key}</code>
      <span>${p.type}</span>
      <span>${p.default}</span>
      <button onclick="removeEditorParam(${i})">×</button>
    </div>`).join('');
  html += `<button class="editor-add-param" onclick="addEditorParam()">+ param</button>`;
  area.innerHTML = html;
}

function addEditorParam() {
  const key = prompt('Parameter name (e.g. period, threshold):');
  if (!key || !key.trim()) return;
  const type = prompt('Type (int / float / str):', 'int') || 'int';
  const def  = prompt('Default value:', '14') || '14';
  editorParams.push({ key: key.trim(), type, default: def });
  renderEditorParams();
}

function removeEditorParam(i) {
  editorParams.splice(i, 1);
  renderEditorParams();
}

async function testCustomIndicator() {
  if (!monacoEditor) return;
  const code = monacoEditor.getValue();
  const name = g('editorName').value.trim() || 'preview';
  const paramDefaults = Object.fromEntries(editorParams.map(p => [p.key, p.default]));

  const btnTest = g('btnEditorTest');
  const btnSave = g('btnEditorSave');
  const origHtml = btnTest.innerHTML;
  btnTest.disabled = true;
  btnSave.disabled = true;
  btnTest.innerHTML = '<span class="spin" style="width:11px;height:11px;display:inline-block;vertical-align:middle;margin-right:6px"></span>Computing…';

  try {
    const fromVal = g('rangeFrom')?.value;
    const toVal   = g('rangeTo')?.value;
    const fromTs  = fromVal ? Math.floor(new Date(fromVal + 'T00:00:00Z').getTime() / 1000) : null;
    const toTs    = toVal   ? Math.floor(new Date(toVal   + 'T23:59:59Z').getTime() / 1000) : null;

    const reqBody = {
      type: '__script__', timeframe: S.tf, exchange: S.ex, symbol: S.sym,
      _code: code, ...paramDefaults,
    };
    if (fromTs) reqBody.start_ts = fromTs;
    if (toTs)   reqBody.end_ts   = toTs;
    // When date range is selected, bypass _TEST_LIMITS so all data in range is returned
    if (fromTs || toTs) reqBody.limit = 0;

    const r = await fetch('/api/indicators/test', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(reqBody),
    });
    const data = await r.json();
    if (data.error) { showErr(data.error); return; }
    const pts = (data.data || [])
      .map(p => ({ time: p.timestamp, value: parseFloat(p.value) }))
      .filter(p => p.time && isFinite(p.value))
      .sort((a, b) => a.time - b.time);
    if (!pts.length) { showErr('No data returned for the selected range'); return; }
    const displayType = g('editorDisplay')?.value || 'sub_panel';
    addIndToChart(`preview_${name}`, pts, {
      type: name, timeframe: S.tf, exchange: S.ex, symbol: S.sym,
      display_type: displayType,
      explicit_display: true,
    });
  } catch (e) {
    showErr(e.message);
  } finally {
    btnTest.innerHTML = origHtml;
    btnTest.disabled = false;
    btnSave.disabled = false;
  }
}

async function saveCustomIndicator() {
  if (!monacoEditor) return;
  const name = g('editorName').value.trim();
  if (!name) { alert('Enter a name for the indicator'); return; }
  const code = monacoEditor.getValue();

  try {
    const r = await fetch(`/api/library/indicators/${name}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code }),
    });
    const data = await r.json();
    if (data.error) { showErr(data.error); return; }

    // Identify the currently active tab entry (by activeTabId, not by name from input).
    if (activeTabId !== 'new' && editorTabs.has(activeTabId)) {
      if (activeTabId !== name) {
        // Name was changed in the input field — rename the tab entry
        editorTabs.delete(activeTabId);
        editorTabs.set(name, { name, type: 'indicators', code, dirty: false });
        activeTabId = name;
      } else {
        const tab = editorTabs.get(activeTabId);
        tab.dirty = false; tab.type = 'indicators'; tab.code = code;
      }
    } else {
      // "New Indicator" tab — promote it to a named tab entry
      editorTabs.set(name, { name, type: 'indicators', code, dirty: false });
      activeTabId = name;
    }
    _renderTabs();
    loadSidebarFiles();
  } catch (e) { showErr(e.message); }
}

window.addEventListener('DOMContentLoaded', boot);

// ═══ Realtime WebSocket ═══════════════════════════════════════════════
let _rtWS = null;
let _rtCount = 0;

function _wsLive(text, color) {
  const el = g('wsLive');
  if (el) { el.textContent = text; el.style.color = color; }
}

function connectRealtimeWS() {
  if (_rtWS) { _rtWS.onclose = null; _rtWS.close(); _rtWS = null; }
  if (!S.ex || !S.sym || !S.tf) return;

  _wsLive('WS connecting…', '#555');
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(
    `${proto}://${location.host}/api/ws/candles` +
    `?exchange=${encodeURIComponent(S.ex)}&symbol=${encodeURIComponent(S.sym)}&timeframe=${encodeURIComponent(S.tf)}`
  );
  _rtWS = ws;
  _rtCount = 0;

  ws.onopen = () => _wsLive('WS ●', '#26a69a');

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch (_) { return; }
    if (msg.type !== 'candle') return;
    const d = msg.data;
    _rtCount++;
    _wsLive(`${new Date().toLocaleTimeString('en-GB')} C=${(+d.close).toFixed(2)}`, '#26a69a');

    // Update candlestick series
    if (S.series.candle) {
      try {
        S.series.candle.update({ time: d.time, open: +d.open, high: +d.high, low: +d.low, close: +d.close });
      } catch (_) {}
    }
    // Update invisible line series (used for markers)
    if (S.series.line) {
      try { S.series.line.update({ time: d.time, value: +d.close }); } catch (_) {}
    }
    // Update volume series
    if (S.series.vol) {
      try {
        S.series.vol.update({
          time: d.time, value: +d.volume,
          color: +d.close >= +d.open ? 'rgba(38,166,154,.45)' : 'rgba(239,83,80,.45)',
        });
      } catch (_) {}
    }

    // Keep S.candles in sync so updatePrice/legend see current data
    if (S.candles.length > 0) {
      const last = S.candles[S.candles.length - 1];
      if (d.time === last.timestamp) {
        last.open = d.open; last.high = d.high; last.low = d.low;
        last.close = d.close; last.volume = d.volume;
      } else if (d.time > last.timestamp) {
        S.candles.push({ timestamp: d.time, open: d.open, high: d.high,
                         low: d.low, close: d.close, volume: d.volume });
      }
    }
    updatePrice();
  };

  ws.onclose = () => {
    _wsLive('WS reconnecting…', '#555');
    if (_rtWS === ws) setTimeout(connectRealtimeWS, 3000);
  };
  ws.onerror = () => _wsLive('WS error', '#ef5350');
}
