<!DOCTYPE html>
<html>
<head>
    <title>Trading Chart</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #131722;
            color: #d1d4dc;
            overflow-x: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 100vw;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a2e39;
        }
        
        .header h1 {
            color: #d1d4dc;
            font-size: 24px;
            font-weight: 600;
        }
        
        .nav-links {
            display: flex;
            gap: 15px;
        }
        
        .nav-link {
            color: #868b94;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .nav-link:hover {
            color: #d1d4dc;
            background: #2a2e39;
        }
        
        .chart-error {
            background: #dc3545;
            color: white;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
            text-align: center;
        }
        
        .chart-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px;
            color: #d1d4dc;
        }
        
        .spinner {
            border: 3px solid #2a2e39;
            border-top: 3px solid #2962ff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .control-group label {
            color: #868b94;
            font-size: 14px;
            min-width: 60px;
        }
        
        .btn {
            background: #2962ff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        
        .btn:hover {
            background: #1e53e5;
        }
        
        .btn.active {
            background: #26a69a;
        }
        
        .btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        select {
            background: #2a2e39;
            color: white;
            border: 1px solid #3a3e49;
            padding: 8px 12px;
            border-radius: 4px;
            min-width: 120px;
        }
        
        .chart-container {
            background: #1e222d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2e39;
        }
        
        .chart-title {
            font-size: 18px;
            font-weight: bold;
            color: #d1d4dc;
        }
        
        .chart-info {
            display: flex;
            gap: 20px;
            font-size: 14px;
            flex-wrap: wrap;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .info-label {
            color: #868b94;
            font-size: 12px;
        }
        
        .info-value {
            color: #d1d4dc;
            font-weight: 500;
        }
        
        .price-up { color: #26a69a; }
        .price-down { color: #ef5350; }
        
        #chart {
            width: 100%;
            height: 600px;
            min-height: 600px;
            background: #1a1a1a;
            border: 1px solid #333;
        }
        
        .chart-container {
            background: #1e222d;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        
        .debug-info {
            background: #2a2e39;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 12px;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .chart-info {
                gap: 10px;
                justify-content: center;
            }
            
            .chart-header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📈 Trading Chart</h1>
            <div class="nav-links">
                <a href="/" class="nav-link">← Dashboard</a>
                <a href="/indicators" class="nav-link">🎯 Indicators</a>
                <a href="/api/debug/database" class="nav-link" target="_blank">🔍 Debug API</a>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Exchange:</label>
                <select id="exchangeSelect">
                    <option value="">Loading...</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Symbol:</label>
                <select id="symbolSelect">
                    <option value="">Loading...</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Timeframe:</label>
                <select id="timeframeSelect">
                    <option value="">Loading...</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Limit:</label>
                <input type="number" id="limitInput" value="500" min="1" max="10000" style="width: 80px; padding: 4px; background: #2a2e39; border: 1px solid #434651; color: #d1d4dc; border-radius: 4px;">
            </div>
            
            <div class="control-group">
                <button class="btn active" onclick="toggleVolume()" id="volumeBtn">Volume ON</button>
                <button class="btn active" onclick="toggleCandleSource()" id="candleSourceBtn">Aggregated ON</button>
                <button class="btn" onclick="refreshChart()" id="refreshBtn">Refresh</button>
            </div>
        </div>

        <div id="debugInfo" class="debug-info" style="display: none;">
            <!-- Debug information will be shown here -->
        </div>

        <div id="chartError" class="chart-error" style="display: none;">
            <!-- Error messages -->
        </div>

        <div id="chartLoading" class="chart-loading" style="display: none;">
            <div class="spinner"></div>
            <span>Loading chart...</span>
        </div>

        <div class="chart-container" id="chartContainer">
            <div class="chart-header">
                <div class="chart-title" id="chartTitle">Loading...</div>
                <div class="chart-info">
                    <div class="info-item">
                        <div class="info-label">O</div>
                        <div class="info-value" id="openPrice">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">H</div>
                        <div class="info-value" id="highPrice">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">L</div>
                        <div class="info-value" id="lowPrice">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">C</div>
                        <div class="info-value" id="closePrice">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Volume</div>
                        <div class="info-value" id="volumeInfo">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Change</div>
                        <div class="info-value" id="changeInfo">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Time</div>
                        <div class="info-value" id="timeInfo">--</div>
                    </div>
                </div>
            </div>
            <div id="chart"></div>
        </div>
    </div>

    <script src="/static/js/chart_manager.js?v=1774992000"></script>
    <script>
        let chartManager;
        let currentSymbol = null;
        let currentExchange = null;
        let currentTimeframe = '4h';
        let preferAggregated = true;

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                await initializeChart();
            } catch (error) {
                showError('Failed to initialize chart: ' + error.message);
                console.error('Initialization error:', error);
            }
        });

        async function initializeChart() {
            showLoading(true);
            showDebug('Initializing chart manager...');
            
            try {
                // Create chart manager
                chartManager = new ChartManager();
                await chartManager.loadConfiguration();
                showDebug('Chart manager configuration loaded');
                
                // Load available data sources
                await loadDataSources();
                showDebug('Data sources loaded');
                
                // Auto-select first available option
                await autoSelectFirstAvailable();
                
                showLoading(false);
                showDebug('Chart initialization completed');
                
            } catch (error) {
                showLoading(false);
                showDebug('ERROR: ' + error.message);
                throw error;
            }
        }

        async function loadDataSources() {
            try {
                const response = await fetch('/api/data/sources');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                if (!data.sources || data.sources.length === 0) {
                    throw new Error('No historical data sources found');
                }
                
                // Extract unique exchanges and symbols
                const exchanges = [...new Set(data.sources.map(d => d.exchange))];
                const symbols = [...new Set(data.sources.map(d => d.symbol))];

                // Populate selects
                populateSelect('exchangeSelect', exchanges);
                populateSelect('symbolSelect', symbols);
                
                // Set current values from first options
                if (exchanges.length > 0) currentExchange = exchanges[0];
                if (symbols.length > 0) currentSymbol = symbols[0];
                
                showDebug(`Found ${exchanges.length} exchanges, ${symbols.length} symbols`);
                
            } catch (error) {
                console.error('Failed to load data sources:', error);
                showError('Failed to load data sources: ' + error.message);
                throw error;
            }
        }

        function populateSelect(selectId, options) {
            const select = document.getElementById(selectId);
            select.innerHTML = '';
            
            if (options.length === 0) {
                select.innerHTML = '<option value="">No data available</option>';
                return;
            }
            
            options.forEach((option, index) => {
                const optionElement = document.createElement('option');
                optionElement.value = option;
                optionElement.textContent = option;
                // Auto-select first option
                if (index === 0) {
                    optionElement.selected = true;
                }
                select.appendChild(optionElement);
            });
        }

        async function autoSelectFirstAvailable() {
            const exchangeSelect = document.getElementById('exchangeSelect');
            const symbolSelect = document.getElementById('symbolSelect');
            
            if (exchangeSelect.options.length > 0 && symbolSelect.options.length > 0) {
                // Select first options
                exchangeSelect.selectedIndex = 0;
                symbolSelect.selectedIndex = 0;
                
                // Force update current values from select elements
                currentExchange = exchangeSelect.options[0].value;
                currentSymbol = symbolSelect.options[0].value;
                
                showDebug(`Auto-selected: ${currentExchange}/${currentSymbol}/${currentTimeframe}`);
                console.log(`DEBUG: Set currentExchange=${currentExchange}, currentSymbol=${currentSymbol}`);
                
                // Load available timeframes for selected exchange/symbol
                await loadAvailableTimeframes();
                
                // Create and load chart
                await createAndLoadChart();
            } else {
                throw new Error('No data sources available for auto-selection');
            }
        }

        async function loadAvailableTimeframes() {
            try {
                if (!currentExchange || !currentSymbol) {
                    showDebug('Cannot load timeframes: missing exchange or symbol');
                    return;
                }

                const response = await fetch(`/api/data/timeframes?exchange=${currentExchange}&symbol=${currentSymbol}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                if (!data.timeframes || data.timeframes.length === 0) {
                    showDebug('No timeframes available for selected exchange/symbol');
                    return;
                }
                
                // Populate timeframe select
                const timeframeSelect = document.getElementById('timeframeSelect');
                timeframeSelect.innerHTML = '';
                
                let defaultSet = false;
                
                data.timeframes.forEach((tf, index) => {
                    const option = document.createElement('option');
                    // Create unique value that includes both timeframe and source
                    option.value = `${tf.timeframe}_${tf.source}`;
                    option.dataset.timeframe = tf.timeframe;
                    option.dataset.source = tf.source;
                    
                    // Show source type and candle count
                    const sourceLabel = tf.source === 'aggregated' ? 'Agg' : 
                                       tf.source === 'main' ? 'Src' : 'Leg';
                    option.textContent = `✓ ${tf.timeframe.toUpperCase()} (${tf.candles_count} ${sourceLabel})`;
                    
                    // Set default selection (prefer 4h, then first available)
                    if (tf.timeframe === currentTimeframe || (!defaultSet && tf.timeframe === '4h')) {
                        option.selected = true;
                        currentTimeframe = tf.timeframe;
                        defaultSet = true;
                    }
                    
                    timeframeSelect.appendChild(option);
                });
                
                // If no preferred timeframe found, select first one
                if (!defaultSet && timeframeSelect.children.length > 0) {
                    timeframeSelect.children[0].selected = true;
                    currentTimeframe = data.timeframes[0].timeframe;
                    // Set preferAggregated based on the selected source
                    if (data.timeframes[0].source === 'aggregated') {
                        preferAggregated = true;
                    } else if (data.timeframes[0].source === 'main') {
                        preferAggregated = false;
                    }
                }
                
                // Add change event listener
                timeframeSelect.onchange = function() {
                    if (this.value) {
                        const selectedOption = this.options[this.selectedIndex];
                        const timeframe = selectedOption.dataset.timeframe;
                        const source = selectedOption.dataset.source;
                        setTimeframe(timeframe, source);
                    }
                };
                
                showDebug(`Loaded ${data.timeframes.length} timeframes, active: ${currentTimeframe}`);
                
            } catch (error) {
                console.error('Failed to load timeframes:', error);
                showDebug('Warning: Failed to load timeframes, using defaults');
                
                // Fallback to hardcoded timeframes
                const timeframeSelect = document.getElementById('timeframeSelect');
                timeframeSelect.innerHTML = `
                    <option value="1m" selected>1M</option>
                    <option value="1h">1H</option>
                    <option value="4h">4H</option>
                    <option value="1d">1D</option>
                `;
                currentTimeframe = '1m';
                
                timeframeSelect.onchange = function() {
                    if (this.value) {
                        setTimeframe(this.value);
                    }
                };
            }
        }

        async function createAndLoadChart() {
            if (!currentExchange || !currentSymbol) {
                throw new Error('Exchange and symbol must be selected');
            }
            
            try {
                showDebug(`Creating chart for ${currentExchange}/${currentSymbol}/${currentTimeframe}`);
                
                // Create chart
                chartManager.createChart('chart', currentSymbol, currentTimeframe);
                chartManager.setupCrosshairTracking('chart');
                chartManager.setupAutoResize('chart');
                
                // Force immediate resize after chart creation
                setTimeout(() => {
                    const container = document.getElementById('chart');
                    const chart = chartManager.charts['chart'];
                    if (container && chart) {
                        const fullWidth = container.clientWidth || container.offsetWidth || window.innerWidth - 40;
                        chart.chart.applyOptions({ width: fullWidth });
                        console.log(`Chart force-resized to: ${fullWidth}px`);
                    }
                }, 100);
                
                // Load initial data
                await loadChartData();
                
                showDebug('Chart created and data loaded successfully');
                
            } catch (error) {
                showDebug('ERROR creating chart: ' + error.message);
                throw error;
            }
        }

        async function loadChartData() {
            if (!currentExchange || !currentSymbol || !currentTimeframe) {
                throw new Error('Missing required parameters for chart data');
            }
            
            try {
                showDebug(`Loading data: ${currentExchange}/${currentSymbol}/${currentTimeframe}`);
                
                // Get limit from input field
                const limitInput = document.getElementById('limitInput');
                const limit = limitInput ? parseInt(limitInput.value) || 500 : 500;
                
                const data = await chartManager.loadChartData(
                    currentExchange,
                    currentSymbol,
                    currentTimeframe,
                    { prefer_aggregated: preferAggregated, limit: limit }
                );
                
                chartManager.updateChart('chart', data);
                showDebug(`Loaded ${data.count || 0} candles`);
                
            } catch (error) {
                console.error('Failed to load chart data:', error);
                showError('Failed to load chart data: ' + error.message);
                showDebug('ERROR loading data: ' + error.message);
                throw error;
            }
        }

        function setTimeframe(timeframe, source) {
            currentTimeframe = timeframe;
            showDebug(`Timeframe changed to: ${timeframe} (${source})`);
            
            // Update timeframe in chart manager
            if (chartManager && chartManager.charts['chart']) {
                chartManager.setTimeframe('chart', timeframe).catch(error => {
                    console.error('Failed to update chart timeframe:', error);
                });
            }
            
            // Update the prefer_aggregated setting based on the selected source
            if (source === 'aggregated') {
                preferAggregated = true;
            } else if (source === 'main') {
                preferAggregated = false;
            }
            
            // Update the Aggregated button state
            const btn = document.getElementById('candleSourceBtn');
            if (btn) {
                btn.textContent = preferAggregated ? 'Aggregated ON' : 'Source ON';
                btn.classList.toggle('active', preferAggregated);
            }
            
            // Reload chart data
            loadChartData().catch(error => {
                console.error('Failed to set timeframe:', error);
                showError('Failed to change timeframe');
            });
        }

        async function onExchangeChange() {
            const exchange = document.getElementById('exchangeSelect').value;
            if (!exchange) return;
            
            currentExchange = exchange;
            showDebug(`Exchange changed to: ${exchange}`);
            
            // Reload timeframes for new exchange
            await loadAvailableTimeframes();
            reloadChart();
        }

        async function onSymbolChange() {
            const symbol = document.getElementById('symbolSelect').value;
            if (!symbol) return;
            
            currentSymbol = symbol;
            showDebug(`Symbol changed to: ${symbol}`);
            
            // Reload timeframes for new symbol
            await loadAvailableTimeframes();
            
            chartManager.updateSymbol('chart', symbol)
                .catch(error => {
                    console.error('Failed to update symbol:', error);
                    showError('Failed to change symbol');
                });
        }

        async function reloadChart() {
            try {
                showLoading(true);
                await loadChartData();
                showLoading(false);
            } catch (error) {
                showLoading(false);
                console.error('Failed to reload chart:', error);
                showError('Failed to reload chart data');
            }
        }

        function refreshChart() {
            showDebug('Manual refresh requested');
            reloadChart();
        }

        function toggleVolume() {
            chartManager.toggleVolume('chart');
        }

        function toggleCandleSource() {
            preferAggregated = !preferAggregated;
            const btn = document.getElementById('candleSourceBtn');
            if (btn) {
                btn.textContent = preferAggregated ? 'Aggregated ON' : 'Source ON';
                btn.classList.toggle('active', preferAggregated);
            }
            showDebug(`Candle source changed to: ${preferAggregated ? 'Aggregated' : 'Source'}`);
            reloadChart();
        }

        function showLoading(show) {
            document.getElementById('chartLoading').style.display = show ? 'flex' : 'none';
            document.getElementById('chartContainer').style.display = show ? 'none' : 'block';
        }

        function showError(message) {
            const errorDiv = document.getElementById('chartError');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 10000);
        }

        function showDebug(message) {
            const debugDiv = document.getElementById('debugInfo');
            const timestamp = new Date().toLocaleTimeString();
            debugDiv.innerHTML += `[${timestamp}] ${message}<br>`;
            debugDiv.style.display = 'block';
            debugDiv.scrollTop = debugDiv.scrollHeight;
            console.log(`[DEBUG] ${message}`);
        }

        // Event listeners
        document.getElementById('exchangeSelect').addEventListener('change', onExchangeChange);
        document.getElementById('symbolSelect').addEventListener('change', onSymbolChange);
        
        // Add event listener for limit input changes
        document.getElementById('limitInput').addEventListener('change', async function() {
            if (currentExchange && currentSymbol && currentTimeframe) {
                await loadChartData();
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(event) {
            if (event.key === 'r' || event.key === 'R') {
                if (!event.ctrlKey && !event.metaKey) {
                    event.preventDefault();
                    refreshChart();
                }
            }
            
            if (event.key === 'v' || event.key === 'V') {
                if (!event.ctrlKey && !event.metaKey) {
                    event.preventDefault();
                    toggleVolume();
                }
            }
            
            if (event.key === 'd' || event.key === 'D') {
                if (!event.ctrlKey && !event.metaKey) {
                    event.preventDefault();
                    const debugDiv = document.getElementById('debugInfo');
                    debugDiv.style.display = debugDiv.style.display === 'none' ? 'block' : 'none';
                }
            }
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (chartManager) {
                chartManager.destroyAll();
            }
        });
    </script>
</body>
</html>
