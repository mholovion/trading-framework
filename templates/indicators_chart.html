<!DOCTYPE html>
<html>
<head>
    <title>Indicators Chart</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #131722;
            color: #d1d4dc;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a2e39;
        }
        
        .header h1 {
            color: #d1d4dc;
            font-size: 24px;
            font-weight: 600;
        }
        
        .nav-links {
            display: flex;
            gap: 15px;
        }
        
        .nav-link {
            color: #868b94;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .nav-link:hover {
            color: #d1d4dc;
            background: #2a2e39;
        }
        
        .chart-error {
            background: #dc3545;
            color: white;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
            text-align: center;
        }
        
        .chart-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px;
            color: #d1d4dc;
        }
        
        .spinner {
            border: 3px solid #2a2e39;
            border-top: 3px solid #2962ff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .control-group label {
            color: #868b94;
            font-size: 14px;
            min-width: 60px;
        }
        
        .btn {
            background: #2962ff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        
        .btn:hover {
            background: #1e53e5;
        }
        
        .btn.active {
            background: #26a69a;
        }
        
        .btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        select {
            background: #2a2e39;
            color: white;
            border: 1px solid #3a3e49;
            padding: 8px 12px;
            border-radius: 4px;
            min-width: 120px;
        }
        
        .chart-container {
            background: #1e222d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            overflow: hidden;
            max-width: 100%;
        }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2e39;
        }
        
        .chart-title {
            font-size: 18px;
            font-weight: bold;
            color: #d1d4dc;
        }
        
        .chart-info {
            display: flex;
            gap: 20px;
            font-size: 14px;
            flex-wrap: wrap;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .info-label {
            color: #868b94;
            font-size: 12px;
        }
        
        .info-value {
            color: #d1d4dc;
            font-weight: 500;
        }
        
        .price-up { color: #26a69a; }
        .price-down { color: #ef5350; }
        
        #chart {
            width: 100%;
            height: 600px;
            min-height: 600px;
            max-width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            overflow: hidden;
        }

        #indicatorChart {
            width: 100%;
            height: 300px;
            min-height: 300px;
            max-width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            overflow: hidden;
        }
        
        #timeframeButtons {
            display: flex;
            gap: 5px;
        }
        
        .indicators-panel {
            background: #1e222d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .indicators-header {
            font-size: 18px;
            font-weight: bold;
            color: #d1d4dc;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2e39;
        }
        
        .indicators-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .indicator-btn {
            background: #2a2e39;
            color: #d1d4dc;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .indicator-btn:hover {
            background: #3a3e49;
        }
        
        .indicator-btn.active {
            background: #26a69a;
            color: white;
        }
        
        .indicator-btn.loading {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        .indicator-colors {
            display: flex;
            gap: 5px;
            margin-left: 10px;
        }
        
        .color-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #3a3e49;
        }
        
        .status-panel {
            background: #1e222d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .status-item {
            background: #2a2e39;
            padding: 15px;
            border-radius: 6px;
        }
        
        .status-name {
            font-weight: bold;
            color: #d1d4dc;
            margin-bottom: 5px;
        }
        
        .status-value {
            color: #868b94;
            font-size: 14px;
        }
        
        .status-enabled {
            color: #26a69a;
        }
        
        .status-disabled {
            color: #ef5350;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .chart-info {
                gap: 10px;
                justify-content: center;
            }
            
            .chart-header {
                flex-direction: column;
                gap: 15px;
            }
            
            .status-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Indicators Chart</h1>
            <div class="nav-links">
                <a href="/" class="nav-link">← Dashboard</a>
                <a href="/chart" class="nav-link">📈 Trading Chart</a>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Exchange:</label>
                <select id="exchangeSelect">
                    <option value="">Loading...</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Symbol:</label>
                <select id="symbolSelect">
                    <option value="">Loading...</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Timeframe:</label>
                <select id="timeframeSelect">
                    <option value="">Loading...</option>
                </select>
            </div>
            
            <div class="control-group">
                <button class="btn active" onclick="toggleVolume()" id="volumeBtn">Volume ON</button>
                <button class="btn active" onclick="toggleCandleSource()" id="candleSourceBtn">Aggregated ON</button>
                <button class="btn active" onclick="toggleIndicatorCandleSource()" id="indicatorCandleSourceBtn">Indicator Agg ON</button>
                <button class="btn" onclick="toggleAutoRefresh()" id="autoRefreshBtn">Auto Refresh OFF</button>
                <button class="btn" onclick="refreshChart()" id="refreshBtn">Refresh</button>
                <button class="btn" onclick="debugAPI()" id="debugBtn">Debug API</button>
                <button class="btn" onclick="testSimpleRSI()" id="testBtn">Test RSI</button>
            </div>
        </div>

        <div class="indicators-panel">
            <div class="indicators-header">
                Available Indicators
                <div class="indicator-colors">
                    <div class="color-indicator" style="background: #ff6b6b;" title="RSI"></div>
                    <div class="color-indicator" style="background: #4ecdc4;" title="MACD"></div>
                    <div class="color-indicator" style="background: #45b7d1;" title="Bollinger Bands"></div>
                    <div class="color-indicator" style="background: #f9ca24;" title="SMA"></div>
                    <div class="color-indicator" style="background: #6c5ce7;" title="EMA"></div>
                </div>
            </div>
            <div class="indicators-list" id="indicatorsList">
                <button class="indicator-btn loading">Loading indicators...</button>
            </div>
        </div>

        <div class="status-panel">
            <div class="indicators-header">Indicators Status</div>
            <div class="status-grid" id="statusGrid">
                <div class="status-item">
                    <div class="status-name">Loading...</div>
                    <div class="status-value">Please wait</div>
                </div>
            </div>
        </div>

        <div id="chartError" class="chart-error" style="display: none;">
            <!-- Error messages -->
        </div>

        <div id="chartLoading" class="chart-loading" style="display: none;">
            <div class="spinner"></div>
            <span>Loading chart...</span>
        </div>

        <div class="chart-container" id="chartContainer">
            <div class="chart-header">
                <div class="chart-title" id="chartTitle">Loading...</div>
                <div class="chart-info">
                    <div class="info-item">
                        <div class="info-label">O</div>
                        <div class="info-value" id="openPrice">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">H</div>
                        <div class="info-value" id="highPrice">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">L</div>
                        <div class="info-value" id="lowPrice">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">C</div>
                        <div class="info-value" id="closePrice">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Volume</div>
                        <div class="info-value" id="volumeInfo">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Change</div>
                        <div class="info-value" id="changeInfo">--</div>
                    </div>
                </div>
            </div>
            <div id="chart"></div>
        </div>

        <div class="chart-container" id="indicatorChartContainer" style="display: none;">
            <div class="chart-header">
                <div class="chart-title" id="indicatorChartTitle">Select an indicator</div>
                <div class="chart-info">
                    <div class="info-item">
                        <div class="info-label">Current</div>
                        <div class="info-value" id="indicatorCurrentValue">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Min</div>
                        <div class="info-value" id="indicatorMinValue">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Max</div>
                        <div class="info-value" id="indicatorMaxValue">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Avg</div>
                        <div class="info-value" id="indicatorAvgValue">--</div>
                    </div>
                </div>
            </div>
            <div id="indicatorChart"></div>
        </div>
    </div>

    <script src="/static/js/chart_manager.js?v=1774992000"></script>
    <script>
        let chartManager;
        let autoRefreshInterval;
        let autoRefreshEnabled = false;
        let currentSymbol = '';
        let currentExchange = '';
        let currentTimeframe = '4h';
        let activeIndicators = new Set();
        let preferAggregated = true;
        let preferIndicatorAggregated = true;
        let indicatorColors = {
            'rsi': '#ff6b6b',
            'macd': '#4ecdc4',
            'bollinger_bands': '#45b7d1',
            'sma': '#f9ca24',
            'ema': '#6c5ce7',
            'stochastic': '#a55eea',
            'williams_r': '#26de81',
            'cci': '#fd79a8',
            'adx': '#fdcb6e',
            'momentum': '#e17055'
        };

        // Ініціалізація
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                await initializeChart();
                await loadIndicatorsStatus();
            } catch (error) {
                showError('Failed to initialize: ' + error.message);
            }
        });

        async function initializeChart() {
            showLoading(true);
            
            try {
                // Створюємо менеджер графіків
                chartManager = new ChartManager();
                
                // Завантажуємо конфігурацію (дефолтну)
                await chartManager.loadConfiguration();
                
                // Завантажуємо доступні джерела даних
                await loadDataSources();
                
                // Створюємо графік з дефолтними параметрами
                console.log('Creating chart container...');
                chartManager.createPriceOnlyChart('chart', currentSymbol, currentTimeframe);
                console.log('Chart created successfully');
                chartManager.setupCrosshairTracking('chart');
                chartManager.setupAutoResize('chart');
                
                // Завантажуємо початкові дані
                await loadInitialData();
                
                // Завантажуємо доступні індикатори
                await loadAvailableIndicators();
                
                showLoading(false);
                
            } catch (error) {
                showLoading(false);
                throw error;
            }
        }

        async function loadDataSources() {
            try {
                const response = await fetch('/api/data/sources');
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                // Отримуємо унікальні біржі та символи
                const sources = data.sources || [];
                const exchanges = [...new Set(sources.map(d => d.exchange))];
                const symbols = [...new Set(sources.map(d => d.symbol))];

                // Заповнюємо селекти
                populateSelect('exchangeSelect', exchanges, currentExchange);
                populateSelect('symbolSelect', symbols, currentSymbol);
                
                // Load available timeframes
                await loadAvailableTimeframes();
                
            } catch (error) {
                console.error('Failed to load data sources:', error);
                showError('Failed to load data sources');
            }
        }

        async function loadAvailableIndicators() {
            try {
                const indicators = await chartManager.getAvailableIndicators();
                const indicatorsList = document.getElementById('indicatorsList');
                
                if (indicators.length === 0) {
                    indicatorsList.innerHTML = '<button class="indicator-btn" disabled>No indicators available</button>';
                    return;
                }
                
                indicatorsList.innerHTML = '';
                indicators.forEach(indicator => {
                    const button = document.createElement('button');
                    button.className = 'indicator-btn';
                    button.textContent = indicator.toUpperCase();
                    button.onclick = () => toggleIndicator(indicator, button);
                    indicatorsList.appendChild(button);
                });
                
            } catch (error) {
                console.error('Failed to load indicators:', error);
                const indicatorsList = document.getElementById('indicatorsList');
                indicatorsList.innerHTML = '<button class="indicator-btn" disabled>Error loading indicators</button>';
            }
        }

        async function loadIndicatorsStatus() {
            try {
                const response = await fetch('/api/indicators/status');
                const status = await response.json();
                
                if (status.error) {
                    throw new Error(status.error);
                }
                
                updateStatusGrid(status);
                
            } catch (error) {
                console.error('Failed to load indicators status:', error);
                const statusGrid = document.getElementById('statusGrid');
                statusGrid.innerHTML = '<div class="status-item"><div class="status-name">Error</div><div class="status-value status-disabled">Failed to load status</div></div>';
            }
        }

        function updateStatusGrid(status) {
            const statusGrid = document.getElementById('statusGrid');
            statusGrid.innerHTML = '';
            
            // Handle new API format
            const indicators = status.indicators || [];
            
            if (indicators.length === 0) {
                statusGrid.innerHTML = '<div class="status-item"><div class="status-name">No Data</div><div class="status-value status-disabled">No indicators found</div></div>';
                return;
            }
            
            indicators.forEach(indicator => {
                const statusItem = document.createElement('div');
                statusItem.className = 'status-item';
                
                const isActive = indicator.status === 'active';
                const count = indicator.count || 0;
                const lastUpdate = indicator.last_update ? new Date(indicator.last_update).toLocaleString() : 'N/A';
                
                statusItem.innerHTML = `
                    <div class="status-name">${indicator.name.toUpperCase()}</div>
                    <div class="status-value ${isActive ? 'status-enabled' : 'status-disabled'}">
                        ${indicator.status}<br>
                        Count: ${count}<br>
                        Last Update: ${lastUpdate}
                    </div>
                `;
                
                statusGrid.appendChild(statusItem);
            });
        }

        async function toggleIndicator(indicatorName, button) {
            if (activeIndicators.has(indicatorName)) {
                // Ховаємо індикаторний графік
                activeIndicators.delete(indicatorName);
                button.classList.remove('active');
                document.getElementById('indicatorChartContainer').style.display = 'none';
            } else {
                // Показуємо індикаторний графік
                try {
                    button.classList.add('loading');
                    button.disabled = true;

                    // Показуємо контейнер ДО створення чарту і чекаємо render
                    document.getElementById('indicatorChartContainer').style.display = 'block';
                    await new Promise(resolve => requestAnimationFrame(resolve));

                    if (typeof chartManager.createIndicatorChart !== 'function') {
                        throw new Error('ChartManager.createIndicatorChart is not available. Please refresh the page.');
                    }
                    chartManager.createIndicatorChart('indicatorChart', indicatorName, currentTimeframe);

                    // Витягуємо timeframe з назви індикатора або використовуємо поточний
                    let indicatorTimeframe = currentTimeframe;
                    const timeframeMatch = indicatorName.match(/_(\d+[hmdsw])$/i);
                    if (timeframeMatch) {
                        indicatorTimeframe = timeframeMatch[1];
                    }

                    // Завантажуємо дані індикатора
                    const indicatorData = await chartManager.loadIndicatorData(
                        indicatorName,
                        currentExchange,
                        currentSymbol,
                        indicatorTimeframe,
                        { prefer_aggregated_candles: preferIndicatorAggregated }
                    );

                    // Відображаємо дані на графіку
                    chartManager.displayIndicatorData('indicatorChart', indicatorData, indicatorName);
                    
                    // Деактивуємо всі інші кнопки індикаторів
                    document.querySelectorAll('.indicator-btn.active').forEach(btn => {
                        if (btn !== button) btn.classList.remove('active');
                    });
                    activeIndicators.clear();
                    
                    activeIndicators.add(indicatorName);
                    button.classList.add('active');
                    
                } catch (error) {
                    console.error(`Failed to load indicator ${indicatorName}:`, error);
                    showError(`Failed to load ${indicatorName}: ${error.message}`);
                } finally {
                    button.classList.remove('loading');
                    button.disabled = false;
                }
            }
        }

        function populateSelect(selectId, options, defaultValue) {
            const select = document.getElementById(selectId);
            select.innerHTML = '<option value="">Select...</option>';
            
            options.forEach(option => {
                const optionElement = document.createElement('option');
                optionElement.value = option;
                optionElement.textContent = option;
                if (option === defaultValue) {
                    optionElement.selected = true;
                }
                select.appendChild(optionElement);
            });
        }

        async function loadAvailableTimeframes() {
            try {
                if (!currentExchange || !currentSymbol) {
                    console.log('Cannot load timeframes: missing exchange or symbol');
                    return;
                }

                const response = await fetch(`/api/data/timeframes?exchange=${currentExchange}&symbol=${currentSymbol}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                if (!data.timeframes || data.timeframes.length === 0) {
                    console.log('No timeframes available for selected exchange/symbol');
                    return;
                }
                
                // Populate timeframe select
                const timeframeSelect = document.getElementById('timeframeSelect');
                timeframeSelect.innerHTML = '';
                
                let defaultSet = false;
                
                data.timeframes.forEach((tf, index) => {
                    const option = document.createElement('option');
                    // Create unique value that includes both timeframe and source
                    option.value = `${tf.timeframe}_${tf.source}`;
                    option.dataset.timeframe = tf.timeframe;
                    option.dataset.source = tf.source;
                    
                    // Show source type and candle count
                    const sourceLabel = tf.source === 'aggregated' ? 'Agg' : 
                                       tf.source === 'main' ? 'Src' : 'Leg';
                    option.textContent = `✓ ${tf.timeframe.toUpperCase()} (${tf.candles_count} ${sourceLabel})`;
                    
                    // Set default selection (prefer 4h, then first available)
                    if (tf.timeframe === currentTimeframe || (!defaultSet && tf.timeframe === '4h')) {
                        option.selected = true;
                        currentTimeframe = tf.timeframe;
                        defaultSet = true;
                    }
                    
                    timeframeSelect.appendChild(option);
                });
                
                // If no preferred timeframe found, select first one
                if (!defaultSet && timeframeSelect.children.length > 0) {
                    timeframeSelect.children[0].selected = true;
                    currentTimeframe = data.timeframes[0].timeframe;
                }
                
                // Add change event listener
                timeframeSelect.onchange = function() {
                    if (this.value) {
                        const selectedOption = this.options[this.selectedIndex];
                        const timeframe = selectedOption.dataset.timeframe;
                        const source = selectedOption.dataset.source;
                        setTimeframe(timeframe, source);
                    }
                };
                
                console.log(`Loaded ${data.timeframes.length} timeframes, active: ${currentTimeframe}`);
                
            } catch (error) {
                console.error('Failed to load timeframes:', error);
                console.log('Warning: Failed to load timeframes, using defaults');
                
                // Fallback to hardcoded timeframes
                const timeframeSelect = document.getElementById('timeframeSelect');
                timeframeSelect.innerHTML = `
                    <option value="1h">1H</option>
                    <option value="4h" selected>4H</option>
                    <option value="1d">1D</option>
                `;
                currentTimeframe = '4h';
                
                timeframeSelect.onchange = function() {
                    if (this.value) {
                        setTimeframe(this.value);
                    }
                };
            }
        }

        async function loadInitialData() {
            try {
                const data = await chartManager.loadChartData(
                    currentExchange,
                    currentSymbol,
                    currentTimeframe,
                    { prefer_aggregated: preferAggregated }
                );
                
                chartManager.updateChart('chart', data);
                
            } catch (error) {
                console.error('Failed to load initial data:', error);
                showError('Failed to load chart data');
            }
        }

        function setTimeframe(timeframe, source) {
            currentTimeframe = timeframe;
            console.log(`Timeframe changed to: ${timeframe} (${source})`);
            
            // Update the prefer_aggregated setting based on the selected source
            if (source === 'aggregated') {
                preferAggregated = true;
                preferIndicatorAggregated = true;
            } else if (source === 'main') {
                preferAggregated = false;
                preferIndicatorAggregated = false;
            }
            
            // Update button states
            const candleBtn = document.getElementById('candleSourceBtn');
            if (candleBtn) {
                candleBtn.textContent = preferAggregated ? 'Aggregated ON' : 'Source ON';
                candleBtn.classList.toggle('active', preferAggregated);
            }
            
            const indicatorBtn = document.getElementById('indicatorCandleSourceBtn');
            if (indicatorBtn) {
                indicatorBtn.textContent = preferIndicatorAggregated ? 'Indicator Agg ON' : 'Indicator Src ON';
                indicatorBtn.classList.toggle('active', preferIndicatorAggregated);
            }
            
            // Оновлюємо графік
            chartManager.setTimeframe('chart', timeframe)
                .then(() => {
                    // Перезавантажуємо активні індикатори
                    reloadActiveIndicators();
                })
                .catch(error => {
                    console.error('Failed to set timeframe:', error);
                    showError('Failed to change timeframe');
                });
        }

        async function reloadActiveIndicators() {
            const activeIndicatorNames = Array.from(activeIndicators);
            activeIndicators.clear();
            
            // Очищуємо кнопки
            document.querySelectorAll('.indicator-btn.active').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Перезавантажуємо кожен індикатор
            for (const indicatorName of activeIndicatorNames) {
                const button = document.querySelector(`[onclick*="${indicatorName}"]`);
                if (button) {
                    await toggleIndicator(indicatorName, button);
                }
            }
        }

        async function onExchangeChange() {
            const exchange = document.getElementById('exchangeSelect').value;
            if (!exchange) return;
            
            currentExchange = exchange;
            console.log(`Exchange changed to: ${exchange}`);
            
            // Reload timeframes for new exchange
            await loadAvailableTimeframes();
            reloadChartData();
        }

        async function onSymbolChange() {
            const symbol = document.getElementById('symbolSelect').value;
            if (!symbol) return;
            
            currentSymbol = symbol;
            console.log(`Symbol changed to: ${symbol}`);
            
            // Reload timeframes for new symbol
            await loadAvailableTimeframes();
            
            chartManager.updateSymbol('chart', symbol)
                .then(() => {
                    reloadActiveIndicators();
                })
                .catch(error => {
                    console.error('Failed to update symbol:', error);
                    showError('Failed to change symbol');
                });
        }

        async function reloadChartData() {
            if (!currentExchange || !currentSymbol) return;
            
            try {
                showLoading(true);
                const data = await chartManager.loadChartData(
                    currentExchange,
                    currentSymbol,
                    currentTimeframe,
                    { prefer_aggregated: preferAggregated }
                );
                chartManager.updateChart('chart', data);
                await reloadActiveIndicators();
                showLoading(false);
            } catch (error) {
                showLoading(false);
                console.error('Failed to reload chart:', error);
                showError('Failed to reload chart data');
            }
        }

        function refreshChart() {
            reloadChartData();
            loadIndicatorsStatus();
        }

        function toggleVolume() {
            chartManager.toggleVolume('chart');
        }

        function toggleCandleSource() {
            preferAggregated = !preferAggregated;
            const btn = document.getElementById('candleSourceBtn');
            if (btn) {
                btn.textContent = preferAggregated ? 'Aggregated ON' : 'Source ON';
                btn.classList.toggle('active', preferAggregated);
            }
            reloadChartData();
        }

        function toggleIndicatorCandleSource() {
            preferIndicatorAggregated = !preferIndicatorAggregated;
            const btn = document.getElementById('indicatorCandleSourceBtn');
            if (btn) {
                btn.textContent = preferIndicatorAggregated ? 'Indicator Agg ON' : 'Indicator Src ON';
                btn.classList.toggle('active', preferIndicatorAggregated);
            }
            // Reload any active indicators
            reloadActiveIndicators();
        }

        function toggleAutoRefresh() {
            const btn = document.getElementById('autoRefreshBtn');
            
            if (autoRefreshEnabled) {
                clearInterval(autoRefreshInterval);
                autoRefreshEnabled = false;
                btn.textContent = 'Auto Refresh OFF';
                btn.classList.remove('active');
            } else {
                autoRefreshInterval = setInterval(() => {
                    refreshChart();
                }, 30000); // 30 секунд
                autoRefreshEnabled = true;
                btn.textContent = 'Auto Refresh ON';
                btn.classList.add('active');
            }
        }

        function showLoading(show) {
            document.getElementById('chartLoading').style.display = show ? 'flex' : 'none';
            document.getElementById('chartContainer').style.display = show ? 'none' : 'block';
        }

        function showError(message) {
            const errorDiv = document.getElementById('chartError');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            // Ховаємо помилку через 5 секунд
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // Event listeners
        document.getElementById('exchangeSelect').addEventListener('change', onExchangeChange);
        document.getElementById('symbolSelect').addEventListener('change', onSymbolChange);

        // Keyboard shortcuts
        document.addEventListener('keydown', function(event) {
            if (event.key === 'r' || event.key === 'R') {
                if (!event.ctrlKey && !event.metaKey) {
                    event.preventDefault();
                    refreshChart();
                }
            }
            
            if (event.key === 'a' || event.key === 'A') {
                if (!event.ctrlKey && !event.metaKey) {
                    event.preventDefault();
                    toggleAutoRefresh();
                }
            }
            
            if (event.key === 'v' || event.key === 'V') {
                if (!event.ctrlKey && !event.metaKey) {
                    event.preventDefault();
                    toggleVolume();
                }
            }
        });

        // Auto-refresh status every 30 seconds
        setInterval(() => {
            loadIndicatorsStatus();
        }, 30000);

        // Debug API function
        async function debugAPI() {
            console.log('=== API DEBUG STARTED ===');
            
            try {
                // Test indicators status endpoint
                console.log('Testing /api/indicators/status...');
                const statusResponse = await fetch('/api/indicators/status');
                const statusData = await statusResponse.json();
                console.log('Indicators Status:', statusData);
                
                // Test active indicators using current exchange/symbol
                const testCombos = Array.from(activeIndicators).slice(0, 4).map(ind => ({
                    indicator: ind, timeframe: currentTimeframe
                }));

                for (const combo of testCombos) {
                    const url = `/api/indicators/${combo.indicator}/data?exchange=${currentExchange}&symbol=${currentSymbol}&timeframe=${combo.timeframe}&limit=10`;
                    console.log(`Testing: ${url}`);
                    
                    try {
                        const response = await fetch(url);
                        const data = await response.json();
                        console.log(`✅ Result for ${combo.indicator}/${combo.timeframe}:`, data);
                        
                        if (data.data && data.data.length > 0) {
                            console.log(`📊 Found ${data.data.length} data points for ${combo.indicator}/${combo.timeframe}`);
                        }
                    } catch (error) {
                        console.log(`❌ Error for ${combo.indicator}/${combo.timeframe}:`, error);
                    }
                }
                
            } catch (error) {
                console.error('Debug API failed:', error);
            }
            
            console.log('=== API DEBUG COMPLETED ===');
        }

        // Simple test function for RSI
        async function testSimpleRSI() {
            console.log('=== TESTING SIMPLE RSI ===');
            
            try {
                // Create a simple mock data for testing
                const mockData = {
                    data: [
                        { timestamp: Date.now() - 3600000, value: 30.5 },
                        { timestamp: Date.now() - 1800000, value: 45.2 },
                        { timestamp: Date.now(), value: 65.78 }
                    ]
                };
                
                console.log('Using mock RSI data:', mockData);
                
                // Show indicator chart container
                document.getElementById('indicatorChartContainer').style.display = 'block';
                
                // Create chart
                if (typeof chartManager.createIndicatorChart === 'function') {
                    chartManager.createIndicatorChart('indicatorChart', 'test_rsi', currentTimeframe);
                    chartManager.displayIndicatorData('indicatorChart', mockData, 'test_rsi');
                    
                    console.log('✅ Mock RSI chart created successfully');
                } else {
                    console.error('❌ ChartManager methods not available');
                }
                
            } catch (error) {
                console.error('❌ Test RSI failed:', error);
            }
            
            console.log('=== TEST COMPLETED ===');
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
            
            if (chartManager) {
                chartManager.destroyAll();
            }
        });
    </script>
</body>
</html>
