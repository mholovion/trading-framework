[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name for PyPI ("tradingkit" is already taken by an unrelated package) --
# the importable package is still `tradingkit` (see [tool.setuptools.packages.find]
# below), so `import tradingkit` in every example stays unchanged.
name = "tradingkit-py"
version = "0.1.1"
description = "Async trading framework with Polars, ClickHouse, and pluggable executors"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BUSL-1.1" }
authors = [
    { name = "Maksym Holovin", email = "holovin.maksym@gmail.com" },
]
dependencies = [
    "aiohttp>=3.9.0,<4.0.0",
    "aiohttp-jinja2==1.5.1",
    "jinja2==3.1.2",
    "polars>=0.20",
    "pyarrow>=14.0.0",
    "numpy>=2.2.6",
    "TA-Lib>=0.4.0",
    "numba>=0.59.0",
    "asynch>=0.2.0",
    "pydantic>=2.6.0,<3.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "pytz>=2023.3",
    "rich>=13.7.0,<14.0.0",
    "websockets>=12.0,<13.0",
]

[project.urls]
Homepage = "https://github.com/nivolon/trading-framework"
Repository = "https://github.com/nivolon/trading-framework"
Issues = "https://github.com/nivolon/trading-framework/issues"

[project.optional-dependencies]
# ruff has repeatedly expanded its *default* rule set across 0.x minor releases (not just
# added opt-in rules) -- an unbounded ruff>=0.4 means CI silently starts enforcing new
# categories on old code the day a newer ruff resolves, with no code change to explain the
# failure. Capped to the range verified clean; bump deliberately, not implicitly.
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.9", "ruff>=0.4,<0.17"]
cpp = ["docker>=7.0.0"]

[project.scripts]
tradingkit-runner = "tradingkit.runner.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tradingkit*"]

[tool.setuptools.package-data]
"tradingkit" = [
    "py.typed",
    "_docker/runner/Dockerfile",
    "_docker/runner/runner_worker.py",
    "_docker/runner/seccomp.json",
    "_docker/compiler/Dockerfile",
    "_docker/compiler/compile.sh",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    # E702 (semicolon-joined statements) is a deliberate, consistent style throughout the
    # ClickHouse query-building methods: `if x is not None: where += "..."; params["k"] = x`
    # keeps each optional filter to one line. Not a formatting slip — leave it alone.
    "E702",
    # BLE001/S110 (blind except / try-except-pass): worker loops, best-effort cleanup, and
    # dynamic script execution (Script*/Cpp* plugins run arbitrary user code via exec()) all
    # deliberately catch Exception broadly so one bad indicator/strategy/connection can't
    # take down a long-running process. Narrowing these would be wrong, not incomplete.
    "BLE001",
    "S110",
    # RUF022 (__all__ not sorted): __all__ lists are hand-grouped by category with comments
    # (# Indicator, # Strategy, # Source, ...) documenting the public API's shape -- forcing
    # alphabetical order would destroy that grouping for no readability gain.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# B018 (useless expression): `with pytest.raises(AttributeError): sig.nonexistent` is the
# standard idiom for asserting a dynamic __getattr__ raises -- the attribute access *is*
# the assertion, assigning it to a throwaway variable would add nothing.
"tests/*" = ["B018"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
